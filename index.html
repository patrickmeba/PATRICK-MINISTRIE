<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Bloc-notes</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; color: #222; }
    header { background: #1e3a8a; color: #fff; padding: 18px; text-align: center; }
    main { max-width: 700px; margin: 20px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    input, textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-family: inherit; }
    textarea { min-height: 180px; resize: vertical; }
    button { background: #1e3a8a; color: #fff; border: 0; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    button.suppr { background: #b91c1c; padding: 6px 12px; font-size: 14px; }
    .note { border-bottom: 1px solid #eee; padding: 12px 0; }
    .note h3 { margin: 0 0 4px; }
    .note small { color: #666; }
    .note p { white-space: pre-wrap; margin: 8px 0; }
    .msg { margin-top: 10px; font-size: 14px; color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>📝 Mon Bloc-notes</h1>
  </header>

  <main>
    <div class="card">
      <h2 style="margin-top:0">Nouvelle note</h2>
      <input id="titre" placeholder="Titre de la note">
      <textarea id="texte" placeholder="Écrivez votre note ici..."></textarea>
      <button id="btnSauver">Enregistrer</button>
      <div id="msgNotes" class="msg"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Mes notes</h2>
      <div id="liste">Chargement...</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query,
             orderBy, onSnapshot, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWgO8H51io0ttkz0GzVJP6CIKPNocrBEY",
      authDomain: "patrick-ministrie.firebaseapp.com",
      projectId: "patrick-ministrie",
      storageBucket: "patrick-ministrie.firebasestorage.app",
      messagingSenderId: "618899633529",
      appId: "1:618899633529:web:30465e48499a3a47292ba8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const notesRef = collection(db, "notes");

    const $ = (id) => document.getElementById(id);

    function erreurFr(e) {
      const c = e.code || "";
      if (c.includes("permission-denied")) return "Accès refusé : publiez les règles Firestore (voir étape 2).";
      if (c.includes("api-key")) return "La clé apiKey est incorrecte. Copiez-la depuis la console Firebase.";
      if (c.includes("failed-precondition") || c.includes("not-found")) return "Créez d'abord la base Firestore dans la console Firebase.";
      return "Erreur : " + (e.message || c);
    }

    $("btnSauver").onclick = async () => {
      const titre = $("titre").value.trim() || "Sans titre";
      const texte = $("texte").value.trim();
      if (!texte) { $("msgNotes").textContent = "Écrivez quelque chose d'abord."; return; }
      $("msgNotes").textContent = "";
      try {
        await addDoc(notesRef, { titre, texte, date: serverTimestamp() });
        $("titre").value = ""; $("texte").value = "";
      } catch (e) { $("msgNotes").textContent = erreurFr(e); }
    };

    function afficherNotes(snapshot) {
      const liste = $("liste");
      liste.innerHTML = "";
      if (snapshot.empty) { liste.textContent = "Aucune note pour le moment."; return; }
      snapshot.forEach((d) => {
        const n = d.data();
        const div = document.createElement("div");
        div.className = "note";
        const h = document.createElement("h3"); h.textContent = n.titre;
        const s = document.createElement("small");
        s.textContent = n.date ? n.date.toDate().toLocaleString("fr-FR") : "à l'instant";
        const p = document.createElement("p"); p.textContent = n.texte;
        const b = document.createElement("button");
        b.className = "suppr"; b.textContent = "Supprimer";
        b.onclick = async () => {
          if (confirm("Supprimer cette note ?")) await deleteDoc(doc(db, "notes", d.id));
        };
        div.append(h, s, p, b);
        liste.appendChild(div);
      });
    }

    onSnapshot(query(notesRef, orderBy("date", "desc")), afficherNotes,
      (e) => { $("liste").textContent = erreurFr(e); });
  </script>
</body>
</html>
