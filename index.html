<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloc-notes</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1f1b16;--mu:#7a6f61;--ac:#8a2b1d;--ln:#e4dccd;--hb:#f3e9d2;--hi:#ffe27a;--fs:17px;--lw:34%;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--card:#211d17;--tx:#eee6d8;--mu:#a99d8b;--ac:#e58a74;--ln:#3a332a;--hb:#2c261d;--hi:#7a6200;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif;padding-top:env(safe-area-inset-top);overflow:hidden}
header{flex:none;padding:8px 10px;border-bottom:1px solid var(--ln);background:var(--bg)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:6px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
#q{flex:1;min-width:140px;width:auto}
button{font:600 13px system-ui,sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button.dng{color:#c0392b}
button:disabled{opacity:.3}
#info{font:12px system-ui,sans-serif;color:var(--mu);margin-left:auto}
#wrap{flex:1;min-height:0;display:flex;position:relative}
#list{flex:none;width:var(--lw);overflow-y:auto;padding:8px 8px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#rz{flex:none;width:14px;margin:0 -4px;z-index:3;cursor:col-resize;touch-action:none;position:relative}
#rz::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--ln)}
#rz::after{content:"⋮";position:absolute;top:50%;left:0;width:14px;height:44px;margin-top:-22px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--ln);border-radius:7px;color:var(--ac);font:700 16px system-ui}
#pane{flex:1;min-width:0;overflow-y:auto;padding:0 clamp(12px,2.5vw,30px) calc(70px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
body.only #list{display:none}
body.only #rz{margin:0}
body.drag{user-select:none;-webkit-user-select:none}
.it{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px;border-radius:10px;font:700 13px/1.35 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--ac);background:var(--card);border:1px solid var(--ln)}
.it.sel{background:var(--hb);border-color:var(--ac)}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--ln);margin-bottom:8px}
.dh h2{flex:1;margin:0;font:700 15px/1.3 system-ui,sans-serif;color:var(--ac);text-transform:uppercase}
.dh button{width:40px;height:40px;font-size:20px;padding:0}
.txt{max-width:800px;margin:auto;font-size:var(--fs)}
.txt p{margin:10px 0;text-align:justify;hyphens:auto}
.txt p.ref{font:700 14px system-ui,sans-serif;color:var(--ac);margin-top:18px;text-align:left}
.txt p.v{margin-left:10px;padding-left:10px;border-left:3px solid var(--ln);font-style:italic}
mark{background:var(--hi);color:inherit;border-radius:3px}
.vide{text-align:center;color:var(--mu);padding:40px 12px;font-family:system-ui,sans-serif}
.act{max-width:800px;margin:18px auto 0;display:flex;gap:8px}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,640px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 8px;color:var(--ac)}
dialog label{display:block;margin:10px 0 4px;font:600 12px system-ui,sans-serif;color:var(--mu)}
dialog .bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
dialog .bt button{flex:1;min-height:44px}
</style></head><body>
<header>
 <div class="row">
  <input id="q" type="search" placeholder="Rechercher un sujet, un mot…" autocomplete="off">
  <button id="bn">+ Sujet</button>
 </div>
 <div class="row">
  <button data-v="split">◧ Sujets + contenu</button>
  <button data-v="only">▣ Contenu seul</button>
  <button id="fm">A−</button><button id="fp">A+</button>
  <button id="ex" title="Sauvegarde">⬇</button><button id="im" title="Restaurer">⬆</button>
  <span id="info"></span>
 </div>
</header>
<div id="wrap"><div id="list"></div><div id="rz"></div><div id="pane"></div></div>
<dialog id="dg"></dialog><input id="fi" type="file" accept=".json" hidden>
<script>
const $=id=>document.getElementById(id),root=document.documentElement;
let S={items:[],sel:null,view:'split',w:window.innerWidth<700?42:34,fs:17,n:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('bn2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bn2',JSON.stringify(S))}catch(e){alert('Stockage plein ou indisponible')}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const col=new Intl.Collator('fr',{sensitivity:'base'});
let terms=[];
function filtered(){
 terms=norm($('q').value.trim()).split(/\s+/).filter(Boolean);
 return S.items.filter(x=>terms.every(t=>norm(x.t+' '+x.b).includes(t))).sort((a,b)=>col.compare(a.t,b.t));
}
function layout(){
 document.body.classList.toggle('only',S.view==='only');
 root.style.setProperty('--lw',S.w+'%');root.style.setProperty('--fs',S.fs+'px');
 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
}
function body(b){
 let h=esc(b);
 if(terms.length){const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');h=h.replace(re,'<mark>$1</mark>')}
 return h.split(/\n+/).filter(l=>l.trim()).map(l=>{
  if(l.startsWith('§ '))return '<p class="ref">'+l.slice(2)+'</p>';
  if(l.startsWith('&gt; '))return '<p class="v">'+l.slice(5)+'</p>';
  return '<p>'+l+'</p>'}).join('');
}
function render(keep){
 const L=filtered();
 if(!L.find(x=>x.id===S.sel))S.sel=L.length?L[0].id:null;
 $('info').textContent=L.length+' / '+S.items.length+' sujets';
 const lst=$('list');lst.innerHTML='';
 L.forEach(x=>{const b=document.createElement('button');b.className='it'+(x.id===S.sel?' sel':'');b.textContent=x.t;b.onclick=()=>{S.sel=x.id;save();render()};lst.append(b)});
 const p=$('pane'),st=keep?p.scrollTop:0;p.innerHTML='';
 const i=L.findIndex(x=>x.id===S.sel),it=L[i];
 if(!it){p.innerHTML='<div class="vide">'+(S.items.length?'Aucun résultat':'Aucun sujet. Touchez « + Sujet » pour commencer.')+'</div>';layout();return}
 const d=document.createElement('div');d.className='dh';
 const pv=document.createElement('button'),nx=document.createElement('button'),h=document.createElement('h2');
 pv.textContent='‹';nx.textContent='›';pv.disabled=i<1;nx.disabled=i>=L.length-1;h.textContent=it.t;
 pv.onclick=()=>{S.sel=L[i-1].id;save();render()};nx.onclick=()=>{S.sel=L[i+1].id;save();render()};
 d.append(pv,h,nx);
 const t=document.createElement('div');t.className='txt';t.innerHTML=body(it.b);
 const a=document.createElement('div');a.className='act';
 const e=document.createElement('button');e.textContent='✎ Modifier';e.onclick=()=>edit(it);a.append(e);
 p.append(d,t,a);p.scrollTop=st;layout();
 const mk=t.querySelector('mark');if(mk&&!keep)mk.scrollIntoView({block:'center'});
}
function edit(it){
 const dg=$('dg'),nw=!it;
 dg.innerHTML='<h3>'+(nw?'Nouveau sujet':'Modifier le sujet')+'</h3><label>Titre</label><input id="et"><label>Développement (une ligne = un paragraphe ; « § » au début = référence ; « &gt; » = verset)</label><textarea id="eb" rows="12"></textarea><div class="bt"><button class="pri" id="ok">Enregistrer</button>'+(nw?'':'<button class="dng" id="del">Supprimer</button>')+'<button id="no">Annuler</button></div>';
 $('et').value=nw?'':it.t;$('eb').value=nw?'':it.b;
 $('ok').onclick=()=>{const t=$('et').value.trim();if(!t)return;
  if(nw){const x={id:S.n++,t,b:$('eb').value};S.items.push(x);S.sel=x.id;$('q').value=''}else{it.t=t;it.b=$('eb').value}
  save();dg.close();render(!nw)};
 if(!nw)$('del').onclick=()=>{if(confirm('Supprimer ce sujet ?')){S.items=S.items.filter(x=>x!==it);save();dg.close();render()}};
 $('no').onclick=()=>dg.close();dg.showModal();
}
$('bn').onclick=()=>edit(null);
$('q').oninput=()=>render();
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();layout()});
$('fm').onclick=()=>{S.fs=Math.max(13,S.fs-1);save();layout()};
$('fp').onclick=()=>{S.fs=Math.min(30,S.fs+1);save();layout()};
/* poignée de réglage */
let dr=false;const rz=$('rz');
rz.onpointerdown=e=>{dr=true;rz.setPointerCapture(e.pointerId);document.body.classList.add('drag');e.preventDefault()};
rz.onpointermove=e=>{if(!dr)return;const p=Math.max(0,Math.min(75,e.clientX/innerWidth*100));if(p<6)S.view='only';else{S.view='split';S.w=p}layout()};
rz.onpointerup=rz.onpointercancel=()=>{if(!dr)return;dr=false;document.body.classList.remove('drag');save()};
rz.ondblclick=()=>{S.w=innerWidth<700?42:34;S.view='split';save();layout()};
/* sauvegarde / restauration */
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='bloc-notes-sauvegarde.json';a.click()};
$('im').onclick=()=>$('fi').click();
$('fi').onchange=async()=>{const f=$('fi').files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw 0;if(confirm('Remplacer les notes actuelles par cette sauvegarde ?')){S=Object.assign(S,d);save();render()}}catch(e){alert('Fichier invalide')}$('fi').value=''};
layout();render();
</script></body></html>
