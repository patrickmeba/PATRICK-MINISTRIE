 car une fois plongés sous ce flot, les pécheurs en ressortent des gens différents des pécheurs (Amen.) et perdent toutes leurs taches de culpabilité. C’est ça."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LA SANCTIFICATION POUR SERVIR DIEU", "i": [["ref", "59-1219 Questions et réponses sur le Saint-Esprit"], ["p", "42 Mon cher frère méthodiste, pèlerin de la sainteté, et nazaréen, le baptême du Saint-Esprit est différent de la sanctification. La sanctification, c’est la purification, qui prépare à la Vie. Mais quand le Saint-Esprit vient, Il est la Vie. La préparation, c’est purifier le vase ; le Saint-Esprit, c’est remplir le vase. La sanctification, signifie “être nettoyé et mis à part pour le service”. Le Saint-Esprit, c’est de le mettre en service. C’est vous le vase que Dieu a nettoyé."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>52-0224 Croire Dieu<\/b>"], ["p", "150 Et je sais ceci : certains d’entre nous ont plus de foi que les autres, et ceux qui ont une foi abondante doivent prier pour les autres. Mais si vous ne menez pas une vie correcte, vous faites mieux de vous abstenir ; le diable se moquera de votre prière. Mais quand vous vivez correctement, que vous agissez correctement, que vous vous conduisez correctement, et que vous avez foi en Dieu, Satan tremblera à vos paroles, parce que Dieu a juré qu’Il s’acquitterait de cette prière. C’est vrai."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIRE AU REVOIR À L’ÉGLISE", "i": [["ref", "<b>63-0728 Christ est le mystère de Dieu révélé<\/b>"], ["p", "80 Aimez-vous les uns les autres, par-dessus tout. Aimez-vous les uns les autres. Ne… Peu importe ce que le diable essaie de dire ! Maintenant, vous formez tous un bon groupe bien sympathique, mais souvenez-vous de mon avertissement, voyez, Satan ne va pas laisser ça comme ça. Non monsieur. Il tirera sur tout et, s’il le faut, il introduira quelqu’un pour en faire sa cible. Il introduira un critiqueur ou un incroyant, l’assiéra là et le fera fraterniser avec vous bien tranquillement et tout, ensuite il injectera à cet individu un genre de poison, et il commencera à répandre ça dans l’église. Ne prenez surtout pas parti pour ça. N’ayez absolument rien à faire avec quoi que ce soit d’autre. Restez vraiment affectueux, et doux, et gentils les uns avec les autres. Priez pour cet homme, afin que lui aussi soit sauvé, ou pour cette femme, ou pour la personne en question ; priez simplement pour eux. Et restez fermement attachés les uns aux autres."], ["p", "81 Et restez avec votre pasteur. Voyez, il est le berger, respectez-le. Il vous mènera à bon port, et, parce qu’il a été établi par Dieu pour le faire."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "POURQUOI LE CALVAIRE", "i": []}, {"t": "Le but de l’œuvre de la rédemption est de ramener le Saint-Esprit dans l’homme", "i": [["bib", "<b><i>Levitique 25 :8-11<\/i><\/b>"], ["bib", "<b><i>Actes 2 :1-3<\/i><\/b>"], ["bib", "<b>Philppiens 3 :20-21<\/b>"], ["ref", "<b>62-0607 Se revêtir de toutes les armes de Dieu<\/b>"], ["p", "<b>42 Et maintenant, quand tout  cela… Il avait oint les prophètes, des hommes nés par le sexe; mais cela n'avait pas marché. Eh bien, une fois alors, Dieu est devenu homme. Et cet Homme-là, c'était Jésus, et Il était l'empreinte du Père. Voyez? En d'autres termes, tout ce grand amour pur, la glorieuse puissance pure, toute cette glorieuse chose a été manifestée en Lui. Ainsi donc, Il est allé à la tombe, Il est mort pour nous, pour notre sanctification et notre justification, et puis Il a ramené le Saint-Esprit (voyez?) pour nous. Eh bien, par conséquent, nous  sommes les justifiés. Christ était la sanctification de Dieu. Nous  sommes la justification, Christ, la sanctification, et le  Père, la Tête. Voyez?<\/b>"], ["p", "<b>43 C'est juste comme la Parole au commencement, Elle nous a été apportée dans le jardin d'Eden, la Parole parlée. Et la deuxième fois, Elle a été faite chair et Elle a habité parmi nous. Et la troisième fois, Elle devient une partie de nous, quand le Saint-esprit demeure en nous, Dieu entrant dans l'homme. Premièrement, Il a proclamé la  Parole; l'ennemi a brisé cela. Ensuite, la Parole a été faite chair; Il a été crucifié. Mais aujourd'hui (amen.), il y a quelque chose de différent  dans la Parole. La Parole est devenue l'Eglise, et l'Eglise est la Parole. Dieu… Tout ce que Dieu était, Il l'a déversé en Christ. Tout ce que Christ était, Il l'a déversé dans l'Eglise: \" Le Saint-Esprit. \" Maintenant, l'ennemi a  quelque chose. Voyez,  il n'est donc pas en train de combattre  quelque chose dans le passé.<\/b>"], ["p", "<b>Beaucoup de gens ne prenaient que la lettre: \" La lettre tue. L'Esprit vivifie \", voyez, voyez? Et ils prennent ces crédos et  autres, ça tue toujours. Mais lorsque vous recevez l'Esprit, c'est Dieu Lui-même. Comment savez-vous  que c'est  Dieu? Parce que Il reçoit la Parole, et La manifeste. Voyez? C'est  donc Dieu Lui-même. Oh! la la! la Parole parlée. Voyez? Oui, oui. Oh! la la!<\/b>"], ["rev", "<b>Rev. William Marrion BranhamChevall blanc = lion<\/b>"], ["p", "<b>Chheval roux = <\/b>"], ["p", "<b>Cheval noire = l’hommme<\/b>"], ["p", "<b>Cchheval pal. = Aigle<\/b>"]]}, {"t": "VIE CHRÉTIENNE (ne faites rien que vous ne feriez pas en Sa Présence)", "i": [["ref", "<b>62-0909<\/b><b><sup>E<\/sup><\/b><b> Dans Sa Présence<\/b>"], ["p", "72 Psaume 16.8 — David a dit : “Je garde l’Éternel sous mes yeux.” C’est une bonne chose à faire. Psaume 16.8 : “Je garde l’Éternel sous mes yeux.” Ce, afin qu’il ne soit pas dans la confusion. Il désirait être conscient de Sa Présence, c’est pourquoi David a dit : “Je garde constamment l’Éternel devant moi. En effet, moi, David, je garde l’Éternel devant moi, afin d’être toujours conscient—conscient de la Présence de Dieu.” N’est-ce pas que ce serait une leçon valable pour chacun de nous, ce soir ? Garder l’Éternel devant nous, afin d’être conscients de Sa Présence. Faites-Le passer avant tout. Pourquoi ? Faites-Le passer avant tout, devant vous. Pourquoi ? Alors vous ne pécherez pas, quand vous êtes conscients que vous êtes constamment dans la Présence de Dieu. Quand vous êtes conscients que Dieu est présent, vous surveillez ce que vous dites."], ["p", "73 L’homme, quand il pense que Dieu est absent, il jure, il convoite les femmes, il fait…il vole, triche, ment. Il se permet n’importe quoi, quand il pense que Dieu ne le voit pas. Mais faites-le entrer dans la Présence de Dieu : il arrête tout de suite. Voyez ? Et David a dit : “Je mets l’Éternel constamment devant moi.” C’est une bonne chose. Ce n’est pas étonnant que Dieu ait déclaré qu’il était un homme selon Son cœur. L’homme se permet tout, quand il pense que Dieu n’est pas près. Mais quand il est conscient que Dieu est près — avez-vous déjà remarqué le pécheur ? Lorsqu’une personne sainte s’approche, il arrête de jurer, s’il a un tant soit peu de respect. Voyez ? Il ne fait pas les plaisanteries grossières qu’il aurait faites. Voyez ? Voyez, il s’abstient, parce qu’il sait qu’il est dans la Présence de Dieu, puisque Dieu habite dans le tabernacle de Son peuple. Voyez ?"], ["p", "74 David, après avoir fait ça, il a dit : “Mon cœur sera dans la joie.” J’aimerais que vous le lisiez, le Psaume 16. “Mon cœur sera dans la joie, et mon corps repose en sécurité.” Pourquoi ? Mon cœur sera dans la joie, parce que j’ai toujours Dieu sous mes yeux. “Et mon corps repose en sécurité ; si je meurs, je serai ressuscité. Car Il ne permettra pas que Son Saint voie la corruption, et Il n’abandonnera pas Son âme dans le séjour des morts.” Voyez ? Quand David a mis Dieu devant lui, et qu’il était conscient qu’il était constamment dans la Présence de Dieu. “Cherchez premièrement le Royaume de Dieu.”"], ["p", "75 Maintenant écoutez, église, je vous aime. Et je veux que vous m’écoutiez, là. Comme Frère McCullough avait coutume de dire : là je vais dire quelque chose. Mettez toujours le Seigneur devant vous, et <b><i>ne faites rien que vous ne feriez pas en Sa Présence, parce qu’Il veille sur vous. Voyez ? Le Seigneur campe autour de ceux qui Le craignent. Il ne… Il reste là, tout près de vous. Et Il sait tout ce que vous faites, et vous devez reconnaître cela. Quand vous êtes sur le point de dire un mensonge, ne le dites pas, souvenez-vous, Dieu vous écoute. Si vous êtes sur le point de faire une petite tricherie, ne la faites pas, Dieu vous regarde. Si vous êtes sur le point de prendre Son Nom en vain, ne le faites pas, Dieu vous écoute. Si vous êtes sur le point de fumer une cigarette, Il vous observe. Voyez ? Son… Il y a un chant que nous avions l’habitude de chanter : “Tout le long du chemin vers la véritable demeure de l’âme, il y a un œil qui te surveille ; à chacun de tes pas, ce grand œil est éveillé, il y a un œil qui te surveille.”<\/i><\/b> Souvenez-vous, faites comme David, mettez le Seigneur constamment devant vous. Alors votre cœur sera dans la joie et votre chair reposera avec espérance, car Il l’a promis. Oui monsieur. Il savait qu’il ressusciterait, parce que Dieu l’avait promis. Très bien."], ["p", "76 Quand on entre dans Sa Présence, on est changé, on n’est plus jamais le même. Regardez, tout au long des âges, les hommes, de tous les milieux. Regardez Abraham. Vous dites : “Eh bien, une vie changée, ça, ce n’est que pour les ministres.” Oh non. Une vie changée, c’est pour tout le monde. Voyez ?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0630<\/b><b><sup>E<\/sup><\/b><b> -  Votre vie est-elle digne de l’Évangile ?<\/b>"], ["p", "278 Soyez un Chrétien de bonne réputation, parce qu’ici nous sommes des étrangers. Ceci n’est pas notre Demeure. <b><i>Notre Demeure est en Haut. Nous sommes fils et filles d’un Roi, du Roi. Faisons en sorte que nos vies jouissent d’une—d’une bonne réputation. Vivons une vie qui honore ce que nous prétendons être, des Chrétiens. Et si vous ne pouvez pas vivre ce genre de vie, alors arrêtez de vous faire appeler Chrétiens, parce que vous ne faites qu’apporter de l’opprobre sur la Cause.<\/i><\/b>"], ["p", "    E-152   Je suis allé dans le bureau d’un homme ici en ville. Et cet homme est administrateur ou plutôt diacre dans une bonne église. Je suis entré là pour voir cet homme à propos d’une certaine affaire. Et il y avait là une radio qui jouait à plein tube ce rock’n’roll ou ce twist, quelque chose comme ça. Et je pense qu’il y avait dans son bureau quarante affiches de femmes nues. Maintenant, à quoi bon relever qu’il est diacre ou autre chose. Faites-moi voir ce que vous regardez, ce que vous lisez et le genre de musique que vous écoutez, vos fréquentations, et je vous dirai quelle sorte d’esprit est en vous. Voyez ? Eh oui.(63-0630<sup>E<\/sup> * Votre Vie Est-Elle Digne De L’évangile ?)"]]}, {"t": "LA PERFECTION", "i": [["ref", "<b>57-0419 La perfection<\/b>"], ["p", "8 Dieu exige la perfection. Nous devons nous souvenir que rien de partiel ne peut entrer dans la Présence de Dieu. Cela doit être parfait, notre adoration, tout."], ["p", "9 Eh bien, dans le jardin d’Eden… Dieu avait Adam et Eve dans le jardin, ces derniers ont péché et ont transgressé les lois de Dieu en péchant, par la désobéissance. Et quand la transgression vient… La désobéissance, c’est la transgression de la loi. Et la loi de Dieu, Lui étant saint, d’une sainteté pure, aucune tâche d’impiété ne peut donc tenir dans Sa Présence. Ainsi, si le péché est entré dans le monde par la transgression, alors on doit d’abord traiter le problème du péché avant que le pécheur se tienne dans la Présence de Dieu."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-0723M L’Eau toujours présente du Rocher<\/b>"], ["p", "152 Quand vous êtes sauvé, Dieu vous donne la foi pour vous élever, sortir de la saleté de la terre. Votre foi triomphe des choses du monde. Qu'est-ce que votre foi? Votre foi dans cet acte que Dieu a fait en vous pour faire de vous un fils de Dieu. Vous cessez de mentir, vous cessez de voler, vous cessez de boire parce que votre foi vous élève au-dessus de cela. Amen! Si vous ne le faites pas, vous n'avez pas de foi du tout. Et c'est par la foi que vous êtes sauvé et cela par le moyen de la grâce."], ["p", "153 La quantité de foi qui sera relâchée, c'est la quantité de puissance que vous pouvez avoir, parce qu'en vous habite la puissance pour créer les cieux et la terre. Dieu habite en vous et vous êtes fils et filles de Dieu. Amen! Vous y êtes. Mais c'est votre foi. Jésus a dit: «Qu'il te soit fait selon ta foi. Si tu peux croire, toutes choses sont possibles. En vérité, je vous le dis, si vous dites à cette montagne: 'Ote-toi de là' et que vous ne doutez pas, mais si vous croyez en ce que vous avez dit...»"], ["rev", "Rev. William Marrion Branham"], ["bib", "2Pierre 1 :3"], ["ref", "<b>57-0915M Hébreux, chapitre six #3 ( branham sermons heb chap 6 1 ere partie €522)<\/b>"], ["p", "19 Bon, la seule façon pour une église d'être édifiée, la seule façon pour un homme d'avoir la foi, ce n'est pas par sa dénomination, ni par son affiliation; et sa foi n'est pas fondée sur les idées théologiques d'un homme (car ce n'est pratiquement rien d'autre que l'homme), mais la seule chose en laquelle la foi trouve son solennel lieu de repos, c'est dans l'invariable et immuable Parole de Dieu. \"La foi vient de ce qu'on entend, de ce qu'on entend la Parole.\" C'est ce qu'il faut. Et - et quand la foi est reçue et acceptée, c'est réglé pour toujours. Jamais plus rien ne peut l'ébranler, quoi qu'il arrive. Rien ne peut changer cette foi. Pensez-y! Vous êtes ancré et vous ne changez plus, maintenant et éternellement! Vous êtes ancré à jamais! Car Dieu, par un seul sacrifice, a amené à la perfection pour toujours ceux qui sont sanctifiés, ou appelés."], ["rev", "Rev. William Marrion Branham"], ["bib", "Col 1 :5"]]}, {"t": "JOHN SHARRITT", "i": [["ref", "<b>50-0822 La Foi Sans les œuvres est morte<\/b>"], ["p", "8 Autrefois, je pensais que ce n’était pas bien de recevoir un cadeau offert par quelqu’un. Frère Sharritt, c’est lui qui a fait pression sur moi à ce sujet. Il a dit : « Frère Branham, je suis obligé de vous corriger là-dessus. Mais, a-t-il dit, là vous vous trompez. » Il a dit : « Vous faites faire des pertes à ces gens en refusant leurs cadeaux ; vous leur faites manquer leur récompense. » Il a dit : « Il y a plus de bonheur à donner qu’à recevoir. »"], ["p", "Ensuite, il m’a raconté son histoire. J’ai fait… Je crois que je vais vous la raconter maintenant même. Je viens juste d’y penser il y a un instant. John B. Sharritt, de Phoenix en Arizona, l’un des directeurs commerciaux de la campagne… beaucoup d’entre vous l’ont sans doute rencontré. Y a-t-il par hasard quelqu’un ici qui connaît frère Sharritt, ou plutôt quelqu’un qui connaît John Sharritt, de Phoenix, en Arizona ? Bien, c’est un produit de l’école biblique de Dieu à Cincinnati, dans l’Ohio."], ["p", "Le doyen de l’université me parlait de lui il y a quelques mois, un très brave homme, Frère Stanley. Beaucoup d’entre vous ont entendu parler de Frère Stanley de… un revivaliste de Dieu. Il m’attend chez moi maintenant."], ["p", "9 Alors lui et le frère Raymond T. Richey… Beaucoup d’entre vous ont entendu parler de lui, n’est-ce pas ? Il est de Houston, au Texas. Il est membre de l’église : les Assemblées de Dieu, et a un… évangélique… ?… Là."], ["p", "Et ainsi, frère Sharritt, c’est le genre de – d’homme qui est né sans posséder beaucoup de biens de ce monde. Son père était très pauvre, et il était un grand bagarreur. Et il avait quitté sa mère. Et John Sharritt, il y a environ quinze ans, vendait des pommes à cinq cents la pièce là, devant lui comme ceci à Saint-Louis, dans le Missouri. Des pommes… Quand bien même cela ne pouvait pas lui procurer une charrette pour prendre soin de sa maman."], ["p", "Et il bégayait. Il ne pouvait pas du tout parler. Quand vous vous mettez à parler, tenez-vous simplement à… ?… Il essayait… ?… [Espace vide sur la bande -N.D.E.] Et c’est à peu près là où vous… ?…"], ["p", "10 Bien, mais il s’est mis à chercher le Seigneur lorsqu’il était un jeune garçon. Alors que tous les garçons sortaient à différents endroits avec les jeunes filles, lui a dit : « Seigneur, moi je – je vais Te faire confiance. Je – ce serait affreux pour moi – moi – moi – moi d’aller essayer de parler aux jeunes filles. Mais je veux me marier et avoir des enfants. Et je vais Te servir, mais donne-moi une femme. » Il confia cela au Seigneur : il avait environ vingt-cinq ans."], ["p", "S’il avait pu passer à côté de chaque femme au monde, il n’en aurait pas eu de meilleure que celle qu’il a. Dieu lui a donné une charmante petite sainte. Mais une chose importante est qu’il aimait tellement les enfants… Elle était stérile. Ils s’étaient mariés ça faisait beaucoup, beaucoup d’années, ça faisait dix-sept ans, sans enfants."], ["p", "Il cassait du béton dans la rue, à vingt-cinq cents par heure pour gagner sa vie. Et ils avaient épargné leur argent, ils ont acheté une petite maison à trois pièces. Je pense que cela coûtait environ mille cinq cents dollars à l’époque de la crise. Et ils ont payé, payé, et payé. Et… ?… payé jusqu’à ce qu’ils aient tout réglé."], ["p", "11 Juste au moment où ils avaient tout réglé, ils ont eu un réveil à Phoenix. Et il y avait là un homme du nom de Docteur Sutton. Je ne sais pas si oui ou non vous le connaissez, un… ?… Un Évangile – un prédicateur du Plein Évangile était venu là à Phoenix, et il séjournait dans un camp de touristes."], ["p", "Et le Seigneur apparut à frère Sharritt une nuit dans un songe. Il lui dit : « Prends ton argenterie, tes vêtements et ta femme, ensuite, quitte ta maison, et remets-la à frère Sutton que voici. »"], ["p", "Pensez-y. Après environ dix ans de dure labeur pendant la crise, faisant de l’épargne et déployant des efforts, et le Seigneur lui dit de remettre cette maison au Docteur Sutton, qui était un – un prédicateur réputé."], ["p", "Frère Sharritt a dit : « D’accord, Seigneur. »"], ["p", "Il alla auprès de sa petite compagne et dit : « Chérie, le Seigneur m’a parlé et m’a dit de remettre notre maison… de prendre juste notre argenterie et nos vêtements, et de remettre la maison à Docteur Sutton. »"], ["p", "Quand il est allé en parler à sa femme, elle a dit : « D’accord, chéri. » Elle crut en son mari et dit : « Si le Seigneur t’a demandé de le faire, c’est que Dieu a autre chose à faire pour nous. »"], ["p", "12 Ainsi, elle… il a donc remis tout ce qu’il avait. Et cette nuit-là, il ne savait où amener sa femme. Et ils ont trouvé un camp de touristes où on payait soixante-quinze cents. Et ils sont restés dans ce camp cette nuit-là, et il gagnait vingt-cinq cents par heure en cassant du béton dans la rue (C’est vrai.), travaillant chaque jour pour… c’est un très grand homme, pesant environ 225 livres [112, 5 kg – N.D.T.]"], ["p", "Et environ une semaine plus tard, une dame riche lui a dit que - qu’elle reculerait quelques-uns de ses meubles dans son garage, et elle lui demanda d’habiter dans son garage, là vers la montagne Camel Back (Vous savez où ça se trouve), c’est une sorte d’endroit très aristocratique de la région, là-bas. Elle a dit : « Vous… Si vous entretenez ma cour… ?… venez et arrosez le gazon, et ainsi de suite. » Elle a dit : « Vous pouvez habiter dans mon garage gratuitement. » Il a emménagé là pour environ un cent. Il avait quelques malles, il s’est procuré un… ?… Il a mis cela par terre, il s’est procuré un matelas… ?… Lui et sa femme dormaient là."], ["p", "Frère Sutton a dit : « Frère Sharritt, je ne… »"], ["p", "Il a dit : « C’est le Seigneur qui m’a dit de le faire. C’est en ordre. »"], ["p", "13 Il est allé de l’avant. Et il est resté dans cette situation environ une année, il a vécu une bonne vie chrétienne. Finalement, la jeune dame chez qui il vivait était une multimillionnaire, elle avait vu son intégrité. Il était un chrétien juste comme Daniel à Babylone."], ["p", "Un jour, elle alla le voir, elle dit : « John, dit-elle, tu sais quoi ? Hier soir, le Seigneur m’a parlé dans un songe, et il a dit que je dois te prêter dix mille dollars pour une affaire. »"], ["p", "« Eh bien, a-t-il dit, bon… ?… a-t-il dit,  Madame, je – je ne peux même pas… ?… Je ne serai jamais un homme d’affaires. »"], ["p", "Elle a dit : « Mais le Seigneur m’a demandé de le faire, et voici le chèque. »"], ["p", "Il a répondu : « Bien, ah, je – je – je ne peux pas vous laisser faire ceci. » Il a dit : « Je – je ne veux pas de dix mille dollars dans mon… non, huh-uh »"], ["p", "Alors, elle a dit : « Mais le Seigneur m’a dit de te les donner. » J’ai vu que tu es un homme bon et honnête, je t’ai vu lire la Bible. Et je me suis procuré une Bible et je L’ai lue. Et le Seigneur m’a dit de te donner le chèque, de te prêter cela, dix mille dollars pour faire des affaires. »"], ["p", "14 Alors, il prit le chèque. Il ne savait quoi faire. Ainsi, il est allé de l’avant. Et un soir, il se promenait et il a vu une vieille petite maison de cinq pièces qu’on vendait à deux mille dollars. Il est donc parti là et a encaissé le chèque et, il a acheté cette maison à deux mille dollars. Et ils sont allés là, sa femme et lui, et se sont mis à casser le plâtrage de la maison et ils ont bien replâtré cela, lui et sa femme travaillant ensemble. Et il a plâtré toute la maison, il a arrangé le parquet et il y a accroché une enseigne de mise en vente. Et s’il avait reçu trois mille, il aurait fait de l’argent. Et il a vendu cela à six mille."], ["p", "Aujourd’hui la fortune de John Sharritt s’élève à un demi-million de dollars. Ça fait environ six ou sept ans depuis qu’il a commencé, sa fortune s’élève à un demi-million de dollars. Il est père de trois beaux petits enfants. Oh ! la la !"], ["p", "Il a dit : « Frère Branham, et si j’avais… Et si Docteur Sutton avait refusé de prendre… ?… Ce que Dieu m’avait dit de faire. Voyez ce qu’il en serait ? »"], ["p", "Et alors, il s’est tenu là, il a dit : « Seigneur… » [Espace vide sur la bande – N.D.E.]"], ["p", "15 Je ne sais pas. Il est propriétaire d’orangeraies, des maisons style ranch. Il est propriétaire du grand ranch Thunderbird là, l’un des plus grands qu’il y a en Arizona."], ["p", "Et il a dit : « Toutes ces choses… » Il a dit : « Je – j’ai tellement d’argent que je ne sais qu’en faire. »"], ["p", "Et Dieu lui a donné une belle petite fille, puis un petit garçon, ensuite une petite fille. C’est la raison pour laquelle il n’est pas avec nous ce soir. Le petit bébé est né tout récemment. Sa femme était stérile toutes ces années. Et maintenant, elle enfante, juste… ?… faisant. Ô, quelle heureuse famille !"], ["p", "Et il a dit : « Lorsque je suis venu à Phoenix… » Il a dit : « Je suis allé à la réunion un soir », et il a dit : « Seigneur n’est-ce pas cela l’endroit dont Tu parlais ? » Et ensuite, il a dit… venu vers moi. Il a dit : « Frère Branham, vous ne me devez pas un centime. Mais si je peux faire passer votre chapeau, ou plutôt amener votre manteau, je veux participer à la campagne. »"], ["p", "Et j'avais prié pour lui, et  »ieu lui a de nouveau restitué la parole. Maintenant, il est guéri, il a un bon foyer, en tout. Il donne au Seigneur les dîmes de tout ce qu’il produit. Oh ! la la ! Il est vraiment béni. Ainsi, il y a plus…"], ["p", "16 Eh bien, si vous voulez lui écrire, écrivez simplement à John B Sharritt à Phoenix, en Arizona. Ça lui parviendra. Et demandez-en vous-même le témoignage."], ["p", "Eh bien, il imprime des traités et tout, il répand l’Évangile partout. Il sera probablement avec nous bientôt dans la campagne."], ["p", "Il y a plus de bonheur à donner qu’à recevoir. Voyez ? De…"], ["p", "Et maintenant, cela ne veut pas dire… Laissez Dieu vous dire ce qu’il faut faire. Voyez ? Et lorsque Dieu vous dit que madame Dupont là-bas est veuve, et a besoin de quelques – de quelques habits, et Il vous demande d’aller aider cette veuve, allez l’aider. Vous – vous le faites. Parce que, écoutez mes amis, tout l’argent que nous avons, passera un jour. C’est vrai. Ça n’existera plus, excepté les choses éternelles qui se trouvent dans notre âme. Est-ce vrai ?"], ["p", "Nous sommes venus au monde nus. Nous quitterons le monde nus. Comme Job a dit:  »L’Eternel a donné, et l’Eternel a ôté ; que le nom de l’Eternel soit béni ! » C’est vrai."], ["rev", "Rev. William Marrion Branham"], ["bib", "Gen 16 :1-"]]}, {"t": "À QUOI SERT DE PRÊCHER L’ÉVANGILE", "i": [["ref", "<b>59-0424A Le Fidèle Abraham<\/b>"], ["p", "19 Voici une question qui m’a été posée une fois, après que j’avais fait pareille déclaration: «Alors, à quoi sert-il de prêcher l’Evangile?» Cela en fait partie."], ["p", "20 Jésus a expliqué cela quand Il a dit: «Un pêcheur alla au lac et y jeta un filet.» Et quand il a capturé un grand nombre et a ramené cela, eh bien, il y avait des poissons, et toutes les autres espèces: des araignées, des tortues d’eau douce, des grenouilles, et tout. Eh bien, ça, c’est le pêcheur. C’est... Je suis un pêcheur. Ceux-ci sont des pêcheurs. Ils font la pêche dans tous les coins du lac. Je viens jeter mon filet avec eux pour pêcher dans ce coin. Je tire. Tout ce que le filet de l’Evangile a capturé, je le tire. Certains sont des poissons. D’autres sont des tortues. D’autres sont des serpents. D’autres sont des grenouilles. D’autres sont des écrevisses. D’autres sont des araignées."], ["p", "21 Je vais donner une petite illustration. Pour commencer, vous savez, la vieille tortue sort la tête de sa carapace et dit: «Hum! Je n’ai pas aimé cette vieille sainteté, de toute façon.» Elle rampe, elle rampe, elle rampe, elle retourne tout droit dans la boue. C’est ainsi qu’elle agira. Pourtant, elle était venue à l’autel; elle a été capturée dans le filet de l’Evangile."], ["p", "22 Voici madame l’araignée. Elle a regardé tout autour et dit: «Hum! On ne peut pas jouer au bridge; on doit être différent, s’habiller différemment, se comporter différemment!» Flop, flop, flop, elle retourne tout droit dans l’eau. Vous voyez? Qu’était-ce? C’était une araignée pour commencer, une tortue pour commencer, et un poisson pour commencer."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU NE CHANGE PAS", "i": [["ref", "<b>59-0422 Nous Voudrions Voir Jésus<\/b>"], ["p", "18 Eh bien, nous savons que Dieu ne change pas. Il nous faut toujours nous souvenir de ceci, que nous sommes limités, mais Lui est infini. Maintenant, si jamais Dieu prend une décision, chaque fois qu’Il est appelé à prendre une décision, et la décision de Dieu, étant donné qu’Il est infini, Il doit sans cesse s’en tenir à cette décision-là. Voyez, moi je peux vous faire une promesse, et demain je peux dire: «J’étais dans l’erreur.» Voyez, je dirai: «Je m’étais trompé. Ce n’est pas ce que je voulais dire. Maintenant je vois différemment.» Mais Dieu ne peut pas faire ça, parce qu’Il est parfait. Il–Il sait tout. Et Ses décisions... Si jamais un pécheur venait à Lui en fléchissant les genoux et implorait miséricorde, et que Dieu, sur base d’un–un certain mérite, accordait à cet homme le pardon de son péché, la personne suivante doit recevoir le même traitement. Sinon s’Il ne sauve pas la deuxième personne, alors Il avait commis une erreur lorsqu’Il a sauvé le premier homme. Et si un–un homme qui est malade vient à Dieu et satisfait aux exigences de Dieu..."], ["p", "19 Eh bien, quelquefois lorsque nous remplissons les exigences, nous pensons que... eh bien, c’est... Pourquoi n’a-t-Il pas répondu? Quelquefois Dieu agit ainsi en réponse à notre action pour voir quelle sera notre réaction. Voyez? Quelquefois... Considérez la–la femme sunamite, par exemple. Voyez, Il voulait voir ce que serait sa réaction. Et Il fait cela bien des fois, juste pour voir comment nous réagirons. Mais si nous sommes certains que nous avons satisfait aux exigences de Dieu, tenez-vous-en juste à cela; Il est obligé d’agir. Entendez-vous cela? Il est obligé d’agir. S’Il a fait la promesse, Il est Dieu et Il doit tenir cette promesse. Il est Dieu. Il ne peut tout simplement pas retirer cela et dire: «Eh bien, Je m’étais trompé.» Dieu ne commet pas d’erreurs. Il est parfait. Très bien. Eh bien, après que Dieu eut conduit les enfants d’Israël sous la forme de la Colonne de Feu, l’Ange de l’alliance, et puis ce même Ange a été fait chair et a habité parmi nous. Jésus a dit: «Je viens de Dieu, et Je retourne à Dieu.»"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>53-0329 Israël Et l’Eglise #5 (Israël dans sa patrie)<\/b>"], ["p", "93 Et si Dieu promet quelque chose, Dieu tiendra Sa Parole. Si Dieu a promis de vous guérir, Il le fera. Si Dieu a promis de vous donner le Saint-Esprit, Il le fera. Venez simplement et soyez – repentez-vous et soyez baptisés au Nom de Jésus-Christ, et croyez en Lui, et regardez ce qui arrive ! C’est juste. Vous serez rempli du Saint-Esprit. Dieu est obligé de tenir Sa Parole. Il ne peut pas retirer Sa Parole. Il doit tenir Sa Parole, pour être Dieu. Il doit le faire."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LE SAINT-ESPRIT EST UNE PROMESSE", "i": [["ref", "<b>59-0424A Le Fidèle Abraham<\/b>"], ["p", "45 Je sais que j’ai ici des amis baptistes. Mais, récemment, il y avait un brave frère baptiste, un très brave frère, un véritable chrétien. Il a dit: «Frère Billy, j’aimerais vous dire quelque chose.» Il a dit... ou plutôt «vous poser une question». Il a dit: «Comment reçoit-on ce baptême du Saint-Esprit?»"], ["p", "J’ai dit: «C’est une promesse de Dieu.»"], ["p", "Il a dit: «Ne pensez-vous pas que c’était seulement pour les disciples?»"], ["p", "46 J’ai dit: «Non, monsieur. Non. Paul a continué à parler et à leur ordonner jusqu’au... disciple après disciple, chez Corneille, et tout du long.»"], ["p", "Et il a dit: «Eh bien, comment le reçoit-on? Pensez-vous qu’on le reçoit de la manière que le disaient les pentecôtistes?»"], ["p", "J’ai dit: «On le reçoit par une promesse de Dieu.»"], ["p", "Et il a dit: «Eh bien, on reçoit le Saint-Esprit dès qu’on a cru.»"], ["p", "47 J’ai dit: «Paul était en désaccord avec vous dans Actes 19, quand il a rencontré un groupe de baptistes et qu’il a demandé: ‘Avez-vous reçu le Saint-Esprit depuis que vous avez cru?’ Depuis que vous avez cru.» Et cela balaye la chose. J’ai dit: «Voyez-vous, le premier baptiste a été éliminé là.» Et j’ai dit: «Ne soyez pas éliminé au même endroit.»"], ["p", "48 Bien, voyez-vous, avez-vous reçu le Saint-Esprit depuis que vous avez cru? Ces gens étaient… avaient même le vrai salut. Ils criaient, ils avaient là une réunion formidable avec Apollos, ce grand prédicateur baptiste, un homme de loi converti. Il démontrait par la Parole que Jésus était le Christ; et on se réjouissait, on passait des moments glorieux et grande était leur joie. Et Paul a dit: «Mais, avez-vous reçu le Saint-Esprit depuis que vous avez cru?»"], ["p", "49 Alors le prédicateur m’a dit, il a dit: «Frère Branham, Abraham crut Dieu et cela lui fut imputé à justice. Qu’est-ce qu’un homme peut faire d’autre que de croire en Dieu?»"], ["p", "J’ai dit: «C’est tout ce qu’il peut faire.»"], ["p", "Il a dit: «Alors, quand je crois en Dieu et que je Le reçois, ne pensez-vous pas que cela m’est imputé à justice?»"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "JÉHOVAH-JIRÉ", "i": [["bib", "Genese22 :14-18"], ["v", "21 Notre scène s’ouvre sur l’une des scènes les plus merveilleuses au sujet d’Abraham. Vous savez qu’Abraham est le père des fidèles. Et la promesse a été faite à Abraham. Et ce n’est qu’en étant héritiers avec lui, grâce à Christ, que nous pouvons recevoir la promesse, à travers Abraham. Or, Abraham était juste un homme ordinaire, mais il avait été appelé par Dieu, et il est resté fidèle à cet appel. Quand Dieu a parlé à Abraham, pas une seule fois il n’a douté de cette Voix. Il s’en est tenu strictement à Elle. Peu importe la difficulté, il s’en est tenu strictement à Elle."], ["p", "22 Puis il a reçu la promesse d’un fils. Et il a attendu vingt-cinq ans pour recevoir ce fils, il considérait comme n’existant pas tout ce qui était contraire à cela. Puis, en ce fils, toutes les familles de la terre seraient bénies. Et le patriarche est resté fidèle à son appel et à la Parole promise."], ["p", "23 Il était l’exemple de ce que nous devrions être. Maintenant nous, étant morts en Christ, nous sommes la Postérité d’Abraham."], ["ref", "64-0322 Posséder la porte de l’ennemi après l’épreuve"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "VOTRE VIE INFLUENCE QUELQU’UN D’AUTRE [VOS ENFANTS PAIERONT POUR VOS PÉCHÉS]", "i": [["ref", "<b>63-1114 L’influence VGR<\/b>"], ["p", "17 Et en tant que Chrétiens, nous devrions toujours veiller à ce que nous faisons et à ce que nous disons, afin d’être parfaitement honnêtes avec chaque homme. Et vous, si vous ne pouvez pas être honnête avec vos semblables, vous ne serez certainement pas honnête avec Dieu. Donc, la manière dont nous servons Dieu, c’est la manière dont nous nous servons les uns les autres. L’honnêteté dont je ferais preuve envers vous, c’est la même honnêteté dont je ferais preuve envers Dieu. C’est la même chose pour vous par rapport à moi. Nous devons être honnêtes les uns avec les autres dans tous les aspects de nos relations."], ["p", "18 <i>Et quelqu’un nous observe. Vous n’en êtes peut-être pas conscient, mais il y a des yeux qui vous surveillent. Et votre vie influence quelqu’un. C’est peut-être un petit enfant, et cet enfant deviendra peut-être un autre Finney, ou Moody, et ainsi de suite. Nous n’en savons rien. Mais votre—votre vie influence quelqu’un<\/i>."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>58-0927 Pourquoi ne sommes-nous pas une dénomination ? VGR<\/b>"], ["p", "75 Dieu hait le péché! Comment pensez-vous pouvoir fouler aux pieds le Sang sacré du Seigneur Jésus et, rien que parce que vous faites partie d’une certaine dénomination, pouvoir entrer? Vous entrerez en remplissant les conditions fixées par Dieu, ou bien vous n’entrerez pas du tout. C’est vrai. Que nous soyons diacre, prédicateur ou quoi que ce soit, ça n’a aucun rapport. Vous entrez en remplissant les exigences de Dieu."], ["p", "76 Quatorze générations. La personne qui discutait de ça avec moi est ici présente. Elle a dit : “Alors, comment savoir qui sera sauvé?”"], ["p", "77 J’ai dit : “C’est là qu’il faut être un bon calviniste.” Votre nom a été mis dans le Livre avant la fondation du monde. Dieu accepte cette lignée de sang. C’est Son affaire. Voyez?"], ["p", "“Mais, qu’est-ce que ça…”"], ["p", "78 Écoutez. Vous les jeunes, aujourd’hui, je ne sais pas si vous venez à l’église ici, ou d’où vous venez, vous les jeunes, garçons et filles. Mais vous rendez-vous compte : les choses que vous faites, s’il y a une autre génération, vos enfants seront jugés à cause de vos actions? N’avez-vous pas le respect de la décence? Vous, les jeunes filles, qui sortez vêtues de ces petits shorts et autres, le savez-vous, ça portera préjudice à votre fille. Savez-vous que votre grand-maman était une—une dévergondée, et que votre maman était une danseuse de music-hall, et que c’est pour ça que vous êtes une strip-teaseuse aujourd’hui? Certainement. Vos enfants, qu’est-ce qu’ils vont être? Oui monsieur. Dieu a dit qu’Il punirait l’iniquité des parents sur les enfants, et sur les enfants de leurs enfants, jusqu’à la troisième et la quatrième génération."], ["p", "79 Et vous rendez-vous compte, mon frère, que chaque fois que vous faites ce qui est bien, ça retombera sur vos enfants?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-0209 Jéhovah-Jiré<\/b>"], ["p", "46 Eh bien, si vous avez mal agi, si vous vous êtes écarté du vieux chemin qui a été tracé et que vous soyez allé du côté du monde, vous n’avez pas perdu votre alliance, ma soeur, mon frère. Vous n’avez pas perdu l’alliance; vous avez tout simplement perdu les – les bénédictions de l’alliance. Revenez; sortez de l’Egypte. Revenez ici dans la Terre promise. Entrez là où Dieu a dit que vous devriez demeurer. «Si vous demeurez en Moi (Saint Jean 15), et que Mes Paroles demeurent en vous, vous pouvez demander ce que vous voulez, et cela vous sera accordé.» Mais restez là à l’intérieur. «Si vous demeurez en Moi et que Ma Parole demeure en vous…» Combien savent que c’est la vérité? C’e<b>s<\/b>t la promesse de Dieu."], ["p", "«Si vous demeurez en Moi…» Cela signifie rester là. Ne courez pas pour vous rendre en Egypte et ne courez pas après les choses du monde. «Si vous demeurez en Moi, et que Mes Paroles demeurent en vous, vous pouvez demander ce que vous voulez, et cela vous sera accordé.» C’est Sa promesse. Si vous êtes la postérité d’Abraham, alors restez dans cette promesse. Si vous en sortez, revenez-y. Vous aurez des ennuis là en Egypte. Revenez dans la Terre promise."], ["rev", "Rev. William Marrion Branham"], ["p", "<b>AMOUR<\/b>"], ["ref", "<b>63-1114 L’influence<\/b>"], ["p", "135 Nous n’avons pas l’humilité. Nous n’en voulons pas, et les gens n’en veulent pas. Parfois, on va dans une église et les gens sont très bien habillés, ils—ils entrent là; et si vous n’êtes pas habillé comme il faut, ils vont vous regarder et en parler, vous savez. Et ça fait que… Ils ne devraient pas faire ça, s’ils professent le Christianisme. Je—je—je pense que c’est simplement une profession, et non une possession. En effet, je crois qu’une—une vraie expérience à l’ancienne mode avec Dieu amènerait quelqu’un en smoking à passer ses bras autour d’un autre en salopette, et dire “frère”. Je—je le crois vraiment. C’est vrai. Quelqu’un en robe de calicot et l’autre en robe de soie s’appelleraient “sœur”. Oui monsieur. En effet, il ne s’agit pas du vêtement ni de la personne. Il s’agit de Christ, c’est ça qui est à l’intérieur, et nous devrions nous humilier."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu peut tout faire sans nous, mais nous ne pouvons rien faire sans Lui.", "i": [["ref", "<b>63-1114 L’influence<\/b>"], ["p", "168 Ce qu’il vous faut, les amis, mon frère, ma sœur et mes amis, c’est d’être conscients de votre petitesse. Voyez ? Ne soyez pas conscients de votre grandeur. Soyez conscients de votre petitesse. Vous êtes—vous êtes tout petits. C’est notre cas à tous. <b><i>Dieu peut tout faire sans nous, mais nous ne pouvons rien faire sans Lui.<\/i><\/b> Voyez ? Voyez ? Nous—nous ne pouvons rien faire sans Lui, mais Il peut tout faire sans nous."], ["p", "169 Dieu cherche à trouver une seule personne qu’Il peut avoir dans Ses mains. C’est ce qu’Il a toujours cherché à faire. Remarquez, tout au long de la Bible, quand Il a trouvé un Ésaïe, quand Il a trouvé un Jérémie. Puis un jour, Il a trouvé—Il a trouvé Samson ; cependant, Samson a donné sa force à Dieu, mais il a donné son cœur à Delila. Voyez, il…"], ["p", "170 Vous devez donner à Dieu tout ce que vous êtes — votre révérence, votre respect, votre être entier. Ne soyez rien, prenez simplement conscience de votre petitesse, et c’est ce que Dieu veut que nous fassions. Ça, c’est la vraie humilité. C’est ainsi que se conduisent ces Séraphins dans Sa Présence, voyez-vous, Ils ont la face couverte par respect, Leurs pieds, par humilité."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "PARENT RÉDEMPTEUR", "i": []}, {"t": "Les conditions pour être parent rédempteur", "i": [["ref", "<b>55-0223 Job, Serviteur De Dieu<\/b>"], ["p", "59 Maintenant, voici une grande image. Premièrement : un rédempteur, quelqu’un qui peut racheter un bien perdu, en Israël (Vous les prédicateurs, vous le savez), cet homme doit premièrement être un parent. Il doit être un proche parent, pas un parent éloigné, un proche parent. Et comment Dieu a-t-Il jamais pu devenir un proche parent ? C’est quand Dieu Lui-même a été fait chair et qu’Il a habité parmi nous, Il est devenu un parent de la race humaine. C’est vrai. Le seul moyen possible. Quand Dieu a été fait chair parmi nous, Il est devenu parent, pas celui des anges, mais celui des êtres humains. Il n’est point venu sous la forme d’un ange, mais Il S’est humilié Lui-même et Il s’est dépouillé de toutes Ses gloires célestes, Il est descendu et Il est devenu apparenté à l’homme, pour accomplir la loi de la rédemption par un parent. Oh, quel précieux amour le Père avait pour la race déchue d’Adam ! Il a donné Son Fils unique pour que Celui-ci souffre et qu’Il nous rachète par Sa grâce. Le voilà, un proche parent, Dieu fait chair et habitant parmi nous, devenant un parent de l’être humain, un parent."], ["p", "60 La chose suivante, Il doit être financièrement capable de le faire. Et qui pourrait être plus capable financièrement ? Quel genre de dette pourrait être payée ? En effet, Dieu est le Maître de tout l’univers qui existe, de tous les espaces, de tous les temps et de toutes choses, Il était financièrement capable. Alléluia ! Mais comme Il était sous la forme de l’Esprit, Il ne pouvait pas le faire, parce qu’Il était Esprit, et l’homme était humain. Et l’Esprit a été fait chair et a habité parmi nous, pour devenir notre Parent, en vue de nous racheter. Voyez-vous cela ? Remarquez…"], ["p", "L’accueil est étendu jusqu’à vous ce soir. Quand Dieu S’est dépouillé Lui-même, Il a quitté les palais d’ivoire, Il a pris la forme d’une chair pécheresse, S’humiliant, pour descendre, pour devenir parent du plus pauvre mendiant qui existe au monde ce soir, et devenir son parent, Jéhovah Lui-même, devenu parent du mendiant. Les renards ont des tanières, les oiseaux ont des nids, mais le Fils de l’homme n’a pas de place où reposer Sa tête. Il naquit dans une crèche. Il fut emmailloté… Pourtant Il était le Prince même de la gloire, le Soleil levant, d’en haut. Il s’est humilié, se rabaissant, condescendant, descendant, pour devenir parent des pécheurs, pensez-y. Comment pouvez-vous rejeter cet amour incomparable ?"], ["p", "61 Qu’était-ce ? Quand Dieu devint un pécheur, Il prit nos péchés. Jésus est devenu moi, afin que je puisse devenir Lui. L’Agneau innocent de Dieu, Il ne connaissait pas de péché, Il devint un pécheur afin que je puisse devenir un fils adopté de Dieu. Amen. Voilà le tableau de la véritable rédemption : comment Il est descendu, digne, s’étant dépouillé, sans maison, sans endroit où aller, s’étant humilié, s’étant rabaissé dans une chair de péché, Il S’est revêtu non pas de la nature des anges, non pas de la nature de Dieu, Il S’est revêtu de la nature de l’homme afin qu’Il puisse marcher en compagnie de l’homme, manger avec l’homme, dormir avec l’homme, et mourir pour l’homme. Vous y êtes. Tout le plan depuis le début, l’Agneau de Dieu sans tache, Le voilà, le Pain de Vie, ici sur la terre."], ["p", "Eh bien, la chose suivante à faire, c’était qu’un parent rédempteur devait être un parent très proche de l’homme, pour le racheter. Et la chose suivante à faire, il devait être digne de le racheter, être une personne juste et de bien. Un hors-la-loi ne pouvait tout simplement pas faire cela. Et qui pouvait être plus digne que Jéhovah Lui-même devenu chair ?"], ["p", "62 La prochaine chose qu’il devait faire, c’était un témoignage public qui montrait qu’il l’avait accompli. Alors, le lendemain matin, Boaz est allé aux portes et il a attendu. Et quand les anciens ont commencé à se rassembler, il a dit : «Un instant, un instant.» Ils ont rassemblé tous les anciens de la ville, hors de la porte. Ô Dieu, aie pitié. Ecoutez. Le témoignage public ne pouvait pas être fait dans la ville. Il devait être fait hors du camp, et les anciens devaient en être témoins."], ["p", "Et, il a fait venir les anciens, il a dit : «Aujourd’hui j’ai racheté Naomi, et s’il y avait quelqu’un, juste… » Quelqu’un était là, mais il ne pouvait pas racheter cela, il était aussi un parent, mais il ne pouvait pas racheter cela. Ainsi tout retomba sur Boaz."], ["p", "Il a dit: «Je dois racheter Naomi, et je vais – le bien de notre frère, je vais tout racheter.»"], ["p", "Et personne… Ils ont dit : «Eh bien, j’en suis témoin aujourd’hui ( chacun d’eux) que tu as racheté cela.» Et il a ôté son soulier, il l’a tendu à son voisin en guise de signe – en guise de signe qu’il avait tout racheté. Gloire à Dieu ! Il a racheté tout ce qu’elle avait perdu. Et en faisant cela, il a aussi  obtenu Ruth, comme épouse."], ["p", "63 Et quand Israël avait péché, et que l’homme avait péché, et qu’il s’était éloigné de Dieu, Christ est allé – vint ici comme un sacrifice sanglant, c’est ce que chaque agneau depuis la fondation représentait, en forme de type. Et quand le Soleil levant d’en haut est apparu, le Grand Jéhovah en chair dehors, est allé aux portes de la ville, Il était élevé, Il a été élevé entre les cieux et la terre, de sorte que Son corps ensanglanté montre par là qu’ « Il a été blessé pour nos péchés, brisé pour nos iniquités, le châtiment qui nous donne la paix est tombé sur Lui et c’est par Ses meurtrissures que nous avons été guéris»."], ["p", "Dieu a montré qu’Il a racheté la race déchue d’Adam. Voilà la rédemption. C’est Lui que Job avait vu très loin là-bas. Il a dit : «Je sais que mon Rédempteur est vivant, et qu’au dernier jour Il sera ici pour saigner et mourir à ma place. Quand ma peau sera détruite, Il se lèvera, quand je n’aurai plus de chair, je verrai Dieu. Je Le verrai et Il me sera favorable, mes propres yeux Le verront et non ceux d’un autre.»"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>60-1002 Le Parent rédempteur<\/b>"], ["p", "160 Maintenant souvenez-vous, la loi de la rédemption… comme nous approchons de la fin du service. Toute la loi de la rédemption va comme suit : Avant qu’un homme puisse racheter une propriété perdue, il devait être le plus proche parent. La condition suivante était qu’il devait, pour pouvoir le faire, être un homme intègre, un homme juste. Et puis, il devait être suffisamment riche pour le faire. Et ensuite, il devait témoigner publiquement qu’il l’avait rachetée. Et à partir de ce moment, elle devenait sa propriété. Donc, regardez maintenant."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>60-1002 Le Parent rédempteur<\/b>"], ["p", "160 Maintenant souvenez-vous, la loi de la rédemption... comme nous approchons de la fin du service. Toute la loi de la rédemption va comme suit: Avant qu'un homme puisse racheter une propriété perdue, il devait être le plus proche parent. La condition suivante était qu'il devait, pour pouvoir le faire, être un homme intègre, un homme juste. Et puis, il devait être suffisamment riche pour le faire. Et ensuite, il devait témoigner publiquement qu'il l'avait rachetée. Et à partir de ce moment, elle devenait sa propriété. Donc, regardez maintenant."], ["p", "161 Boaz représentait Christ. Maintenant, Ruth représentait l'Église, vous, le croyant. Et maintenant, Dieu, dans l'Ancien Testament, la seule manière qu'Il pouvait venir racheter ce qui avait été perdu, Dieu devait devenir un parent de l'homme. Et la seule manière que Dieu pouvait devenir un parent de l'homme, était d'être l'un d'entre eux. Amen."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "J’ADORE JÉSUS-CHRIST, LA PAROLE MANIFESTÉE DANS MON ÂGE", "i": [["ref", "<b>63-1214 Pourquoi la petite Bethléhem<\/b>"], ["p", "126 Je me suis dit : “Billy, c’est merveilleux. J’ai aimé voir cette puissance que Dieu t’a donnée de te tenir au milieu de tout ce tape-à-l’œil d’Hollywood, et donner un témoignage de Jésus-Christ, mais Il n’était pas Juif.” Jésus était Dieu, pas un Juif. Souvenez-vous, la cellule de sang provient du sexe masculin. Et Il n’était pas un homme, un Juif ou quelqu’un des nations ; Il était Dieu créé dans la chair. Nous ne sommes pas sauvés par le sang d’un Juif ni par le sang de quelqu’un des nations ; c’est par le Sang de Dieu que nous sommes sauvés. Il était Dieu, rien de moins. Il n’était ni Juif ni des nations. Par le Sang créateur de Dieu en Lui, nous devenons… S’Il était Juif ou des nations, nous serions tous perdus. Il était Dieu dans la chair. C’est vrai."], ["p", "127 Je n’adore pas un Juif ; quand j’adore Jésus-Christ, j’adore Dieu. Je n’adore pas une fiction ou une sorte de chose historique. J’adore Jésus-Christ, la Présence de Jésus-Christ en ce moment même, qui est Sa Parole manifestée dans cet âge-ci."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "BRANHAM, UN PÉCHEUR SAUVÉ PAR LA GRÂCE", "i": [["ref", "<b>60-0312 La Porte Du Cœur<\/b>"], ["p", "53 Juste pour que vous le sachiez, je vais tourner mon dos à l’auditoire. Maintenant rappelez-vous, après que je ferai ceci, ne m’envoyez pas des lettres en disant : «Frère Branham, tu te dis toi-même cet Ange-là ?»"], ["p", "C’est faux. Je suis un pécheur sauvé par la grâce de Christ. Peu importe ce que j’ai fait, peu importe combien Dieu m’a oint, si vous n’étiez pas vous aussi oint, ça ne marcherait pas. C’est votre foi qui fait cela. Ça, c’est juste un don, c’est juste tirer un levier assez loin en arrière pour permettre à William Branham de se retirer de la scène afin que Jésus-Christ puisse travailler."], ["p", "Et je vous assure, lorsque ces… l’Esprit de Vie commence à lutter contre l’esprit de mort, quelque chose se produit. Les ténèbres ne peuvent pas demeurer dans la lumière. La mort non plus ne peut demeurer là où il y a la vie. Il se passe quelque chose, basé sur quoi ? Sur votre foi."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "TOUT OBÉISSAIT À ADAM", "i": [["ref", "<b>57-0120M L’imitation du Christianisme<\/b>"], ["p", "171 Je vois la petite Ève appuyer sa petite tête contre l’épaule d’Adam. Elle était tout ce qu’une femme pourrait jamais souhaiter être, et plus encore. Elle s’appuyait contre la grande épaule puissante de son chéri, Adam, et ils se promenaient dans le jardin, et alors, il se peut, peut-être que le—le lion a rugi. Elle ne pouvait pas avoir peur, parce que la peur n’existait pas. Alors, il a dit : “Ma chérie, c’est le lion. Je vais l’appeler. Léo, le lion, viens. Shita, le tigre, viens et couche-toi ici.” Et ils les suivaient comme des petits chats."], ["p", "172 Le vent s’est levé, et les cheveux de la petite Ève se sont mis à voler au vent. Elle a dit : “Oh, ce vent !”"], ["p", "173 “Silence, tais-toi.” Et les vents lui obéirent. Il était le fils de Dieu. Elle était sa chérie."], ["p", "174 Et c’est comme si je l’entendais dire : “Chérie, tu vois le soleil se coucher ? C’est l’heure de parler à Papa.”"], ["p", "175 Alors, ils sont allés à la cathédrale, au grand Arbre. Et, comme ils s’agenouillaient, tout à coup, une éclatante Lumière Céleste est descendue, le Logos. Le Saint-Esprit, qui avait couvé la terre pour les en faire sortir, est descendu ; leur Père, Dieu. Et Il a dit : “Mes enfants, avez-vous passé une bonne journée ?"], ["p", "— Oui, Père."], ["p", "176 — Je suis descendu vous embrasser pour vous souhaiter bonne nuit et vous coucher ce soir.” Il les a embrassés sur les joues et les a couchés. Rien ne pouvait leur faire de mal. Il était là, dans les buissons, avec eux. Le lion, Il a couché le lion. Il a couché Shita, le tigre. Il les a tous couchés. Et Père était tellement content."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Vous pouvez chasser des démons, et prêcher, et malgré tout ne pas être en règle.", "i": [["ref", "<b>65-0822M Christ est révélé dans Sa propre Parole<\/b>"], ["p", "30 Cet âge de l’Eglise de Laodicée où les gens sont nus, aveugles, misérables, et ne le savent même pas. Voyez-vous, c'est… c’est qu’ils sont oints, oints du véritable Esprit. Voyez-vous, le Saint-Esprit peut tomber sur un homme, dans son esprit ; mais c’est son âme qui est son germe. Ce germe est la Parole. Voyez-vous ? Et… peu m’importe combien vous prêchez, combien vous faites bien ceci, combien vous aimez… Ça, c’est une des entrées de l’esprit. Vous ne pouvez pas aimer avec votre corps ; vous aimez avec votre esprit. C’est une des entrées. Et vous pouvez aimer, et même aimer Dieu, et malgré tout ne pas être en règle. Vous pouvez chasser des démons, et prêcher, et faire ces choses, et malgré tout ne pas être en règle. Jésus l’a dit. Il a dit que beaucoup viendraient en ce jour-là… C’est cette Parole qui tranche la question !"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LE CONDUCTEUR DE L’ÉGLISE, C’EST LE SAINT-ESPRIT", "i": [["ref", "<b>61-0521 Montre-nous le Père<\/b>"], ["p", "37 Nous dirons: «C’est l’instinct, c’est l’instinct qui le conduit.» Eh bien, si l’instinct peut conduire un canard, l’éloigner d’une zone gelée vers un lieu de refuge, combien plus le Saint-Esprit devrait-Il conduire l’Eglise du Dieu vivant. Le problème, c’est que nous ne reconnaissons pas cela. Nous écoutons nos conducteurs, des conducteurs humains, plutôt qu’un Conducteur donné par Dieu, le Saint-Esprit."], ["p", "Nous écoutons les évêques, les archevêques, les cardinaux et les prêtres, alors que nous devrions écouter le Saint-Esprit. En effet, c’est Lui qui a été donné pour conduire l’Eglise."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>62-1122 Le Retour et le jubile<\/b>"], ["p", "48 Et alors, qu’ont-ils fait ? La même chose qu’Israël fit. Ils commirent aussi leur grave erreur : ils voulurent s’organiser. Et qu’est-ce que cela fit à Israël ? Qu’est-ce que cela fit à Israël ? Cela… Ils n’acceptèrent pas la conduite du Saint-Esprit. Ils n’acceptèrent pas la conduite de Moïse. Ils essayèrent même d’élever Koré et Dathan et les autres pour – pour les conduire. Ils ne voulurent pas la conduite à laquelle Dieu avait pourvu pour eux."], ["p", "Et aujourd'hui, nous ne voulons pas la conduite, ou l’église ne veut pas la conduite pourvue par Dieu. Ils essayent d’envisager une autre voie. Ils vont aux séminaires, forment leurs hommes, en ressortent avec une expérience théologique."], ["p", "Oh ! je préférerais avoir comme prédicateur un homme qui ne connaît pas son abc, qui n’a jamais été dans un – un séminaire de théologie, mais qui a eu une expérience juste ici sur le flanc d’une colline de genêts – colline de sauges quelque part derrière une souche, et que Dieu a rempli du Saint-Esprit. Assurément. Laissez-le être conduit par l’Esprit. Dieu dirigera tout correctement dans sa direction. Il est comme un aimant : on ne peut le cacher. Pareil à une maison en feu par un temps de grand vent, on ne peut l’éteindre ; il continuera simplement à brûler. Il brûle pour Christ. Vous n'y pouvez rien. Oui."], ["p", "49 Mais, qu’ont-ils fait ? Ils ont fait la même chose qu’Israël avait faite. Oh ! ils avaient la victoire, ils criaient, ils dansaient ; ils parlaient en langues lors de la Pentecôte ici en Louisiane, il y a cinquante ans. Mais de la même manière qu’Israël voulut quelque chose à faire par lui-même, ainsi l’église Pentecôtiste a fait la même chose. Ils organiseront les Assemblées de Dieu. Puis, après cela, viendront les autres. Je crois qu’on les appelle les Unis, ou quelque chose comme ça. Puis viendra un autre, et ensuite un autre, et ensuite un autre, et ensuite un autre, jusqu’à ce que cela a atteint le point où ça se trouve aujourd’hui."], ["p", "Vous savez ce que vous avez fait ? La même chose qu’Israël. Lorsqu’ils rejetèrent le plan auquel Dieu avait pourvu pour eux, ils commencèrent à errer ça et là. C’est ce que l’église a fait aujourd’hui : errer partout et faire entrer tout dans leur dénomination : les fumeurs de tabac, et les impies mariés quatre ou cinq fois, et tout le reste, et les laisser prêcher ; et prendre là-bas un chanteur de musique folklorique des montagnes du sud des U.S.A., là un soir, et le laisser jouer sur l’estrade le soir suivant. Eh bien, c’est une disgrâce pour l’église du Dieu vivant quand on pense à une telle chose. Certainement."], ["p", "Qu’ont-ils fait ? Cela a amené des noms blasphématoires, rejeté la Pentecôte, le nom même qui devrait être saint ; ça l’a jeté dans la boue, car on dit: «C'est un Pentecôtiste. C’est une Pentecôtiste. Ce sont des Pentecôtistes. Regardez comment ils agissent et comment ils se comportent.» C’est vrai. Des noms blasphématoires… Certainement, c’est la vérité."], ["rev", "Rev. William Marrion Branham"], ["bib", " Samuel  8 :1-9"]]}, {"t": "Honte à ces ministres qui laissent des gens mariés deux ou trois fois être diacres dans une église", "i": [["ref", "<b>63-0116 Le messager du soir<\/b>"], ["p", "289 Vous les pasteurs qui laissez les gens venir, qui prenez pour diacres et tout le reste dans des tels offices, des gens ayant deux ou trois femmes en vie et tout, n'avez-vous pas honte, ministre? N'avez-vous pas honte de ces choses? Et vous acceptez là des tels membres alors qu'ils vivent dans l'adultère, ils fument la cigarette et font tout; et jamais on en parle à la chaire. Honte à vous. Je - je - je prie pour vous, frère."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Un Prophète est une lumière pour un peuple", "i": [["bib", "<b>Actes 13 :47 <\/b>"], ["ref", "<b>60-0522M L'adoption #3<\/b>"], ["p", "150 Eh bien, vous, espèce d'hypocrite! Qu'est-ce qui vous prend? Pauvre enfant illusionné. Vous êtes tellement loin de l'Evangile que ça fait pitié. On vous a entraîné vers une route boueuse, vers un dépotoir qui brûle. Ne voyez-vous pas ce qu'Il a dit, ici? Que tout esprit qui confesse que Jésus n'est pas venu en chair en ce moment même, est d'un mauvais esprit. La Bible dit que Jésus-Christ est le même hier, aujourd'hui et éternellement. Ce qu'Il a dit à l'époque, Il l'est maintenant, Il est comme ça éternellement. Ecoutez bien."], ["p", "Et vous n'avez point reçu un esprit de servitude, pour être encore dans la crainte; mais vous avez reçu un esprit d'a-... [L'assemblée dit: \"Adoption.\" - N.D.E.]"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu dans Branham", "i": [["ref", "<b>56-0213 Une Vie cachée avec Christ<\/b>"], ["p", "30 Je crois de tout mon cœur que Billy Graham et ces hommes sont des hommes de Dieu du moment pour le message que nous portons, ou plutôt qu’ils portent avec une grande inspiration. Ils n’accomplissent pas de miracles. Ils étaient les précurseurs de la Venue de Jésus-Christ comme Jean l’était. Jean n’avait jamais accompli de miracle, mais il a prêché l’Evangile qui a secoué toute la nation. Voyez-vous ? Mais il n’a jamais accompli de miracles. Mais après lui vint Jésus, qui n’était pas si fameux comme prédicateur, mais qui accomplissait des miracles pour prouver que l’omnipotence de Dieu subsiste encore et que Dieu vit."], ["p", "Et aujourd’hui, c’est dommage que les gens aient une conception mentale de l’Evangile, ou je dirais une foi intellectuelle au lieu d’une véritable foi vivante en Dieu."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>65-0118 La semence de discorde<\/b>"], ["p", "30 Quand un homme se tient là et dit qu’il est prédicateur de l’Évangile, et qu’il déclare que « les jours des miracles sont passés », ça, c’est la semence de discorde. Quand un homme se tient là et dit qu’il est ministre, pasteur d’une église quelque part, et qu’il ne croit pas que Jésus-Christ est le même dans les moindres détails (à l’exception du corps physique), « le même hier, aujourd’hui et éternellement », ça, c’est la semence de discorde. Quand il déclare que « l’âge des miracles et l’âge apostolique, c’est du passé « , ça, c’est une semence de discorde. Quand les gens déclarent : « La guérison divine, ça n’existe pas », ça, c’est une semence de discorde. Et le monde en est rempli. Ça ne laisse pas de place au blé, ça l’étouffe."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "L’Élie d’aujourd’hui, c’est Jésus-Christ lui-même", "i": [["ref", "<b>65-1127B Essayer de rendre un service à Dieu, sans que ce soit la volonté de Dieu<\/b>"], ["p", "212 Or, Il a promis cela, cela montre que la Bible est vraie jusqu’à ce jour, et Sodome et Gomorrhe. Et Elie n’était pas… Ce n’était pas Elie, c’était l’Esprit de Dieu sur Elie. Elie n’était qu’un homme. Bon, on a eu des Elie, des pardessus d’Elie, des manteaux d’Elie, et tout d’Elie. Mais l’Elie d’aujourd’hui, c’est le Seigneur Jésus-Christ. Il doit venir selon Matthieu dix-sep… ou plutôt Luc 17.30, cela où il est dit que le Fils de l’Homme doit paraître parmi les Siens. Pas un homme ; Dieu ! Mais ça viendra à travers un prophète. Et Il n’a jamais eu deux prophètes majeurs en même temps, jamais au monde. Voyez ? Peu importe combien il y a de… deux – deux têtes, ça ne peut pas… Il faut qu’il y ait une seule tête. Il faut que Dieu ait un seul homme sous Son contrôle. Voyez ? Il y a un seul Dieu ; il y avait le Père, le Fils et le Saint-Esprit, mais un seul Dieu au-dessus de tout ça, remarquez, qui ne faisait qu’utiliser ces fonctions. C’est ce qu’Il a fait avec Elie, l’Esprit d’Elie ; Il utilisait cet Esprit, mais c’est le même Dieu qui Le contrôlait tout le temps pour accomplir Sa Parole."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>64-0305 Persévérer<\/b>"], ["p", "13 Or, nous croyons que la Bible est la Parole infaillible de Dieu. Nous croyons qu’Elle est l’entière révélation de Jésus-Christ; qui se révèle dans l’Ancien Testament, par les prophètes; Dieu, se faisant connaître à travers Son Fils, Jésus-Christ, et en Lui habitait corporellement la plénitude de la Divinité. Il a été crucifié pour nos péchés; Il est mort, Il a été enseveli, Il est ressuscité le troisième jour, Il est monté au Ciel, et Il est de retour ici au Nom du... sous la forme du Saint-Esprit, Dieu qui habite... Autrefois, Dieu au-dessus de nous; en Christ, Dieu avec nous; maintenant, Dieu en nous. C’est Dieu qui retourne dans l’homme pour adorer, être adoré à travers l’homme, l’intermédiaire de Dieu. Dieu ne fait rien sans avoir un homme comme intermédiaire, comme aide."], ["rev", "Rev. William Marrion Branham"], ["p", "137 Eh bien, il est promis que ce même Messie se révélera aujourd’hui. C’est pareil ! Eh bien, Hébreux 13.8, écoutez donc, L’identifie comme étant le même hier, aujourd’hui et éternellement. Jean 14.8… Il est dit :   Celui qui croit en Moi (voyez) fera aussi les œuvres que Je fais. «  Jean 14.9… Nous voyons ici qu’il est dit : «  Encore un peu de temps, et l’ordre du monde, le cosmos, ne Me verra plus. Ils seront complètement aveugles. Ils ne Me verront plus. Donc, encore un peu de temps, ils ne Me verront plus, mais vos yeux s’ouvriront, car vous Me verrez ; car Je serai avec vous, même en vous, jusqu’à la fin du monde. «  «  Le même hier, aujourd’hui et éternellement. »"], ["ref", "64-0312 Quand Leurs Yeux S’ouvrirent, Ils Le Reconnurent"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "SE REVÊTIR DE TOUTE L’ARMURE", "i": [["bib", "<b>Josué 16 :<\/b>"], ["bib", "<b>Ephesiens 6 :<\/b>"], ["ref", "<b>62-0531 Le conflit entre Dieu et Satan<\/b>"], ["p", "54 En Éden, Dieu connaissait Son ennemi et toutes les attaques de Son ennemi. Or, Dieu est le Dieu infini, et le Dieu infini est la Perfection des perfections. Il connaissait toutes choses avant même qu’elles existent. C’est pourquoi, si ce Dieu infini pouvait regarder en avant (et c’est ce qu’Il a fait) et voir la fin dès le commencement, et qu’Il savait qu’Il aurait des enfants sur cette terre, Ses propres enfants bénis, ne croyez-vous pas qu’Il leur fournirait ce qu’Il a de mieux ? [L’assemblée dit : “Amen.” — N.D.É.]"], ["p", "55 Est-ce que vous, ce soir, pour vos enfants, qui sont de petits êtres sans défense, incapables de se suffire à eux-mêmes, est-ce que vous ne luttez pas, ne travaillez pas et ne faites pas tout ce que vous pouvez pour fournir ce qu’il y a de mieux, tout ce que vous êtes capables de fournir à ces enfants? [L’assemblée dit : “Amen.” — N.D.É.] Parce que vous êtes un père, un parent. Et si c’est ainsi que s’exprime la—la…ce que j’appellerais la—la loyauté et la pensée d’un parent terrestre. Et la paternité a eu son origine en Dieu, puisque c’est Lui qui a été le premier Parent. Alors, ne pensez-vous pas que Dieu, qui a vu ce que Satan serait, ce que Satan ferait, Il a donné à Ses enfants, Il leur a fourni ce qu’il y a de mieux? Comme Il savait quel serait le moyen d’attaque de l’ennemi, Dieu a mis Ses enfants à l’abri, Il les a fortifiés. Voyez?"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU DES CAS IMPOSSIBLES", "i": [["ref", "<b>53-0216 Mon Ange Marchera Devant Toi<\/b>"], ["p", "7 Maintenant, tout au long de ce voyage, Il a promis de pourvoir à tout ce dont nous avons besoin: \" Tout ce que vous demanderez au Père en Mon Nom, Je le ferai. Tout ce que (Marc 11.24)... Tout ce que vous désirez, quand vous priez, croyez que vous l'avez reçu, et vous le verrez s'accomplir. \" Or, Il nous a donné l'arme la plus puissante au monde, et c'est la prière. C'est la prière qui change les choses. Le chrétien ne réalise pas quelle puissance il possède lorsqu'il se met à genoux devant le Dieu Tout-Puissant au Nom de Jésus-Christ. Il ne réalise pas quelle - quelle puissance cela représente. Si seulement les gens peuvent réaliser que le - qu'avec ce qui leur est donné, tout ce que vous demandez vous sera accordé si vous pouvez vous emparer de la foi pour croire la chose. Car la Parole de Dieu est la vérité."], ["p", "8 Et maintenant, la Parole de Dieu vaincra Satan n'importe où, à n'importe quel endroit, n'importe quand. Eh bien, quand Jésus était ici sur terre, je - je crois qu'Il était, eh bien, qu'Il était Emmanuel. Dieu était en Christ, réconciliant le monde avec Lui-même. Donc, toutes les grandes qualités du Père étaient en Jésus-Christ, le Fils, quand Il était ici sur terre. Tout ce que le Père a Lui appartenait. Et tous les excellents dons qui sont en Dieu, et tout ce qui était [en Lui] , étaient en Christ. Mais quand Il a affronté Satan, Il n'a jamais utilisé un seul de ces dons. Il... juste pour être votre exemple, Il a amené les choses à un point où même le plus faible des chrétiens... Il a dit... Or, Il - Il avait le pouvoir en ce moment-là même pour réprimander Satan et le chasser. Mais  qu'a-t-Il fait? Il n'a jamais recouru à Son pouvoir…"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>62-0607 Se revêtir de toutes les armes de Dieu<\/b>"], ["p", "15 Vous savez, je pense  que c'était Lincoln qui avait une fois  dit: \" Préparez la guerre en temps de paix. \" Ou peut-être que ce n'est pas lui, mais on dirait, il me semble plutôt que c'était lui, qui avait fait cette déclaration: \" Préparez la guerre en temps de paix. \" Et ça serait pour nous une bonne pensée sur laquelle méditer. Pendant  que tout va bien, vous feriez mieux de vous préparer, car Satan ne laissera pas cela aller bien pendant très longtemps. Maintenant, vous êtes dans une convention, et tout va bien marcher. Mais dans quelques jours, vous allez partir d'ici et vous allez affronter l'ennemi. Peut-être qu'il ne pourra même pas attendre que vous soyez sur le point de partir. Il peut attaquer n'importe quand. Ainsi, il est  - il est méchant, impitoyable. Il fait cela n'importe quand qu'il le peut. Tout ce qu'il peut dire ou faire, il le fait maintenant même, il… C'est donc mieux d'être tout le temps armé."], ["p", "affronter dans votre - dans la voiture, il est difficile de dire où vous allez l'affronter. Ou il vous affrontera juste là, dans le siège, et moi, juste ici, à la chaire, n'importe où. Il est simplement - il est simplement méchant. Et il s'en fout. Ainsi, il nous faut être prêts pour cela."], ["p", "Et ce grand docteur, saint Paul, enseignait à l'église comment se revêtir de l'armure, et il comparait cela à un soldat  qui se prépare pour une grande bataille à venir."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "La télévision", "i": [["ref", "<b>59-1219 Questions et réponses sur le Saint-Esprit<\/b>"], ["p", "87 Eh bien, quelle que soit la personne qui a écrit ça, je suis d’accord avec elle. Ils en ont fait une malédiction pour le monde. Ça pourrait être une bénédiction pour le monde, mais ils en ont fait une malédiction. Pour toutes les choses de ce genre, mes chers amis, ça dépend de ce que vous-même, vous regardez. Si la télévision est une malédiction, alors les journaux sont une malédiction, alors la radio est une malédiction et, bien des fois, le téléphone en est une, vous voyez. Voyez ? Voyez ? Vous voyez, tout dépend de ce que vous en faites. Mais, comme le frère le disait l’autre soir, c’est qu’on n’a presque plus d’émissions à la télévision ; ça coûte trop cher. Un pauvre prédicateur qui prêche le Plein Évangile n’a pas les moyens d’avoir une émission à la télévision. Et donc… Le frère disait, l’autre soir, je crois, quelque part : “Dépoussiérez votre radio,” ou c’est quelqu’un d’autre, ou bien, “sortez-la de son coin et écoutez ces émissions-là.” C’est vrai."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "PRÉPAREZ LA GUERRE QUAND IL Y A LA PAIX", "i": [["ref", "<b>62-0607 Se revêtir de toutes les armes de Dieu<\/b>"], ["p", "15 Vous savez, je pense  que c'était Lincoln qui avait une fois  dit: \" Préparez la guerre en temps de paix. \" Ou peut-être que ce n'est pas lui, mais on dirait, il me semble plutôt que c'était lui, qui avait fait cette déclaration: \" Préparez la guerre en temps de paix. \" Et ça serait pour nous une bonne pensée sur laquelle méditer. Pendant  que tout va bien, vous feriez mieux de vous préparer, car Satan ne laissera pas cela aller bien pendant très longtemps. Maintenant, vous êtes dans une convention, et tout va bien marcher. Mais dans quelques jours, vous allez partir d'ici et vous allez affronter l'ennemi. Peut-être qu'il ne pourra même pas attendre que vous soyez sur le point de partir. Il peut attaquer n'importe quand. Ainsi, il est  - il est méchant, impitoyable. Il fait cela n'importe quand qu'il le peut. Tout ce qu'il peut dire ou faire, il le fait maintenant même, il… C'est donc mieux d'être tout le temps armé."], ["p", "Vous pouvez l'affronter dans la rue. Vous pouvez l'affronter dans votre - dans la voiture, il est difficile de dire où vous allez l'affronter. Ou il vous affrontera juste là, dans le siège, et moi, juste ici, à la chaire, n'importe où. Il est simplement - il est simplement méchant. Et il s'en fout. Ainsi, il nous faut être prêts pour cela."], ["p", "Et ce grand docteur, saint Paul, enseignait à l'église comment se revêtir de l'armure, et il comparait cela à un soldat  qui se prépare pour une grande bataille à venir."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Thème : la robe d’occasion", "i": []}, {"t": "Le lit du prophète", "i": [["ref", "<b>53-1122 La Résurrection De Lazare<\/b>"], ["p", "84 Dites donc, frère, cette femme connaissait quelque chose, n’est-ce pas? C’est un bon endroit où déposer l’enfant, dans la chambre du prophète, sur le lit du pasteur. Elle l’a déposé là sur le lit; elle a fait seller le mulet et est partie. Or, Dieu ne révèle pas toujours tout à Ses serviteurs."], ["rev", "Rev. William Marrion Branham"], ["p", "IL ne faut pas imiter le christianisme ne s’imite pas"], ["bib", "<b>Exode 7 :9-12 LSG <\/b>"], ["v", "9. Si Pharaon vous parle, et vous dit : Faites un miracle ! Tu diras à Aaron : Prends ta verge, et jette-la devant Pharaon. Elle deviendra un serpent. 10. Moïse et Aaron allèrent auprès de Pharaon, et ils firent ce que l’Éternel avait ordonné. Aaron jeta sa verge devant Pharaon et devant ses serviteurs ; et elle devint un serpent. 11. Mais Pharaon appela des sages et des enchanteurs ; et les magiciens d’Égypte, eux aussi, en firent autant par leurs enchantements. 12. Ils jetèrent tous leurs verges, et elles devinrent des serpents. Et la verge d’Aaron engloutit leurs verges. "], ["ref", "<b>57-0127A L’Imitation Du Christianisme<\/b>"], ["p", "15 Eh bien, nous voyons beaucoup de gens chercher à imiter le christianisme. Le christianisme est... ne veut pas dire adhérer à une église. Le christianisme est une expérience. Quelqu'un m'a dit... Eh bien, c'était à Little Rock, dans l'Arkansas. Nous étions au Roberson Memorial Auditorium, et les gens étaient rassemblés et entassés dans les rues, et le Seigneur accordait un grand réveil."], ["p", "Et il y avait un frère nazaréen qui était passé par l'estrade; et il vendait des crayons dans la rue. Il tenait les béquilles à l\"aide desquelles il avait marché pendant des années. Il s'appuyait sur ces béquilles, le chapeau enlevé contenait des crayons à vendre; un mendiant. Et quand le Seigneur, dans Sa divine providence, Sa sagesse et Sa grâce envers cet homme, a montré une vision, il lui a été dit quelque chose qui était arrivé, alors l'homme a été guéri sur-le-champ. Et le lendemain, il avait mis un grand écriteau sur ces béquilles, descendait la rue comme ceci, les trimbalant, montrant à tout le monde:  \" Ces vieux compagnons m'avaient autrefois soutenu. Maintenant, je m'appuie sur les bras éternels (et il était...) du Seigneur  Jésus. \""], ["p", "Il était très enthousiasmé. Et quand il est revenu à la réunion ce soir-là, il s'était assis en haut, au balcon, quelque chose comme cela. Et au mieux de mes souvenirs, il y avait deux ou peut-être-peut-être, deux ou trois balcons. Et, de toute façon, je venais de commencer à prêcher comme maintenant; il était tellement emporté, le pauvre jeune frère, qu'il s'est levé et a dit:  \" Frère Branham, j'aimerais vous poser une question. \""], ["p", "J'ai dit:  \" Oui, frère. \""], ["p", "Il a dit:  \" Je vous ai entendu prêcher, et j'ai tout de suite reconnu que  vous étiez un nazaréen. \" Et il a dit:  \" Ensuite, j'entends quelqu'un d'autre dire que  vous étiez un baptiste. \" Et il a dit:  \" Puis, je vois des pentecôtistes tout autour de vous. \" Il a dit:  \" Qu'êtes-vous, Frère Branham? \""], ["p", "J'ai dit:  \" C'est facile. Je suis pentecôtiste, nazaréen et baptiste. \" J'ai dit:  \" Exactement... \""], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Nous sommes dans le temps où nous devons nous examiner", "i": [["ref", "<b>57-0417 La Seconde venue du seigneur<\/b>"], ["p", "69 Frère, dans ces glorieuses heures que nous vivons maintenant, il nous incombe, à nous l’Eglise du Dieu vivant, de nous examiner, de venir devant Dieu, d’allumer la chandelle de la Parole de l’Evangile, et de nous examiner pour voir s’il ne nous manque pas quelque chose, surtout quand nous voyons tout ce qui se passe ; nous sommes au temps de la fin. La Venue de Christ est proche. Il n’y a pas d’autre espoir dans le monde pour l’Eglise."], ["rev", "Rev. William Marrion Branham"], ["p", "<b>1 rois 19 :19-<\/b>"], ["bib", "<b>Matthieu  19 :27-30<\/b>"], ["v", "<b>2 Cor 6 :14-<\/b>"], ["ref", "<b>64-0121 La Parole De Dieu Exige Une Séparation Totale D’avec L’Incrédulité<\/b>"], ["p", "32 Il est question d’une séparation totale. Nous ne devons plus rentrer dans le monde ni rien avoir à faire avec le monde, nous devons plutôt nous attacher à Dieu. Jésus vient chercher une Epouse, une Femme, une Eglise qui est séparée des choses du monde ou des soucis du monde. Elle est séparée des modes de cet âge moderne dans lequel nous vivons. Elle est séparée des–des soucis et des traditions des églises. Elle est mise à part uniquement pour Dieu, et Dieu est la Parole. Et comme le mari et la femme sont un, de même l’Epouse et la Parole deviennent un, car la Parole vit dans l’Epouse. C’est de cette manière–ce sont là ces papiers à elle. C’est cela son identification."], ["p", "59 Mais quand un homme naît dans le monde pour devenir un–un croyant, il devient un Naziréen quand il se sépare de tout ce qui est contraire à la Parole: une séparation totale. Jésus a dit: «Je suis venu séparer l’homme de sa femme, déchirer la famille. Et celui qui ne porte pas sa croix et ne Me suit pas n’est pas digne d’être Mien.» Une séparation d’avec tout, d’avec quoi que ce soit: d’avec l’église, d’avec–d’avec une communauté, d’avec une croyance, d’avec une famille, d’avec tout ce qui pourrait se tenir entre vous et la foi dans toute la Parole de Dieu. Si votre âme ne ponctue pas chaque promesse pour cette heure-ci d’un amen, il y a quelque chose qui cloche quelque part. Il vous faut une séparation."], ["rev", "Rev. William Marrion Branham"], ["ref", "56-1125M Un manteau de seconde main"], ["p", "125 Mais lorsque j’arriverai là, j’aimerais être conscient d’une seule chose, c’est que moi aussi, je porte une robe d’occasion. Je ne place pas ma confiance dans la mienne, car elle n’est pas bonne. En effet, aussitôt qu’Elie ramassa la robe d’Elisée, il déchira la sienne et la jeta par terre. Il en fut de même lorsque j’ai trouvé Christ. Je me suis déchiré, moi-même, mes propres idées, mon propre non-sens, mes petites choses insignifiantes. Je pensais, lorsque j’étais un petit prédicateur baptiste, que j’étais presque comme… que j’étais quelqu’un. Mais, j’ai déchiré cela ; j’ai revêtu Sa robe. Et lorsque j’arriverai au Jourdain, j’aimerais me voir revêtu de Sa robe. C’est cela qu’Il considérera. Et un jour, nous y arriverons."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "APPEL AU MINISTÈRE (SUITE)", "i": [["ref", "<b>59-0712 Une délivrance totale<\/b>"], ["p", "47 J’ai entendu Frère Neville annoncer ce matin, j’étais là-derrière, que…c’est comme si ça m’était venu à l’esprit, que les gens, semble-t-il, s’éloignent de la délivrance. Ça semble être quelque chose que les gens ont vu, et alors ils mettent ça de côté : “Oh, eh bien, Dieu peut le faire.” Mais ce n’est pas la bonne attitude."], ["p", "48 Moïse, là, quand il a été appelé par Dieu, il était un prophète total, complet."], ["p", "Quand Dieu envoie un homme pour faire quoi que ce soit, Il l’équipe complètement, de tout ce qu’il lui faut. Si Dieu appelle un homme à être un prédicateur, Il met quelque chose en lui, ce qu’il faut pour prêcher. S’Il l’appelle à être un docteur, Il met quelque chose en lui, ce qu’il faut pour enseigner. S’Il l’appelle à être un prophète, Il met quelque chose en lui, ce qu’il faut pour voir des visions et pour être un prophète. Dieu équipe toujours complètement Son homme."], ["p", "Et c’est exactement ce qu’Il a fait, quand Il a envoyé Moïse en Égypte. Il l’a élevé d’une certaine façon. Il l’a instruit d’une certaine façon, et Il l’a modelé, et l’a formé, et l’a façonné. Après qu’Il avait promis à Abraham, des centaines d’années auparavant, qu’Il délivrerait les gens, alors Il—Il avait prévu qu’Il formerait Moïse exactement comme Moïse l’a été. Moïse était un prophète complet. Et alors, puisqu’il était un prophète complet, alors…"], ["p", "49 Tout comme vous, si vous êtes un Chrétien, Dieu ne fait pas de demi-Chrétiens. Dieu fait des Chrétiens complets. Dieu ne fait pas de demi-prédicateurs, mais le prédicateur peut être un demi-prédicateur. Et Dieu fait de Ses enfants des Chrétiens, mais parfois ils sont des demi-Chrétiens. Seulement ce n’est pas l’intention de Dieu qu’ils soient comme ça. Ce sont leurs propres voies qui se sont mêlées au plan de Dieu pour leur vie, et c’est pour ça qu’ils sont comme ça. Dieu ne veut pas qu’ils soient des demi-Chrétiens, ou des demi-prédicateurs, faisant des compromis de part et d’autre, ou… Il veut qu’ils se tiennent complètement à la brèche."], ["p", "50 Or, Moïse, Dieu avait fait de lui un prophète complet, pour une délivrance complète. Et Moïse s’était complètement livré entre les mains de Dieu. C’est pour ça qu’il était alors ce qu’il était. Il était tellement complet en Dieu que Dieu pouvait avoir confiance en lui."], ["p", "51 Je me demande, ce matin, si, comme Chrétiens, nous avons abandonné notre propre volonté, et si nous nous sommes complètement abandonnés à Dieu, à tel point que Dieu peut avoir confiance en nous dans la position où Il nous a placés. Je me demande, ce matin, si moi-même, je pourrais être tellement abandonné à Dieu que Dieu pourrait avoir confiance en moi, pourrait avoir confiance en Frère Neville, pourrait avoir confiance en notre conseil des administrateurs, en notre conseil des diacres, ou aux membres de notre église. Nous avons tous une place, et nous avons un devoir."], ["p", "52 Le ministre a une place, son devoir, c’est de se tenir là et de prêcher les richesses insondables de Christ, sans faire de compromis, s’il est appelé à être un prédicateur. Il n’usera d’aucun ménagement envers qui que ce soit, s’il est appelé à être un prédicateur."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-0112 Questions et réponses<\/b>"], ["p", "36 L’homme qui cherche à fuir, c’est celui-là que Dieu utilise. Voyez ? S’il cherche à r
