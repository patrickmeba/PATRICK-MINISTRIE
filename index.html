Sa tête, les coupait courts, comme ça. Ça, c’étaient des cheveux courts."], ["p", "130 Donc, les dames qui ont les cheveux jusqu’aux épaules, ça, c’est encore des cheveux courts. Bon, je ne dis pas que c’est ce qui vous enverrait en enfer ou vous emmènerait au Ciel. Ça n’a rien à voir. Mais l’ordre établi pour l’église, c’est que les femmes aient de longs cheveux. C’est vrai; c’est vrai. Et d’entrer dans l’église… Et—et de ne pas s’occuper du tout des affaires, des affaires sociales, ou, non pas, je veux dire des affaires financières de l’église. Et elle doit être obéissante, et respectueuse et tout, comme ça, parce que c’est elle, nous dit la Bible, qui a causé la première chute. Et c’est vrai; c’est vrai. Maintenant, en vitesse. J’espère que ça ne vous a pas froissées."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "POURQUOI BRANHAM A DIT", "i": [["bib", "<b>Amos 3:7<\/b>"], ["v", "<b><sup>7 <\/sup><\/b>Car le Seigneur, l'Éternel, ne fait rien Sans avoir révélé son secret à ses serviteurs les prophètes."], ["p", "<b>2 Timothée 1 :8<\/b>"], ["p", "6 C’est pourquoi je t’exhorte à ranimer le don de Dieu que tu as reçu par l’imposition de mes mains."], ["p", "7 Car ce n’est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d’amour et de sagesse."], ["p", "<b><i>8 N’aie donc point honte du témoignage à rendre à notre Seigneur, ni de moi son prisonnier. Mais souffre avec moi pour l’Évangile,<\/i><\/b>"], ["bib", "<b>Actes 15 :21<\/b>"], ["v", "Car, depuis bien des générations, Moïse a dans chaque ville des gens qui le prêchent, puisqu’on le lit tous les jours de sabbat dans les synagogues."]]}, {"t": "Il n’y a rien de mal à avoir de l’argent", "i": [["ref", "<b>65-1031A Être conduit<\/b>"], ["p", "45 Ainsi, Jésus dit alors : « Si tu veux entrer dans la Vie, la Vie Eternelle, si tu veux être parfait, alors, va vendre ce que… » Vous voyez, eh bien, <b>il n’y a rien de mal à avoir de l’argent. Vous voyez ? Il n’y a rien de mal à avoir de l’argent, à être riche. D’être un dirigeant, il n’y a rien de mal à cela. Mais il – il s’agit de la façon dont vous agissez après que vous l’êtes devenu, vous voyez ? Il dit: \"Va, vends ce que tu as, et donne-le aux pauvres, à ces gens qui n’ont rien, puis, viens et suis-Moi, et tu auras des trésors dans le Ciel. »<\/b>"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "QU’EST-CE QUE L’INIQUITÉ", "i": [["ref", "<b>65-0725M Les oints du temps de la fin<\/b>"], ["p", "190 Qu’est-ce que l’iniquité? Demandez à quelqu’un. C’est “quelque chose que vous savez que vous devriez faire, et vous refusez de le faire”. Ils connaissent cette Parole. Ils L’entendent. Vous écoutez cette bande. Vous écoutez ce Message. Vous voyez le Seigneur Dieu le dire; vous Le voyez le confirmer, montrer que c’est vrai. Et vous Le savez, c’est aussi clair que le soleil qui brille dehors, mais vous, qui allez rester attaché à votre dénomination, rester attaché à ces choses fausses; vous, ouvrier d’iniquité!"], ["p", "“Oh oui, j’ai fait des grandes campagnes. J’ai fait ceci. J’ai fait cela."], ["p", "— Retire-toi de Moi, toi, ouvrier d’iniquité, Je ne t’ai jamais connu."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Parler de la vie des autres", "i": [["ref", "<b>63-0728 Christ est le mystère de Dieu révélé<\/b>"], ["p", "87 Rapprochez-vous d’autant plus les uns des autres. Serrez bien… Prenez cette attache, comme le frère l’a témoigné, un ministre, l’autre soir, là, il parlait d’avoir une attache, il avait vu ça en vision. Simplement, c’est ce qui attache toute l’armure de Dieu. Revêtez-la bien, resserrez-la, approchez-vous tout près les uns des autres. Aimez-vous les uns les autres, quoi qu’il arrive. Parlez avec bienveillance les uns des autres, dites du bien les uns des autres, et alors Dieu vous bénira."], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "UN CHRÉTIEN EST UN HOMME MYSTIQUE", "i": [["ref", "<b>63-0825E La Foi parfaite<\/b>"], ["p", "112 Mais Jésus vivait dans un monde que personne ne connaissait. Il était une personne étrange. Il vivait dans un monde de Foi parfaite dans le Dieu parfait, dans Lequel Il était. Si nous vivions comme des Chrétiens avec une Foi parfaite, nous serions des mystiques pour le monde : les gens ne vous comprendraient pas. Vous marcheriez dans l’Esprit. Ce que l’Esprit dirait, vous le feriez. Ce qu’Il interdirait, vous ne le feriez pas. Alors, les gens commenceraient à dire… Vous seriez une personne mystique pour eux."], ["p", "113 C’est ainsi pour tous les croyants, ils sont des mystiques. Les gens ne comprennent pas, parce qu’ils vivent dans un monde à eux. Jésus vivait dans un monde que personne d’autre ne pouvait toucher. Les disciples ne pouvaient pas Le comprendre. Quand Il leur parlait, ils disaient ensuite : “Tu parles par énigmes! Nous ne comprenons pas ceci. Comment cela peut-il être?” Voyez-vous, ils n’étaient pas dans le monde dans lequel Il vivait. Ils ne pouvaient pas Le comprendre, personne ne pouvait Le comprendre."], ["p", "114 Ainsi, quand un homme vit par la foi et marche par la foi, je veux dire la foi en tant que substance, il est isolé du monde entier et devient une nouvelle créature en Christ. Maintenant, vous arrivez dans la matière pour l’Épouse. Voyez-vous? Maintenant, vous arrivez dans la condition nécessaire pour l’Enlèvement. Cela veut dire que chacun d’entre nous, pas seulement le pasteur, les diacres ou les administrateurs, mais aussi les laïques, chaque individu marche dans un monde avec Dieu seul. Vous êtes baptisé dans ce Royaume, et il n’y a personne là, si ce n’est vous et Dieu. Voyez-vous? Il donne les ordres, et vous les exécutez. Quoi qu’Il dise, il n’y a nulle part l’ombre d’un doute, vous continuez votre marche. Si le Seigneur dit ceci, il n’y a personne au monde qui puisse vous en dissuader, vous continuez à avancer de la même façon. Maintenant, vous arrivez à cette Foi parfaite, une parfaite perfection qui ne peut faillir. Cette foi-là ne faillit jamais. Oui, Il était un mystique pour eux, avec Sa Foi parfaite. Et c’est comme ça maintenant, ceux qui ont la Foi parfaite sont des mystiques pour les autres."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "HABILLEMENT D’UNE FEMME", "i": [["ref", "63-0626 Pourquoi ?"], ["p", "120 Une femme m’a dit, il n’y a pas longtemps, je m’en prenais à elle à cause du port de ces petits habits scandaleux. Et elle a dit : «Eh bien, Frère Branham, laissez moi vous le dire, vous n’avez pas le droit de dire cela. Nous avons le droit de porter les habits courts si nous le voulons.»"], ["p", "121 J’ai dit : «Je pense que c’est vrai. Mais si vous étiez une chrétienne, vous n’aimeriez pas les porter.» Elle a dit, elle a dit…"], ["p", "122 Et elle a dit : «Eh bien, attendez donc, Frère Branham.» Elle a dit : «Vous savez, on ne fabrique plus ce genre de tissus ; il n’y a que ces habits sexy, et autres comme cela.»"], ["p", "123 J’ai dit : «On produit toujours des rouleaux des tissus et on fabrique des machines à coudre. Il n’y a pas d’excuse.» C’est vrai."], ["p", "124 C’est parce qu’on ne veut pas prendre cette inoculation des remplissages par le Saint-Esprit avec une sainteté à l’ancienne mode des sauvés de Dieu. Amen. C’est vrai."], ["p", "125 Autrefois, c’était mal de faire ces choses. C’est toujours mal ! C’est vrai. Mais le problème, c’est que quelque chose est arrivé. Autrefois, les gens qui agissaient comme cela étaient même excommuniés de la société ;  aujourd’hui, on ne peut pas les intégrer dans la société à moins qu’ils fassent cela. Et alors, vous voyez, ça dépend de là où est votre cœur, c’est là aussi que se trouvent vos trésors ; ou plutôt là où se trouve votre trésor, c’est aussi là que se trouve votre cœur. Vous devez vous souvenir que, si vous aimez le Seigneur de tout votre cœur, vous mènerez une vie pure et nette."]]}, {"t": "TU SERAS JUGÉE POUR TON HABILLEMENT, SŒUR", "i": [["ref", "<b>65-1205 Les choses qui sont à venir<\/b>"], ["p", "97 Maintenant remarquez ceci. Vivre pour Lui, en se gardant du monde. Maintenant observez. Vous regardez la télévision, certaines d’entre vous, les sœurs, et vous allez là, quelque part, et vous avez ce désir, vous, les jeunes femmes. Vous êtes jeunes. Je le sais. Mais vous êtes Chrétiennes. Voyez? Vous êtes différentes. Vous n’avez pas à être comme le monde. Vous aimez ce monde. Pas seulement vous, les jeunes; certaines d’entre vous qui êtes plus âgées. Voyez? Eh bien, qu’est-ce qui produit ça? Voyez? Vous regardez la télévision, vous allez au magasin et vous voyez ces espèces de petits vêtements que portent les femmes, qui sont indécents."], ["p", "Vous savez ce qui va arriver au Jour du Jugement? Vous avez beau être aussi fidèle à votre mari qu’on peut l’être, pourtant, au Jour du Jugement, vous aurez à répondre d’avoir commis adultère. Jésus a dit : “Quiconque regarde une femme pour la convoiter a déjà commis un adultère avec elle dans son cœur.” À qui la faute? À vous. Voyez? Vous vous êtes exhibée comme ça, en short et en pantalon."], ["p", "Il n’y a pas longtemps, une femme m’a dit : “Je ne porte pas de shorts, Frère Branham. Je remercie le Seigneur pour ça. Je porte des pantalons.”"], ["p", "98 J’ai dit : “C’est pire.” C’est pire. C’est vrai."], ["p", "99 Il n’y a pratiquement plus moyen, pour une femme, d’acheter une robe. Elle a dit, une femme a dit : “Eh bien, vous avez dit la vérité. ‘Il n’y a pas moyen. Il n’y a pas moyen d’en acheter.’” Mais on vend encore du tissu et des machines à coudre. Voyez? Vous n’avez donc aucune excuse. Voyez? Voyez?"], ["p", "On voit par là, sœur. Je suis votre frère. Et je suis un serviteur de Christ qui devra répondre, au Tribunal du Jugement, de ce que je dis ici ce soir. Voyez? Vous serez reconnue coupable d’adultère, parce que l’amour de Dieu s’est échappé de votre cœur. Vous allez encore à l’église. Peut-être que vous dansez encore par l’Esprit. Peut-être que vous parlez encore en langues. Et ces choses-là, c’est bien, mais encore là, ce n’est pas Ça qu’il faut. Non monsieur."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LE MESSAGE C’EST LE SANG", "i": [["p", "<b>L'Enlèvement 04/12/1965 SHP<\/b>"], ["p", "178 Je me suis dit: \"Oh! mon Dieu, un jour il y aura une déflagration qui viendra du ciel, et les morts en Christ ressusciteront premièrement. Ces saints de l'Ancien Testament, qui attendent là-bas une déflagration, sortiront de là premièrement, pour entrer dans la résurrection. Nous nous mettrons en ligne et nous irons vers les cieux, ces vieux corps mortels changés, devenus semblables à Son propre corps glorieux. Quel - quel défilé ce sera quand il commencera à se diriger vers le ciel un de ces jours, dans ce temps de l'enlèvement, qui est devant nous, oh! montrant fièrement le Sang de Jésus-Christ sur leurs poitrines, le Message de Dieu de l'heure dans laquelle ils vivaient. C'est le moment que nous attendons, frères. \""], ["rev", "Rev. William Marrion Branham"], ["ref", "61-0108 Apocalypse, chapitre quatre, 3<sup>e<\/sup> partie"], ["p", "103 Oh, n’est-ce pas merveilleux ? “Sept fois vers l’est.” Qu’est-ce ? Les Sept Âges de l’Église seront couverts par le Sang. Alléluia ! Le Sang de Jésus-Christ y est suffisant hier, aujourd’hui, et éternellement, et dans chaque âge, afin de sauver chaque pécheur, de guérir chaque malade, d’accomplir chaque miracle et chaque signe. “Sept fois”, tout là-bas dans l’Ancien Testament, mille quatre cent quatre-vingt-dix ans avant la venue de Christ. Pensez-y ! Un symbole : “sept fois…”"], ["p", "Il égorgera le bouc expiatoire pour le peuple, et il en portera le sang avec du… dans le voile. Et fera avec ce sang comme il a fait avec le sang du taureau,… l’aspersion sur le propitiatoire et devant le propitiatoire."], ["p", "C’est ainsi qu’il fera l’expiation pour le sanctuaire à cause des… des impuretés des enfants d’Israël et de toutes les offenses par lesquelles ils ont péché. Il fera de même pour la tente d’assignation, qui est avec eux, qui est au milieu de—de leurs impuretés."], ["p", "104 Qu’était-ce ? “Le propitiatoire.” Où sont-ils maintenant ? Et là, à l’intérieur de l’arche, il y avait quoi ? La loi. Et quant à la loi, celui qui transgressait un seul commandement mourait sans miséricorde. Mais, étant donné que vous pouviez obtenir miséricorde, il fallait qu’il y ait du sang sur l’autel. On en faisait l’aspersion sur le propitiatoire. Et le propitiatoire, c’est l’autel où on s’agenouille pour implorer la miséricorde. Que Dieu ne nous laisse jamais ôter cela de nos églises, cet autel à l’ancienne mode, où les hommes peuvent s’agenouiller et implorer la miséricorde de Dieu. Et la miséricorde est riche, elle coule librement du Sang du Seigneur Jésus. Maintenant, ça aussi, c’est la miséricorde. C’est le propitiatoire."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "SERVIR DIEU C’EST SERVIR SON MARI", "i": []}, {"t": "SERVIR DIEU AVEC SON ARGENT", "i": [["ref", "<b>63-0324M Questions et réponses sur les Sceaux<\/b>"], ["p", "84 Si vous bâtissez une maison, allez, construisez-la. Si Jésus vient demain, vous serez trouvé fidèle, à votre poste. Si vous bâtissez une église, allez-y, construisez-la. J’aimerais mieux placer mon argent dans quelque chose comme ça, plutôt que d’être trouvé avec l’argent dans ma poche. Voyez?"], ["ref", "<b>64-0315 L’influence<\/b>"], ["p", "98 Tenez-vous-en strictement à votre vocation. Tenez-vous-en à la Parole de Dieu et n’en bougez pas pour quoi que ce soit. Tenez-vous-y, restez avec votre appel. S’Il vous donne un travail, comme fermier, soyez un bon fermier. Si Dieu vous bénit dans ce travail, payez vos dîmes et quoi que ce soit d’autre, vos offrandes, afin d’aider le ministère à aller de l’avant. S’Il a fait de vous un mécanicien, et qu’Il vous a béni dans ce travail, tenez-vous-en à ça et remerciez-Le pour cela. Voyez ? Restez simplement là où Dieu vous a appelé."], ["p", "100 Voyez, là, il y a une autre chose que nous devons savoir. Peu importe combien Dieu vous a béni, vous n’avez pas le droit de réprimander les oints du Seigneur, ou de dire quoi que ce soit contre eux. C’est vrai. Dieu est Celui qui doit s’en occuper. Si on doit leur faire des réprimandes, ce sont Ses enfants; vous, laissez-les tranquilles. Vous n’êtes pas censé le faire. Voyez-vous?"], ["p", "101 Et quand on—on parle aux gens de leurs péchés, et qu’on leur dit qu’ils agissent mal : “Sortez! Ne cherchez pas à aller au Ciel par un système d’organisations ou quelque chose comme ça.” Miséricorde! ils auraient, ils… Ils ont envie d’exploser. Ils le feront. Ils cherchent des failles en vous; ils ne—ils ne s’assoient même pas pour vous écouter; ils se lèvent et sortent, ils sont impolis et se conduisent n’importe comment. Vous voyez, au départ, cela montre une mauvaise éducation, un manque de savoir-vivre. Certainement."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "À QUOI ME SERVIRONT LES CHOSES DE CE MONDE ?", "i": [["ref", "<b>56-0805 L’Église et sa condition VGR<\/b>"], ["p", "130 Ô Dieu bien-aimé, cher Agneau mourant, Toi qui es doux, humble et modeste. Les oiseaux avaient des nids et les renards avaient des tanières, mais Toi, Tu n'avais pas de demeure, bien  que Tu  sois le Seigneur de Gloire Lui-même; lorsque Tu es né, on n'avait pas de vêtements à Te mettre. Ô Dieu! A quoi me serviront mes habits alors? A quoi me serviront mes voitures? A quoi me servira une jolie maison? A quoi me servira tout cela en ce jour-là? Tu étais sans ami, personne ne voulait se lier d'amitié avec Toi. Personne ne paraissait vouloir Te tendre une main secourable. Tu as dit  que Tu  dirais ce jour-là: \" J'avais faim et vous ne M'avez pas nourri. J'étais nu et vous ne M'avez pas vêtu. \" A quoi nous servira, en ce jour-là, tout ce que nous avons, Seigneur? Laisse-nous prendre position pour Toi afin que, quand cette heure arrivera et  que nous entrerons en Sa présence, Lui, l'Omnipotent, l'Omniprésent, l'Omni... Ô Dieu! lorsque nous entendrons cette Colombe, ayant Ses  ailes rabattues, se tenant dans cette grande Lumière, cela brillera à travers toute l'Eternité. Sachant que  Tu habites dans la  Lumière..."], ["p", "131 “Lorsque je devrai me tenir là, tout seul, et que mon frère, mon pasteur, ma mère, mon père, ma femme et mes enfants seront partis! Ô Dieu, que vais-je faire alors, Seigneur? Que vais-je faire alors? Cela peut arriver ce soir, avant le coucher du soleil. Mais que vais-je faire? Que puis-je faire? Ô Christ, je veux prendre position pour Toi maintenant. Je ferai mon choix aujourd’hui. Je vais cesser tous mes bavardages sur autrui. Je vais abandonner tout mon tempérament colérique. Je vais laisser de côté tous mes différends. Je vais abandonner toute chose. Dépouille-moi, Seigneur, prends tout ce que j’ai. Simplement prends-moi, Seigneur. Je veux me tenir à Ta place. Je veux être tondu. Je désire que tout égoïsme, tout orgueil, toute indifférence soient simplement ôtés de moi. Et puis, je désire prendre position pour Toi comme un agneau tondu, prêt à abandonner tous les plaisirs de—ce qu’on appelle les plaisirs de la vie, toutes les danses, toutes les réceptions, tous les vêtements indécents, le fard, le rouge à lèvres, le vernis à ongles, toute cette indifférence qui ressemble au monde. Tu as dit : ‘N’agissez même pas comme le monde. Ne vous associez même pas au monde. Sortez du milieu d’eux.’ Ô Dieu, aide-moi, Seigneur! Dépouille-moi, aujourd’hui! Prends-moi comme un agneau et rends-moi muet! Que je n’ouvre pas la bouche; que je ne dise rien à ce sujet. Que je me tienne simplement là et sois tondu.”"], ["p", "132 Ô Dieu, quelle différence cela fait! Je me souviens lorsqu’une fois, Tu m’as dépouillé. Tu as pris ma femme, mon petit enfant, mon père, mon frère, Tu m’as complètement dépouillé. Cependant, dans mon cœur, je savais que je T’aimais. Comme Tu m’as béni, et comme Tu as été bon! Tout ce que je suis, tout ce que je pourrais être ou tout ce que je serais vient de Toi, ô Dieu, cela vient de Toi. Je confesse mes erreurs. Je confesse tout ce que j’ai fait ou pensé. Dépouille-moi seulement, Seigneur, je désire être Ton agneau."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "METS TOUT CE QUE TU AS AU SERVICE DE DIEU", "i": [["ref", "<b>58-0620 La Reine Du Midi<\/b>"], ["p", "39 Vous y êtes ! Si seulement le peuple des Etats-Unis pouvait être autant sincère pour voir si Dieu a promis qu’Il déverserait le Saint-Esprit dans les derniers jours sur Son peuple, sur Son Eglise, avec des signes, des prodiges et des miracles, et qu’Il appellerait un peuple du milieu des Gentils pour porter Son Nom. Par contre, ils prennent à la place un vieux credo mort (c’est juste), quelque chose d’historique. Alors l’histoire… S’Il n’est pas le même Dieu aujourd’hui, alors Il n’est pas Dieu, Il est mort. Mais grâces soient rendues à Dieu, Il est toujours le même Dieu."], ["p", "Ainsi elle était déterminée à aller voir. Eh bien, elle devait faire face à bien des choses, pour pouvoir y aller. Et alors, elle s’est décidée ; elle a dit : «Maintenant, je suis excommuniée de toute façon, à cause de ça. Ainsi donc, si j’y vais… Je supporte cette histoire jusque là ; je vais amener avec moi de l’or ; et si c’est la vérité, je vais soutenir cela. Si ce n’est pas la vérité, je vais laisser tomber cela.»"], ["p", "Si seulement les gens avaient des pensées aussi élevées aujourd’hui, au lieu de placer tout leur argent dans une sorte de rituel ou de credo mort (la construction des églises équivalant à des millions de dollars au lieu de soutenir des missionnaires pour faire parvenir l’Evangile aux gens, un Dieu vivant, un Christ ressuscité), vous seriez un peuple plus avisé, les amis. Ne mettez pas votre argent dans quelque chose qui n’est rien qu’un tas de fanatisme ; ne soutenez pas quelque chose qui est mort et qui sent mauvais. Soutenez Christ, le Dieu vivant. Placez votre… pas seulement votre argent, mais votre temps, vos prières, vos efforts, votre talent, tout ce que vous avez, donnez-le-Lui."], ["p", "Elle a dit : «Je vais charger ces chameaux de myrrhe et d’encens, je vais charger ces chameaux d’or et d’argent. Et si la chose est la vérité, à savoir que ce Dieu vivant a un témoignage vivant, alors je vais soutenir cela. Mais si ce n’est pas le cas, je vais ramener mon or.» C’est une bonne chose à faire ; c’est une bonne pensée."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0901M Le Signe<\/b>"], ["p", "<b>340 L’obéissance entière, complète, fait que vous et la Parole n’êtes qu’Un. Vous La croyez toute, chaque mot. Et Elle est toute en vous, et vous La regardez agir à travers vous.<\/b>"], ["p", "<b>341 Vous ne vous conduisez pas n’importe comment. Voyez-vous? Vous êtes un chrétien. Peu importe ce que quiconque dit, cela ne vous affecte pas du tout. Vous êtes en Christ. Vous êtes en sécurité au possible.<\/b>"], ["p", "<b>342 Quand la mort frappe à la porte, elle n’a aucun pouvoir, voyez-vous, aucun. Pourquoi? Elle vous fait simplement passer d’ici à Là!<\/b>"], ["p", "<b>343 L’âge n’a aucune importance. Vous êtes affranchi de l’âge. Vous êtes dans l’éternité, parce que vous êtes en Lui. Il est éternel. Que vous soyez jeune, vieux, d’âge moyen, peu importe, cela n’a aucune importance. Que vous soyez beau, laid, court, gros, et que sais-je encore, cela n’a aucune importance. Aucune.<\/b>"], ["p", "<b>344 Vous ne passez pas votre temps à cela et à toutes ces autres choses. Vous– vous avez dépassé cela. Vous êtes mort. Votre vie est cachée en Dieu, à travers Christ. Vous êtes scellé à l’intérieur par le Saint-Esprit, vous marchez en Christ. Le seul objet que vous voyez, c’est Christ. C’est tout. C’est le seul; et vous marchez. Oh! la la! Pas étonnant que nous ayons l’habitude de chanter ce petit cantique:<\/b>"], ["p", "<b>Remplis mon chemin d’amour chaque jour,<\/b>"], ["p", "<b>Comme je marche avec la céleste Colombe;<\/b>"], ["p", "<b>Laisse-moi toujours marcher, chantant et souriant,<\/b>"], ["p", "<b>Remplis mon...<\/b>"], ["p", "<b>345 Que je sois un frère. Que je sois un exemple vivant de ce que Christ a dit qu’un homme devrait être. Que je sois un frère pour un frère, un frère pour une soeur. Que je sois un–un prédicateur pour les prédicateurs; que je sois l’exemple des exemples. Que je montre à ce monde que cette Parole est Christ. Le seul moyen pour moi de pouvoir le faire, c’est d’entrer en Lui, parce que je ne peux pas le faire moi-même, vous non plus. Mais laissez la Parole et vous devenir Un, alors c’est Elle qui vit à travers vous; vous êtes alors une épître ambulante de Jésus-Christ, quand Celui-ci exerce la pleine autorité, la pleine autorité sur vous, pour faire que chaque Parole.<\/b>"], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "CARACTÈRE D’UN BON SERVITEUR DE DIEU", "i": [["ref", "<b>54-0721 Ayez bon courage<\/b>"], ["p", "2 C’est vraiment un privilège pour moi ce soir ! Je suis venu tôt pour suivre ce merveilleux cantique. Généralement, je ne fais pas ça. Et – et j’ai apprécié le ministère de mon frère Bosworth : sa prédication, son enseignement, il est… il enseignait cet Évangile alors que j’étais un – probablement avant ma naissance. Et je… Ça me fait du bien de l’entendre, ô comme il peut toujours lier Satan par les Ecritures et…"], ["p", "Je l’ai suivi dans des discussions, des débats, et je vous assure qu’il prêche la Parole de telle manière que le – Satan ne peut absolument pas rester là où il se tient. Et quant à la voix, il n’a certainement pas une voix forte, peut-être, comme certains, mais il sait certainement de quoi il parle. Et c’est depuis plusieurs années que je connais frère Bosworth, et je sais que sa vie… Ce n’est pas étonnant que Dieu exauce ses prières, il vit ce dont il parle. Vous savez, un sermon vécu vaut mieux qu'un sermon prêché. Vivez-moi un sermon, c’est de loin mieux."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>65-0822<\/b><b><sup>E<\/sup><\/b><b> Le Filtre d’un homme qui réfléchit<\/b>"], ["p", "73 Oh ! quelle grâce de la part de Dieu de nous donner la compréhension des mystères si grands ! Comme Paul le dit ici plus loin, dans Ephésiens, lorsqu’il parle du mari et de la femme, il dit : «C’est un mystère», montrant que les femmes doivent respecter leur mari. Je crois que c’est la deuxième place dans toute la Bible où il soit parlé du respect, disant que les femmes doivent respecter leur mari, respecter leur mari. De même, un mari devrait avoir devant sa femme une vie telle que celle-ci puisse le respecter comme un fils de Dieu. S’il n’a pas ce genre de vie, alors, bien sûr, elle ne pourra pas le respecter, sachant de quoi il est fait. Mais, quand c’est un homme qui est respectueux et pur envers sa femme et devant sa famille – un véritable serviteur de Dieu – alors la femme, les enfants et tous devraient respecter ce serviteur de Dieu, avec révérence."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>62-0117 Présumer<\/b>"], ["p", "251 Aucun ministre n’a le droit, peu importe combien il est intelligent, combien il connaît la théologie, et combien il connaît la Bible, il n’a rien à faire avec la chaire, avec la prédication de l’Evangile jusqu’à ce qu’il ait premièrement rencontré Dieu. Non pas présumer en disant : «Je dois aller. J’aurais un meilleur mode de vie, j’espère que je n’aurais pas à travailler trop, trop dur.» Vous vous trompez là, frère, si vous êtes réellement un prédicateur. Oui. «Mais, je vais… Et les gens seront comme ceci. Je deviendrai populaire dans le–le quartier où j’habite, et des choses semblables. Je pense que c’est la chose qu’il faut que je fasse.» Ce n’est pas ça."], ["p", "252 Un appel de Dieu, c’est quelque chose que vous ne présumez pas. C’est quelque chose–une expérience réelle, quelque chose dont vous avez parlé avec Dieu face à face, et vous savez que vous avez reçu la commission d’aller le faire. «Assurément, je serai avec toi.» Vous ne présumez rien. Vous croyez seulement cela. Oui. Ne présumez pas cela."], ["p", "253 Ne présumez pas : «Je cours très bien.» Attendez une expérience chrétienne personnelle. Ne prétendez pas que c’est le Saint-Esprit alors que vous vous voyez encore vous-même en train de trainailler dans le monde. Ne le faites pas. Ne le faites pas. Ce serait mieux pour vous d’oublier simplement cela (Voyez ?), d’oublier..."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LE RESPECT", "i": [["ref", "<b>65-0822<\/b><b><sup>E<\/sup><\/b><b> Le Filtre d’un homme qui réfléchit<\/b>"], ["p", "  73 Oh ! quelle grâce de la part de Dieu de nous donner la compréhension des mystères si grands ! Comme Paul le dit ici plus loin, dans Ephésiens, lorsqu’il parle du mari et de la femme, il dit : «C’est un mystère», montrant que les femmes doivent respecter leur mari. Je crois que c’est la deuxième place dans toute la Bible où il soit parlé du respect, disant que les femmes doivent respecter leur mari, respecter leur mari. De même, un mari devrait avoir devant sa femme une vie telle que celle-ci puisse le respecter comme un fils de Dieu. S’il n’a pas ce genre de vie, alors, bien sûr, elle ne pourra pas le respecter, sachant de quoi il est fait. Mais, quand c’est un homme qui est respectueux et pur envers sa femme et devant sa famille – un véritable serviteur de Dieu – alors la femme, les enfants et tous devraient respecter ce serviteur de Dieu, avec révérence."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-1015E Le respect<\/b>"], ["p", "52 Que serait le Président Kennedy, ce soir, s’il n’était pas le Président Kennedy? Qu’arriverait-il s’il était le même homme que maintenant, mais qu’il soit un ouvrier, ici, chez Colgate pour quarante dollars par semaine? Voyez-vous? Il traverserait cette ville et personne ne ferait vraiment attention à lui, sauf ses propres collègues. Mais, étant donné qu’il est le Président des Etats-Unis, il mérite le respect. Voyez-vous?"], ["p", "53 Et, parce que Dieu est Dieu, Il mérite le respect. C’est vrai. Et Il... Nous devons Le respecter et avoir de la crainte pour Lui, et cela produit le respect. Dieu a exigé cela pour Lui-même et pour tous Ses serviteurs. Dieu exige le respect envers Ses serviteurs. Il... Ses serviteurs... Comment savons-nous qu’ils sont Ses serviteurs? Parce qu’Il confirme Ses serviteurs par Sa Parole. Il prend Ses serviteurs et en fait des serviteurs de Dieu, et Il prouve qu’ils sont des serviteurs en faisant accomplir Sa Parole au travers d’eux. Et, lorsque vous respectez ce serviteur, alors vous respectez Dieu. Ainsi, lorsque je vous respecte et que vous me respectez et que nous nous respectons les uns les autres, alors nous respectons Dieu."], ["p", "165 Si vous ne pouvez pas respecter l’homme, respectez la fonction qu’il remplit pour Dieu. C’est parfaitement juste, voyez-vous ; respectez-le. Si un prédicateur vient… votre pasteur, respectez-le toujours. J’ai entendu des assemblées parler de leur pasteur, comment… parlant de lui en le dénigrant et en le ridiculisant. Comment ce pasteur pourra-t-il faire quelque chose pour vous ? Il ne le peut pas. Vous… vous ne… vous ne… Je ne parle pas de cette église-ci, mais je parle des églises que j’ai visitées. Que si vous… Vous devez aimer votre pasteur. Vous devez savoir qu’il est un être humain, mais pourtant, Dieu en a fait Son pasteur. Le Saint-Esprit en a fait un surveillant, vous devez alors le respecter en tant que tel. Peu importe ce que le pasteur a fait, si vous le respectez dans votre cœur, comme serviteur de Dieu, Dieu vous honorera pour l’avoir fait."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "SI LE PASTEUR EST SATISFAIT ALORS DIEU EST SATISFAIT", "i": [["ref", "<b>65-0815 Et tu ne le sais pas VGR.    <\/b>"], ["p", "19 Quand un pasteur est satisfait, et que les gens sont satisfaits, ça fait vraiment une bonne assemblée, et alors Dieu est satisfait. Et je pense que de les voir tous satisfaits, surtout dans ce jour-ci, avec le Message que nous portons, je pense que ça montre l’unité du Message avec les gens, et avec Dieu. Voyez?"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "OBÉISSANCE À LA PAROLE", "i": []}, {"t": "DÎME ET OFFRANDE", "i": [["p", "<b>LA FOI <\/b>"]]}, {"t": "Pourquoi Dieu donne la foi ?", "i": [["ref", "<b>63-0724 - Dieu n'appelle pas l'homme en jugement sans l'avoir d'abord averti<br>AVERTISSEMENT PUIS JUGEMENT<\/b>"], ["p", "44 Vous ne pouvez pas simplement aller là… C’est là que bon nombre d’entre nous commettent beaucoup d’erreurs, le fait d’aller là et dire : “Bon, je vais vous montrer que j’ai la foi pour faire ceci.” Là, vous avez tort pour commencer. Dieu ne vous confie pas des dons juste pour que vous vous en serviez comme d’un jouet."], ["rev", "        Rév. William Marrion Branham"], ["ref", "<b>59-0815 Pareil À L’Aigle Qui Éveille Sa Couvée<\/b>"], ["p", "30b ) Et un vrai pasteur du Dieu vivant ne se tiendra jamais tranquille à la chaire sans prêcher la Vérité de Dieu sans mélange. Et s’il doit faire fuir tous les poulets, il se tiendra sur la Parole sans mélange, pas sur le rocher de Gibraltar, mais sur le Rocher des âges. Il y a alors la foi. La foi ne peut pas reposer sur le sable mouvant de la théologie humaine. Mais la foi trouve son appui éternel sur l’immuable et inébranlable Rocher des âges, elle peut se tenir là pendant que les vagues frappent en bas. La tombe est ouverte, et elle voit de l’autre côté de la mer Celui qui a dit: «Je suis la Résurrection et la Vie», dit Dieu. Tenez-vous là. Remarquez, le poulet est différent. Ses habitudes sont différentes. Son régime alimentaire est différent."]]}, {"t": "APPEL ET MINISTÈRE", "i": [["bib", "Esaie 6 :1-"], ["bib", "Romain 10 :9-15"], ["ref", "<b>53-0216 Mon Ange Marchera Devant Toi<\/b>"], ["p", "11 La première fois que Cela est arrivé, je n'étais bien sûr qu'un petit bébé. Je n'étais âgé que de trois minutes environ, quand Cela est entré. Mais tout au long de ma vie, chaque fois, avant même que je ne sois converti... Les dons et les appels sont sans repentir. Vous le savez. C'est là que je pense que la plupart des... Et, voyez-vous, je suis nouveau dans l'Eglise pentecôtiste. Je viens de l'Eglise baptiste. Et, à l'époque, les baptistes n'ont pas vu qu'il y avait un don divin. Les pentecôtistes ont cru cela. C'est donc là que Dieu m'a envoyé. C'est là que je me sens comme chez moi. Je suis l'un de vous (Voyez?), parce que j'ai reçu le Saint-Esprit, et puis Dieu a rendu la chose manifeste pour moi; c'était pour moi le départ. Mais pour ce qui est de la - la chose elle-même, c'est depuis mon enfance. Les dons et les appels sont sans repentir. Croyez-vous cela? Si vous croyez les Ecritures..."], ["p", "Jésus-Christ était pré-ordonné  comme le Fils de Dieu. Il était la Semence de la femme, laquelle Semence devait écraser la tête du serpent dans le jardin d'Eden. Croyez-vous cela? Moïse ne pouvait pas s'empêcher d'être Moïse. Il était né un enfant particulier. Les gens ont remarqué qu'il l'était et ils en étaient convaincus. Et Dieu l'a suscité carrément sous le nez de Pharaon, n'est-ce pas? Est-ce juste? Il n'y pouvait rien. Jean-Baptiste, sept cent douze ans avant sa naissance, était la voix de celui qui crie dans le désert. Est-ce juste?"], ["p", "12 Jérémie, le prophète, Dieu lui a dit: \"Avant même que tu ne fusses formé dans le sein de ta mère, je te connaissais, et je t'avais consacré, et je t'avais établi prophète des nations. \" Est-ce juste? Avant même qu'il ne sorte du sein de sa mère... Voyez, les dons et les appels sont sans repentir. Voyez? C'est Dieu qui les donne. Vous ne pouvez rien au fait que vous avez des yeux bleus.  De vous tous, \"qui, par ses inquiétudes, peut ajouter une coudée à la durée de sa vie? \" Par conséquent, la chose est entrée dans le monde aujourd'hui avec un tas d'\"ismes\", vous voyez, et absolument cela n'est que l'oeuvre de Satan pour essayer d'éloigner les gens de la vérité de Dieu. Et c'est ce que vous, les pentecôtistes et tous les autres, les baptistes et consorts avez eu tout au long de l'âge, c'est à dire quelqu'un qui essaye d'imiter quelque chose dont il ne sait rien. Il vaut mieux se tenir tranquille. \"Qui, par ses inquiétudes, peut ajouter une coudée à la durée de sa vie? \" Si Dieu veut que vous soyez une certaine chose, Il vous amènera sur cette terre pour être cela, et c'est ce que vous serez. Voyez?"], ["p", "S'Il vous a appelé à être un... à faire une chose... c'est comme un homme qui disait: \" Eh bien, je crois que je gagnerai plus d'argent en me faisant prédicateur. \" Vous ne serez jamais un prédicateur. Dieu doit vous appeler à être prédicateur. Comment un prédicateur peut-il prêcher sans que le Seigneur ne l'ait envoyé? Est-ce juste? Tout est en Dieu. Tout retourne droit en Dieu. Est-ce juste? Tout retourne droit à Lui, c'est Lui qui fixe le programme. Nous nous y conformons tout simplement (Vous voyez?), et nous exécutons cela."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0127 Un Absolu<\/b>"], ["p", "24 Je pense que tout chrétien devrait être ainsi, tout croyant. Vous ne devriez jamais… Je pense particulièrement que les ministres ne devraient jamais oser monter en chaire avant d’avoir rencontré Dieu sur ce sable sacré, où aucun philosophe ne peut trouver une explication convaincante de la chose. Vous avez rencontré Dieu, et vous le savez, et rien ne peut vous cacher cela."], ["p", "Eh bien, des fois nous avons une grande érudition, et je n’ai rien contre cela. C’est en ordre. Mais… Tout ça, c’est bien. Mais vous devez personnellement rencontrer Dieu, en arriver à ce point où personne ne peut tordre une quelconque Ecriture. Vous avez été là. Vous – vous êtes quelqu’un qui L’a rencontré. Vous en avez fait l’expérience. Vous Le connaissez. Voyez-vous ?"], ["p", "Je pense que particulièrement chaque ministre, chaque croyant devrait–devrait prendre cette place, cette position : rencontrer d’abord Christ personnellement. Et cela vous fait faire des choses, comme je l’ai dit, que normalement vous ne feriez pas. Cela vous fait dire des choses que normalement vous ne diriez pas. Cependant, c’est quelque chose sur lequel–sur lequel vous êtes centré ou auquel vous êtes attaché. C’est quelque chose dont vous êtes sûr, comme Paul, à savoir que vous–vous avez rencontré quelque chose de différent, que vous n’aviez jamais vu dans votre vie."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>56-0225 Jésus-Christ Est Le Même Hier, Aujourd’hui Et Eternellement<\/b>"], ["p", "16 Mais Dieu, pour le perfectionnement de l’Eglise, a placé dans l’église des apôtres. Vous direz: «Apôtres?» Oui, oui. Eh bien, comment les gens ont-ils donc changé leur nom et s’appeler missionnaires plutôt qu’apôtres? Je ne sais pas. Un missionnaire et un apôtre, c’est exactement la même chose, le même mot: Un envoyé, c’est vrai. Un missionnaire est un apôtre."], ["p", "Ainsi, ils... un apôtre est un missionnaire. C’est un envoyé. Et quand un homme se sent conduit par Dieu, il est envoyé de Dieu pour aller en Afrique, en Inde, cela fait de lui un apôtre et... ou un missionnaire, n’importe comment vous voulez appeler cela."], ["p", "<b><i>Il y a donc des apôtres, des prophètes, des docteurs, des évangélistes et autres. Ils sont choisis par Dieu seul. Peu importe combien vous fréquentez l’école, quelle bonne instruction vous avez acquise, quelle bonne... ce que vous aimeriez prêcher, si Dieu ne vous a pas appelé à être un prédicateur, vous ne réussirez jamais. C’est vrai. Vous serez juste une pierre d’achoppement sur le chemin d’un vrai prédicateur. C’est exact. «Les dons et les appels sont sans repentir.» Correct.<\/i><\/b>"], ["p", "Je préférerais que mon jeune garçon devienne un prédicateur plutôt que n’importe quoi que je connaisse, mais c’est Dieu qui aura à le faire. Je... Personne d’autre ne peut le faire. C’est vrai, c’est Dieu qui aura à le faire."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-1117 Encore une fois<\/b>"], ["p", "24 Eh bien, vous pouvez vous représenter la responsabilité qu’il y a de parler à un–un groupe qui s’accroche à chaque parole que vous dites. Et puis, vous aurez à répondre au Jour du Jugement pour ce que vous leur aviez dit. En effet, par cet humble petit ministère, les gens reçoivent la foi en voyant qu’un être humain ne peut pas faire ces choses. Cela doit venir de Dieu. Par conséquent, ils s’accrochent à chaque parole que vous dites. Ainsi, je ne cherche jamais à élaborer quelque chose, penser ou écrire des passages des Ecritures, et–et des notes, me disant que ce serait quelque chose qui réjouirait beaucoup les gens. Voyez, je–j’essaie de prier et de penser à quelque chose qui pourrait vous édifier, qui vous aiderait."], ["rev", "Rev. William Marrion Branham"], ["bib", "Ephesien 4 :7-16"], ["bib", "2PIERRE 1 : 8-10"], ["v", "<b>Questions et réponses  12/01/1961<\/b>"], ["p", "26 Maintenant, j’ai environ quatre questions ici, qui sont sur, qui se trouvent sur un—qui se trouvent sur un bout de papier, et je les ai numérotées : un, deux, trois, quatre, cinq, six…huit, dix, et ainsi de suite, comme ça. Et dès que j’aurai terminé celles-là, alors je passerai tout de suite à celles qui sont là. Ça dit :"], ["p", "107. Frère Branham, si ces questions ne conviennent pas ici, alors n’en tenez aucun compte, et cela ne m’ennuiera pas, car je saurai que ce n’était pas la main du Seigneur. Question numéro un : Frère Branham, je vous ai entendu…que cela devrait—devrait reprendre le… Je—je—je vous ai entendu dire que je devrais reprendre le ministère, et j’ai moi-même songé à le faire, mais j’attendais d’avoir reçu de Sa part une parole claire à cet effet. Jusqu’à présent, elle n’est pas venue. Or, sachant que la fin est tellement proche, devrais-je encore attendre que le Seigneur Jésus me parle ? Ou trouverait-Il bon de vous indiquer quoi me dire, puisque je sais que vous êtes Son porte-parole pour aujourd’hui ?"], ["p", "27 Bon, eh bien, frère, je… J’ai noté ici ma réponse à ça. Dieu qui appelle ce frère, par un appel dans sa vie, maintenant voilà un point très important, nous pourrions vraiment prendre ça comme sujet et prêcher là-dessus toute la soirée, vous voyez, sur ce point-là : “une vocation”. “Affermissez votre vocation et votre élection”, vous voyez. On ne veut pas être là à se demander si on a été appelé. Il faut avoir été appelé, sinon vous serez vaincu ; nous livrons un combat. Voyez ? Et si vous êtes absolument certain, frère, que votre vocation, vous la tenez de Dieu, et que vous avez été appelé par Dieu à faire un travail…"], ["p", "28 Or, il y a un vilain tour que l’ennemi peut vous jouer, là. Il peut vous faire croire que vous n’avez pas été appelé, alors que vous avez été appelé, et puis il peut faire l’inverse, vous faire croire que vous n’avez pas été appelé, ou, vous faire croire que vous—vous avez été appelé, alors que vous n’avez pas été appelé ; vice versa, l’un ou l’autre. Alors il faut faire attention."], ["p", "29 Maintenant, voici comment faire. Il faut d’abord découvrir… Bon, là, ce sont des conseils, c’est tout ce que je peux vous donner à ce sujet, des conseils. Voyez ? Mais assurez-vous que vous tenez votre vocation de Dieu, et ensuite examinez vos motifs et vos objectifs. Voyez ? Bon, vous savez ce que j’entends par là. Quel est le motif qui vous incite à prêcher ? Est-ce que c’était seulement… Vous êtes-vous dit que ce serait un travail plus facile que celui que vous avez ? Alors, il vaut mieux laisser tomber, ce n’était pas un appel."], ["p", "30 Un appel de Dieu brûle tellement dans votre cœur, qu’il ne vous donne aucun repos, ni le jour ni la nuit. Vous ne pouvez pas y résister, ça vous hante continuellement."], ["p", "31 Et—et, si vous deviez prêcher… Vous dites, eh bien, là, un autre objectif : “Je crois que, par rapport à mon travail actuel, si je pouvais être un évangéliste réputé ou un pasteur, avoir un bon salaire fixe, avoir une maison où m’installer, et tout, où habiter, alors je—je crois que ce serait bien, que ce serait beaucoup plus facile que ce que je fais actuellement. Et réellement, je pense que ce serait…” Là, vous voyez, votre objectif est faux, au départ. Vous voyez, il n’est pas bon. Voyez ? Vous—vous avez tort, là."], ["p", "32 Et puis, si vous disiez : “Eh bien, peut-être parce que je suis… Je pense que peut-être je jouirais d’une plus grande popularité auprès des gens.” Vous voyez, vous allez constater que vous vous préparez à un grand fiasco. Vraiment, vous voyez !"], ["p", "33 Mais, bon, si votre objectif, c’est : “Même si je dois manger des crackers et boire de l’eau plate, ça m’est égal, je vais quand même prêcher l’Évangile.” C’est quelque chose qui vous obsède, carrément : “Il faut que je prêche l’Évangile, sinon c’est la mort !” Voyez ? Alors là, vous—vous réussirez, parce que c’est Dieu qui traite avec vous. Dieu Se fait connaître à vous, puisque, effectivement, c’est Dieu qui ne vous donne aucun repos. Et, généralement, un homme qui a été appelé de Dieu ne veut jamais faire le travail. Aviez-vous déjà songé à ça ? N’importe quel homme…"], ["p", "39 Donc, si Dieu vous appelle, frère, et que, dans votre cœur, c’est une obsession continuelle, alors je dirais : “Rejetez tout fardeau, et le péché qui vous enveloppe si facilement.” Vous voyez? Si… Mais si ce n’est pas une obsession, alors, à votre place, je—je—je n’y songerais pas trop. Laissez simplement les choses suivre leur cours."], ["p", "1 CORINTHIENS 9 :16"], ["ref", "<b>58-0927 Pourquoi ne sommes-nous pas une dénomination ?<\/b>"], ["p", "4 J’ai rencontré Frère Jeffreys là-bas, et je lui ai dit : “Frère Jeffreys…” Je me suis dit, vous savez, je suis toujours content d’avoir la visite de mes frères, mais quelle soirée pour recevoir la visite d’un frère ! C’est la soirée prévue pour les habitués du Tabernacle, juste avant les réunions de réveil. C’est la soirée… Nous voulons prendre ce soir, demain matin et demain soir pour exprimer ce que nous croyons, ici au Tabernacle, pour—pour passer tous ces points en revue, de nouveau. Nous avons des croyances extrêmement bizarres, très étranges, mais nous les trouvons pourtant dans cette Bible. Elles semblent effectivement s’y trouver."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>59-0814 Quand J’ai Réfléchi À Mes Voies<\/b>"], ["p", "64 Et puis, il y a cinq offices de ministère. Combien croient cela ? Assurément. Il y a premièrement les apôtres, les prophètes, les docteurs, les pasteurs, les évangélistes. Combien savent cela ?"], ["p", "Eh bien, comment pouvez-vous dire qu’il y a un pasteur ou un évangéliste et nier qu’il y a un prophète ? Comment pouvez-vous dire qu’il y a un prophète s’il n’y a pas un apôtre ? Voyez, certains aiment dire : «Oh ! les pasteurs, les évangélistes, les docteurs, il y en a», mais ils ne veulent pas dire qu’il y a des prophètes. Le même Dieu qui a dit : «Docteurs et évangélistes», a dit : «Prophètes.» Il garde Sa Parole. Nous ne La poignardons pas, nous La prêchons simplement. C’est ce que c’est… C’est à Dieu… C’est à Dieu de prendre soin de Sa Parole. Ne croyez-vous pas cela ?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>62-0708 Un Super Signe<\/b>"], ["p", "227 Je vais demander à ces pasteurs, ces hommes pieux, de se tenir ici à mes côtés. Je vais comparaître avec eux à la barre du Jugement. Peut-être qu’ils ne sont pas en mesure d’avoir le discernement ; cela est tout simplement un don, vous savez. Mais ce sont des hommes de Dieu, qui sont tout aussi sauvés que moi, et qui ont été appelés au ministère. Il y a cinq dons de ministère dans le Corps ; premièrement ce sont les apôtres, les prophètes, les docteurs, les pasteurs et les évangélistes. Ils sont… prédestinés par Dieu. «Dieu a établi des dons dans l’Eglise.» Frères, voulez-vous bien vous tenir à mes côtés ?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>59-1120 Un Prophète Comme Moïse<\/b>"], ["p", "40 [Espace vide sur la bande–N.D.E.] … ne sont pas appelés par l’église et ainsi de suite, ils sont choisis par Dieu : des apôtres ; deuxièmement, des prophètes ; troisièmement (Il se peut que je ne les aie pas alignés comme il faut)–troisièmement, je pense que ce sont des docteurs, des évangélistes et des pasteurs. Cinq offices spirituels dans l’Eglise pour la mettre en ordre : des apôtres, des prophètes, des docteurs, des évangélistes, des pasteurs ; ce sont là des offices appelés par Dieu. Et puis, dans l’assemblée locale, il y a neuf dons spirituels qui opèrent parmi les gens."], ["p", "Maintenant, concernant ces offices et ces positions, parmi les offices, vous écoutez l’apôtre, son ministère. Vous écoutez le prophète, son ministère ; les évangélistes, le docteur, le pasteur. Chacun a un ministère distinct. Et leurs ministères viennent de Dieu. Dieu les a établis dans l’Eglise dans ce but."], ["p", "Puis Dieu descend sous la forme du Saint-Esprit au milieu de Son assemblée, parle en langues, et un autre interprète et dit à une certaine personne une chose qu’elle doit faire, et la chose arrive comme telle. Peut-être que ça pourrait arriver à un moment donné où il y a eu un besoin. Et puis, il y a les dons de sagesse, de connaissance, d’interprétations, toutes sortes de dons qui opèrent dans l’Eglise. Mais le premier moyen, c’est la Parole et le tout doit venir premièrement par la Parole."], ["p", "41 Eh bien, si je pouvais guérir cette ligne de gens, ou plutôt ces gens qui sont ici, je le ferais certainement. Mais je ne le peux pas. Et la cause, la raison pour laquelle je ne pourrais pas, c’est parce qu’ils ont déjà été guéris. Ils ont été guéris depuis que Jésus est mort pour leur guérison. Eh bien, la seule chose que nous puissions faire au travers de ces offices, c’est de vous manifester Christ, afin que vous voyiez qu’Il est dans Sa Parole, qu’Il tient Sa promesse. Et puis, par votre propre foi, vous acceptez Jésus comme votre Guérisseur et vous êtes guéri. C’est comme cela que ça marche. Est-ce juste, frère ? Je crois que tout le monde pourrait rendre témoignage à cela. Ces hommes prêchent l’Evangile. Croyez cela, acceptez cela ; c’est tout autant valable que n’importe quel... c’est la meilleure chose. Ou le docteur, le pasteur, l’évangéliste, l’apôtre, le prophète, quoi que cela puisse être, tout cela c’est l’œuvre du Saint-Esprit parmi Son peuple."], ["p", "42 Eh bien, je ne suis pas fameux comme prédicateur. Je n’ai point d’instruction. Je ne pourrais pas prendre leur place. Ce sont des docteurs, des pasteurs et ainsi de suite. Mais le Seigneur m’a donné un don de discernement, un don de prophétie que j’ai pratiquement depuis que j’étais petit garçon et Il m’a envoyé… au lieu que j’aie ma connaissance de la Bible. C’est la raison pour laquelle je ne prêche pas de doctrine parmi vous. Il se peut que je ne connaisse pas assez cela. Je sais que je suis sauvé. Je peux vous dire comment j’ai été sauvé. Et puis, demandez à votre pasteur le reste. Et je sais qu’Il guérit, je sais qu’Il remplit du Saint-Esprit. J’ai été témoin de toutes ces choses. Et c’est la chose dont je peux vous dire de façon véridique que c’est la vérité. Et vous, recevez juste cela, ensuite votre pasteur vous prendra à partir de là."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU SEUL SAUVE", "i": [["bib", "Jonas 2 :9-10"], ["bib", "Esaie 45 :21"], ["ref", "<b>51-0923 Les principes de la guérison divine<\/b>"], ["p", "38 Remarquez, juste quelques instants maintenant et nous allons commencer la ligne de prière. <b><i>Maintenant, tout ce qu’un prédicateur peut faire, c’est vous prêcher le salut par la croix. Il ne peut pas vous sauver. Il n’y a aucun prédicateur qui vous dit qu’il peut vous sauver. Il vous demande d’accepter ce que Jésus a déjà accompli. Est-ce vrai? Combien parmi vous sont pasteurs et font cela? Levez la main. Assurément, vous acceptez Christ. Maintenant, il peut prêcher, mais il ne peut pas sauver; mais il vous indique le Calvaire. Vous acceptez cela, puis quand vous vous avancez, vous dites: «Maintenant, j’accepte Jésus comme mon Sauveur personnel», vous croyez dans votre coeur que vous êtes sauvé.<\/i><\/b>"], ["p", "Or, les critiqueurs à l’extérieur diront: «Oh! John, il n’y a aucun changement en toi. Eh bien, tu as toujours le même aspect que tu...» Mais vous pouvez avoir le même aspect; vous pouvez ne rien sentir de différent; mais dans votre coeur, vous croyez que vous êtes différent. Voyez? Ensuite, vous confessez que vous êtes différent. «Quiconque Me confessera devant les hommes, Je le confesserai devant le Père et les saints anges.»"], ["p", "39 Maintenant, si vous croyez que vous êtes mieux, qu’ensuite vous dites que vous êtes mieux, agissez comme étant mieux. Vous voyez? Vous dites: «Oui, monsieur, je suis–je suis sauvé.» Vous vous associez à ceux qui sont sauvés. Vous croyez que vous êtes sauvé. Vous agissez comme étant sauvé, et cela produit la justice. Est-ce vrai? C’est vrai, car Il a été blessé pour vos péchés, Il est assis à la droite du Père confirmant tout ce que vous confessez."], ["p", "Eh bien, et si vous avanciez à l’autel et que vous disiez: «Eh bien, je ne sais pas», mais que, dans votre coeur, vous croyiez que vous êtes sauvé, et vous ne dites rien à ce sujet? Vous ne serez jamais sauvé avant de le croire, de l’accepter et de le confesser."], ["rev", "Rev. William Marrion Branham"], ["bib", "Romain 10 :14"]]}, {"t": "QU’EST-CE QUE LE MINISTÈRE", "i": [["p", "PARLE A CE ROCHER 12JUIN1960 "], ["p", "59 Je ne suis pas le Rocher ; je ne suis que Son canal. Voyez-vous ? Nos ministères ne sont que des canaux par lesquels le… C’est un tuyau où coule l’eau. Ne glorifiez pas le tuyau ; glorifiez l’eau que vous puisez au tuyau, car l’eau vient de la fontaine. Glorifiez l’eau. Souvenez-vous-en donc, moi, je ne pourrais pas guérir. Le tuyau ne vous donne pas à boire ; le tuyau par lequel ça passe ne donne pas à boire ; il ne fait qu’amener l’eau. Buvez à ce Rocher, ce Rocher frappé, qui a déjà été frappé."], ["p", "Moïse a frappé ce rocher avec la verge du jugement de Dieu, et les jugements de Dieu ont frappé le Rocher, Jésus-Christ."]]}, {"t": "QU’EST-CE QUE LE RÉVEIL", "i": [["p", "PARLE A CETTE MONTAGNE  23NOV 1959"], ["p", "5 Maintenant, nous essayons de placer les réunions de réveil dans le meilleur cadre possible. Nous ne nous spécialisons pas dans la guérison divine, comme on dit, parce que la guérison divine n’est pas le plus important. Et vous ne pouvez pas mettre en avant le moins important, nous savons cela. La grande chose donc que nous recherchons dans tout réveil, c’est premièrement d’amener les âmes perdues à Christ, et de réveiller l’église, la ramenant à un état spirituel, là où elle devrait être, en communion intime avec Dieu. Troisièmement, de susciter la communion entre les églises ; et quatrièmement, de prier pour les malades. C’est – c’est notre but, c’est ce que nous essayons de faire."], ["p", "6 Ce sont les pécheurs d’abord, la communion et – entre les églises, et une marche intime entre l’église et Dieu, et ensuite la prière pour les malades."], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "PRENEZ GARDE", "i": [["p", "<b>1 Corinthiens 10 :12 (« Que celui qui croit être debout prenne garde de tomber ») et Deutéronome 4 :9 (« Prends garde à toi et veille attentivement sur ton âme »)<\/b>"], ["bib", "<b>Proverbes 4 :23 (BFC) : « Avant tout, prends garde à ce que tu penses au fond de toi-même, car ta vie en dépend ».<\/b>"], ["v", "<b>1 Corinthiens 10 :12 (LSG) : « Ainsi donc, que celui qui croit être debout prenne garde de tomber ! ».<\/b>"], ["bib", "<b>Galates 6 :1 (LSG) : « […] Prends garde à toi-même, de peur que tu ne sois aussi tenté ».<\/b>"], ["v", "Veiller sur son comportement :"], ["bib", "<b>Luc 21:34<\/b> (LSG) : « Prenez garde à vous-mêmes, de crainte que vos cœurs ne s'appesantissent par les excès... »."], ["bib", "<b>Luc 8:18<\/b> (LSG) : « Prenez donc garde à la manière dont vous écoutez... ». "]]}, {"t": "DÉLIVRANCE APRÈS LE SERVICE", "i": [["p", "Laissez partir les enfants d’Israël pour me servir tu ́e peut pas servir Dieu sans pour autant délivrer "], ["p", "Sans la délivrance  il n’ya pas des marche"]]}, {"t": "DIEU PERMET QUE TOUT ARRIVE (LES ÉPREUVES)", "i": [["ref", "<b>59-1108 Possédant les portes de l'ennemi<\/b>"], ["p", "32 Quelques années plus tard, quand vinrent les épreuves, et que l’église fut tout ébranlée, comme il est si facile pour une congrégation de gens de l’être, lorsque quelque chose ne semble simplement pas se passer comme ça devrait… C’est Dieu qui fait en sorte qu’il en soit ainsi. Dieu amène des tensions dans l’église : “Car chaque fils qui vient à Dieu doit être mis à l’épreuve, et éprouvé, et testé.” Il laisse la maladie vous frapper. Il laisse des maux venir sur vous, pour vous tester et pour vous éprouver, afin de montrer au monde que vous êtes vraiment la semence d’Abraham. Il le permet par Sa propre volonté. Il permet des désastres, Il permet que vos amis se retournent contre vous. Il permet toutes ces choses et lâche le diable après vous pour vous tenter, et celui-ci fera tout sauf vous enlever la vie. Il pourrait vous jeter sur un lit d’affliction, il pourrait faire que vos voisins se retournent contre vous, que l’église se retourne contre vous, il peut faire à peu près n’importe quoi. Et c’est la volonté de Dieu qu’il le fasse. Il nous est enseigné que cela est plus précieux que l’or pour nous."], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "La colonne de feu", "i": [["ref", "<b>62-0311 La plus grande bataille jamais livrée<\/b>"], ["p", "166 L’Ange du Seigneur, même que Sa photo est accrochée ici sur le mur, alors, partout, la science ne sait plus quoi répondre. Qu’est-ce qu’Il fait? Il s’en tient strictement à la Parole. Amen! Elle tranche tous les démons. [Frère Branham tape deux fois dans ses mains. — N.D.É.] Oui, effectivement. Qu’est-ce que C’est? “Les esprits qui exercent un ministère, envoyés de la Présence de Dieu”, pour oindre ceux qui prêchent la Parole, qui s’en tiennent à la Parole. Et Il confirme la Parole, par les signes qui L’accompagnent, produisant Jésus, le même hier, aujourd’hui et éternellement. Le voilà<b>.<\/b>"], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "SERVIR DIEU AVEC SON ARGENT", "i": [["ref", "<b>60-0717 N’Ayez Pas Peur<\/b>"], ["p", "<b>63 <\/b>Et il est arrivé que Satan ait regardé du sommet d’une certaine cheminée. Et il a regardé. Et il a remarqué que les disciples étaient partis sans Jésus. Il a dit: «Voici l’occasion ou jamais.»"], ["p", "Frère, tout cela est comparable à ce jour. L’Eglise essaie de partir sans Jésus. Nous avons eu un temps de prospérité lorsque les hommes ont eu de gros salaires, des syndicats, et ainsi de suite comme cela, gagnant beaucoup d’argent; les pauvres ont obtenu cela. C’est entré au milieu des pentecôtistes, au point où il y a des millionnaires et tout chez les pentecôtistes; ce qui est une bonne chose. Nous... C’est pour... Ce n’est pas seulement pour les pauvres; c’est aussi pour les riches. Dieu est pour tout le monde, les riches ou les pauvres, tout le monde. Il y aura autant de gagne-petit en enfer que des millionnaires."], ["p", "Il s’agit de votre attitude envers ce que Dieu vous donne. Etes-vous disposé à utiliser votre argent pour le Royaume de Dieu? Si oui, Dieu vous bénira, que ça soit un centime, que ça soit... Comme ce que la petite fille m’a donné hier soir, ou–ou ce que donnerait un grand multimillionnaire valant plusieurs millions de dollars... C’est la même chose pour Dieu. Eh bien..."], ["p", "64 Nous avons eu un temps de prospérité. Nous avons eu de grands bâtiments, nous avons construit de grandes églises avec de beaux sièges, nous avons construit de grandes écoles et ainsi de suite, au point où j’ai peur que nous soyons partis sans Jésus. Le diable voit cela, et il les a vus sans Jésus."], ["rev", "<b>Rev. William Marrion Branham<\/b>"], ["ref", "<b>63-0324M Questions et réponses sur les Sceaux<\/b>"], ["p", "<b>84 <\/b>Si vous bâtissez une maison, allez, construisez-la. Si Jésus vient demain, vous serez trouvé fidèle, à votre poste. Si vous bâtissez une église, allez-y, construisez-la. J’aimerais mieux placer mon argent dans quelque chose comme ça, plutôt que d’être trouvé avec l’argent dans ma poche. Voyez?"], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "PARTIR SANS JÉSUS", "i": [["p", "63 Et il est arrivé que Satan ait regardé du sommet d’une certaine cheminée. Et il a regardé. Et il a remarqué que les disciples étaient partis sans Jésus. Il a dit: «Voici l’occasion ou jamais.»"], ["p", "Frère, tout cela est comparable à ce jour. L’Eglise essaie de partir sans Jésus. Nous avons eu un temps de prospérité lorsque les hommes ont eu de gros salaires, des syndicats, et ainsi de suite comme cela, gagnant beaucoup d’argent; les pauvres ont obtenu cela. C’est entré au milieu des pentecôtistes, au point où il y a des millionnaires et tout chez les pentecôtistes; ce qui est une bonne chose. Nous... C’est pour... Ce n’est pas seulement pour les pauvres; c’est aussi pour les riches. Dieu est pour tout le monde, les riches ou les pauvres, tout le monde. Il y aura autant de gagne-petit en enfer que des millionnaires."], ["p", "Il s’agit de votre attitude envers ce que Dieu vous donne. Etes-vous disposé à utiliser votre argent pour le Royaume de Dieu? Si oui, Dieu vous bénira, que ça soit un centime, que ça soit... Comme ce que la petite fille m’a donné hier soir, ou–ou ce que donnerait un grand multimillionnaire valant plusieurs millions de dollars... C’est la même chose pour Dieu. Eh bien..."], ["p", "64 Nous avons eu un temps de prospérité. Nous avons eu de grands bâtiments, nous avons construit de grandes églises avec de beaux sièges, nous avons construit de grandes écoles et ainsi de suite, au point où j’ai peur que nous soyons partis sans Jésus. Le diable voit cela, et il les a vus sans Jésus."], ["ref", "60-0717 N’Ayez Pas Peur"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "JE SUIS UN HÉRITIER", "i": [["ref", "<b>62-0506 Nous possédons toutes choses<\/b>"], ["p", "95 Je suis héritier de la guérison Divine. Je suis héritier de la joie, j’ai le droit d’être heureux. “Alors qu’est-ce qui vous rend si heureux ?” J’ai le droit de l’être. “Comment le savez-vous ?” Parce que j’en suis héritier. Amen ! Wouhh ! Maintenant, je me sens religieux. Oui. Je suis héritier du bonheur. Je suis héritier de la joie. Je suis héritier de la paix. Je suis héritier de la Vie Éternelle. Je suis héritier du Saint-Esprit. Amen. Je suis héritier de toutes les preuves qui L’accompagnent. Amen. Je suis héritier de l’autorité de Dieu. Amen. “Qui vous a fait héritier ?” Pas moi ; c’est Lui. Chacun de vous est héritier de la même chose."], ["p", "96 Héritier d’un trône ! “Celui qui vaincra s’assiéra avec Moi sur Mon Trône, comme Moi J’ai vaincu et Me suis assis sur le Trône de Mon Père.” Amen, héritier de toutes choses ! Pas seulement d’une chose, mais de toutes choses ! Tout est sous vos pieds. Même la mort est sous vos pieds, la tombe est sous vos pieds, l’enfer est sous vos pieds, le péché est sous vos pieds, tout est sous vos pieds. Vous êtes un héritier ! Et vous êtes… Vous êtes mort, et votre vie est cachée en Dieu par Jésus-Christ, et vous êtes ressuscité, vous avez la Vie Éternelle, et vous êtes assis dans les lieux Célestes en Jésus-Christ. Oh ! la la ! Fiou ! Traitez-nous de tous les noms, traitez-nous de ce que vous voudrez, dites que nous sommes fous si vous voulez, mais nous sommes héritiers. Héritiers de quoi ? De toutes choses."], ["p", "97 “Êtes-vous héritier du Branham Tabernacle ?” Non, je suis héritier de toutes choses. De tout ce que l’on voit, du présent, du futur, de tout, j’en suis héritier."], ["p", "98 Et chaque péché et la méchanceté ont été mis sous mes pieds, par la grâce de Jésus-Christ. Il est ressuscité le matin de Pâques, a triomphé sur la mort, l’enfer et la tombe, et a fait de moi un héritier, et a dit : “Attendez là-bas et Je vais vous donner la promesse.” Et Son serviteur oint qui fait autorité a dit : “La promesse est pour vous et pour vos enfants, à tous ceux qui sont au loin, en aussi grand nombre que le Seigneur notre Dieu les appellera.” Je suis héritier. Amen. Amen. Jésus nous l’a prouvé, lors de Sa résurrection. Oh ! la la !"], ["p", "99 Quand nous sommes entrés dans ce champ de bataille entre la mort et la Vie ! “Je suis un pécheur, Frère Branham.” Vous n’avez pas à l’être. Vous êtes un pécheur parce que vous désirez l’être. Vous n’avez pas à l’être. La dette est déjà payée."], ["p", "100 “Frère Branham, j’aimerais avoir la joie.” Vous pouvez l’avoir. C’est parce que vous laissez Satan vous voler les privilèges pour lesquels Christ est mort. J’en suis héritier. Tout cela m’appartient. Tout ce pour quoi Il est mort m’appartient, vous appartient. Nous sommes Ses enfants, nous en sommes héritiers, tout ce pour quoi Il est mort."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "VOUS ÊTES UNE PARTIE DE LA PAROLE", "i": [["p", "217 Ça doit venir de l’intérieur, qui est la Parole depuis le commencement. “Au commencement de la création de Dieu”, quand Dieu a commencé à créer, à vous amener à l’existence, vous voyez. Là-bas, vous avez commencé en tant que semence, et vous en êtes arrivés là où vous êtes maintenant. Et alors, vous étiez tous en Christ. Et puis, quand Christ est mort, Il est mort pour vous racheter tous. Et vous êtes une partie de cette Parole-là! Alors comment… La Bible, tout entière! “Précepte sur précepte, règle sur règle, un peu ici, un peu là.” “Il ne disparaîtra pas un seul iota ou un seul trait de lettre.” Comment donc pourriez-vous, vous qui êtes une partie de cette Parole, ne pas être d’accord avec le reste de la Parole, ou avec une portion quelconque de la Parole?"], ["ref", "65-0815 Et tu ne le sais pas"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "POURQUOI VENIR À L’ÉGLISE", "i": [["ref", "<b>61-1119 La force parfaite par la faiblesse parfaite<\/b>"], ["p", "<b>43 Il y a des petites choses que nous faisons. Et c’est pour ça que nous venons à l’église, c’est pour découvrir nos erreurs, et voir comment nous améliorer. Si nous venons à l’église avec n’importe quel autre—n’importe quel autre objectif que celui-ci, je crains que nous ne retirions pas grand-chose d’être venus à l’église. Nous devons venir pour découvrir nos faiblesses, pour trouver nos mauvais penchants et nos…combien…voir combien nous sommes petits, et mettre notre confiance en Quelqu’un qui est fort. Mais, quand nous avons des faiblesses…<\/b>"], ["rev", "<b>Rev. William Marrion Branham<\/b>"], ["ref", "<b>57-0417 La Seconde venue du seigneur<\/b>"], ["p", "<b>54 Il est plus tard que nous ne le pensons. Nous ne venons pas à l’église pour occuper un banc ; nous ne venons pas à l’église pour entendre un bon sermon, ni pour entendre une bonne musique. Toutes ces choses ont leur place, mais ce que nous ferions de mieux en venant à l’ église, c’est de nous examiner vis-à-vis de Dieu, concernant le salut de nos âmes, car le jour de la rédemption est proche.<\/b>"], ["rev", "<b>Rev. William Marrion Branham<\/b>"], ["ref", "<b>56-0805 L'Église et sa condition<\/b>"], ["p", "21 Ce matin, je désire vous parler en paraboles, de telle façon que même la personne la plus irréligieuse qui se trouverait ici soit capable de comprendre. Nous venons à l’église pour nous améliorer. Nous venons pour faire de nous-mêmes de meilleures personnes, de meilleurs Chrétiens, de meilleurs citoyens, de meilleurs pères, de meilleures mères, de meilleurs voisins. Nous venons parce que Christ nous a dit que, si nous venions et demandions quoi que ce soit en Son Nom, là où nous sommes assemblés à deux ou trois, Il serait avec nous et nous l’accorderait. Ainsi, qu’y aurait-il de plus ou de mieux pour nous aujourd’hui, que de savoir que nous sommes venus à l’église pour devenir meilleurs, pour élargir notre entendement. Et combien pourraient dire : “C’est la raison pour laquelle je suis ici”? Voyons un peu! “Je désire une meilleure compréhension.” Et nous ne pouvons pas… nous ne pouvons pas avoir une meilleure compréhension à moins que cela… Et si nous désirons comprendre Dieu, cela doit sortir de la Parole de Dieu, parce que la Parole est ce que Dieu nous a donné pour nourrir nos âmes affamées. Et le Saint-Esprit a été envoyé pour prendre la Parole de Dieu, et pour nous nourrir par la Parole. Voyez-vous?… Le Saint-Esprit est envoyé de Dieu pour prendre la Parole de Dieu et nous La donner selon notre besoin. Eh bien, je suis si heureux que Dieu ait pourvu de cette façon, pas vous? Qu’Il nous nourrirait."], ["ref", "<b>54-0509 L’invasion des États-Unis<\/b>"], ["p", "124 Comment pouvez-vous vous taire, si vous êtes un homme de Dieu ou une femme de Dieu, pendant que vous êtes conscient et que vous voyez le péché et tout s’accumuler et peser lourd, et tout comme cela, et que vous voyez des âmes aller en enfer par millions chaque jour, comment allez-vous rester silencieux? Vous ne pouvez pas."], ["p", "Quelqu’un m’a dit, l’autre jour: «Vous pensez que vous pouvez arrêter cela?»"], ["p", "125 J’ai dit: «Non. Je ne peux pas arrêter cela, parce que Dieu l’a dit. Mais un jour, au Tribunal du Jugement, on va sortir le grand écran, mettre la caméra en marche là-bas, et on va faire jouer cette bande. Et je vais me tenir là à écouter cela; et je veux entendre ma voix mettre les gens en garde contre ces choses. Dieu me jugera, quand ma voix s’élèvera contre cela.» Certainement. Quand nous verrons cette vie, cette génération, repasser là-bas au jugement... Certainement. Nous vivons dans un temps terrible. Et voilà. Et nous le voyons; il dit: «N’y en a-t-il pas un autre?»"], ["p", "126 Il a dit: «Oui, mais je le hais, car il prophétise toujours du mal contre moi.»"], ["p", "127 Comment peut-il s’empêcher de prêcher ces choses dures, quand il voit ce qui se passe, voir Achab mener la vie qu’il menait et faire les choses qu’il faisait, et entraîner les gens dans la condition où ils se trouvaient?"], ["p", "128 Comment un homme de Dieu, ou une femme de Dieu, peuvent-ils s’empêcher de crier très fort et réprimander le péché de tous côtés, quand ils voient ces prédicateurs tièdes, ceux qui présentent la chose sous des couleurs séduisantes, et ces éducateurs, et tous les autres comme cela, qui laissent les gens aller en enfer par millions, étant sous la séduction? Beaucoup de... Même parmi les gens de la sainteté... Je ne parle pas beaucoup des méthodistes et des baptistes, et tout du genre; chez eux aussi, c’est comme ça. Mais cela reste juste parmi eux."], ["p", "129 Oh! la la! ils montent sur l’estrade, ils ressemblent à tout sauf à des chrétiens, ils vivent comme tout le reste dans tous les pays et tout, et puis ils appellent ça de la «religion». C’est une religion, mais c’est bien loin du salut de l’Eternel. C’est juste. Ils amènent les gens au point où c’est juste un grand groupe d’excités. Ensuite, dès que la petite excitation est passée, alors peu après, on n’en trouve plus un seul; l’église est vide. Mais quand un homme aime Dieu, il occupera chaque fois sa place à l’église. Il ne peut pas rester loin de l’église. C’est juste."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>60-0304 Avoir soif de la vie VGR<\/b>"], ["p", "145 Et pour vous, hommes et femmes âgés, lorsque vous vous séparez des croyants… Les gens disent : «Je peux rester à la maison, y être tout autant un bon chrétien qu’à l’église.» Vous ne pouvez pas."], ["p", "La Bible dit : «N’abandonnons pas notre assemblée, d’autant plus que nous voyons le temps s’approcher.»"], ["p", "Si vous êtes un chrétien, vous désirez ardemment aller là où se trouvent les autres chrétiens pour communier avec eux. Ainsi vous ne pouvez pas rester loin de l’église et vivre la même vie."], ["p", "146 Vous – vous ne pouvez pas faire cela, parce que c’est comme de dire : «Je – je – je –j’ai faim, mais je n’irai point à table. Seulement je – je ne vais pas manger. Seulement je – je ne vais pas le faire.» Voyez ? Vous devez aller vous nourrir de la Parole de Dieu et communier les uns avec les autres."], ["p", "Nous avons maintenant besoin les uns des outres – des autres plus que jamais, c’est maintenant. Lorsque vous vous séparez des autres, en vous faisant un peu remarquer, vous ne voulez pas vous associer avec les autres parce qu’ils croient ceci, et vous ne voulez pas vous associer à cela, vous êtes sur un terrain dangereux à ce moment-là, en vous éloignant de l’église. Trouvez-vous-en une de votre choix, et restez-y, et soyez un frère chrétien pour tous les autres. C’est ça être un vrai chrétien. Alors nous avons la communion, la protection ; les gens vous aiment et ils prient pour vous."], ["rev", "Rev. William Marrion Branham"], ["bib", "1thes 3 :10"]]}, {"t": "Succès des réunions de WMB", "i": [["ref", "<b>60-0304 Avoir soif de la vie VGR<\/b>"], ["p", "147 Ce qui fait le succès de mes réunions, c’est le fait que les gens très pieux prient pour moi. C’est cela. C’est la raison pour laquelle il y a du succès dans mes réunions. Quand j’arrive et que je présente ces choses au sujet des visions et tout, il y a beaucoup de vieilles mamans et de vieux papas, des sœurs et des frères, assis là qui croient cela de tout leur cœur. Alors, le Saint-Esprit descend directement sur eux. S’ils ne croyaient pas cela, je n’ai aucun autre moyen de le faire. Peu importe combien cela est merveilleux pour moi, cela doit l’être aussi pour vous. Nous devons former une unité, nous deux ensemble, pour être en contact avec Dieu : vous, comme un croyant, et moi-même comme un croyant."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "TROIS MARCHES D’UN CHRÉTIEN (justification, sanctification et baptême du Saint-Esprit)", "i": [["ref", "<b>65-0418M C’est le lever du soleil SHP<\/b>"], ["p", "232 Ma pauvre mère, (pour le moment elle s’en est déjà allée) était vraiment particulière. Et vous savez, elle était mi-indienne, et elle était particulière. Mais en ce qui la concerne, elle ne faisait pas de rêves. Mais seulement, je pense qu’elle n’a fait que quatre ou cinq rêves dans toute sa vie. Mais chaque fois qu’elle avait un songe, il s’accomplissait. Quand elle avait un songe, il s’accomplissait."], ["p", "233 Je me rappelle une fois, il y a bien des années, quand j’ai commencé à prêcher, nous habitions juste ici au bord de la route, juste ici en haut. Et je prêchais ici même, dans cette église. Ma mère eut un songe où elle m’a vu me tenir debout, ici, près de ces trois marches. Et je me tenais debout, prêchant à tout le monde, disant qu’ils devaient monter ces trois marches avant d’atteindre la grand-route. Et sur la grand- route, il y avait une ligne étroite d’un blanc de perle, qui menait tout droit aux – aux – aux portes du Ciel, aux portes de perle. Et cette perle s’étendait jusqu’au sommet de ces marches. N’est-ce pas cela exactement mon Message d’aujourd’hui : justification, sanctification, baptême du Saint-Esprit ? Eh bien, je disais qu’une personne devait passer par ces trois marches pour pouvoir marcher sur cette grand-route. Et je disais que…"], ["p", "Rev. William Marrion Bmarchesxx"], ["bib", "Hebreux 12:14"]]}, {"t": "La justification amène la joie du salut et la paix du cœur", "i": []}, {"t": "La joie guérit même la maladie", "i": [["ref", "<b>59-0708M La Dédicace D’Une Eglise<\/b>"], ["p", "23 Et cela parle de l’ordre de Dieu dans Son Eglise. Nous entrons dans la cuisine quand nous écoutons la Parole et mangeons les bonnes choses de Dieu. Ça, c’est la justification. Nous entrons ensuite dans la sanctification où nous communions les uns avec les autres pendant que le Sang de Jésus-Christ, le Fils de Dieu, nous purifie de tout péché. Et alors, nous avons un lieu de repos et de sécurité lorsque nous sommes baptisés du Saint-Esprit : la justification par la foi, la sanctification par le sang et le baptême du Saint-Esprit."], ["p", "I Jean 5.7 dit : « Il y en a trois qui rendent témoignage au ciel : le Père, la Parole (qui est le Fils), et le Saint-Esprit : ces trois sont un. Il y en a trois qui rendent témoignage sur la terre : l’eau, le sang et l’Esprit, et ces trois sont d’accord. »"], ["p", "24 Vous ne pouvez avoir le Père sans avoir le Fils. Vous ne pouvez avoir le Saint-Esprit sans avoir le Père et le Fils. Mais vous pouvez être justifié sans être sanctifié. Et vous pouvez être sanctifié sans avoir le Saint-Esprit. Ils sont d’accord. Mais le Père, le Fils et le Saint-Esprit sont un."], ["p", "Vous pouvez être dans l’un des parvis, justifié, en croyant par la foi. Vous pouvez être dans un autre, purifié d’une vie de péché et sanctifié."], ["p", "25 Maintenant, tel que ça se passe dans le naturel, c’est la même chose dans le spirituel. Quand une femme donne naissance à un bébé, la première chose qui apparaît, c’est l’eau. La seconde chose qui apparaît, c’est le sang. La troisième chose qui apparaît, c’est la vie. Et quand Jésus est mort à la croix, ces éléments sont sortis de Son corps pour purifier Son Eglise et pour La faire entrer en Lui-même. Quand on a transpercé Son côté, il y a eu de l'eau, du sang, puis \"entre Tes mains, Je remets Mon Esprit\"."], ["p", "26 C’est comme ça que par un seul Esprit, nous sommes tous baptisés pour former un seul Corps et nous sommes dans le repos. Oh, qu’est-ce que le monde peut faire ? Je suis content que Dieu se soit emparé de moi avant que l’église le fasse avec toute sa doctrine. J’ai trouvé un lieu de repos. Oh, cette douce demeure « où il n’y a donc plus de condamnation pour ceux qui sont en Jésus-Christ », qui ont trouvé ce repos éternel."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "IL FAUT COMBATTRE POUR ENTRER AU CIEL", "i": [["ref", "<b>62-0909<\/b><b><sup>E<\/sup><\/b><b> Dans Sa Présence<\/b>"], ["p", "70 Dieu trouve un moyen d’amener les hommes en leur Présence, après quoi ils prennent leur décision. Certains fuient loin de Lui, certains accourent vers Lui. S’ils ont été prédestinés à la Vie, ils Y croient, ils s’Y accrochent. Sinon, ils cherchent à s’éloigner, et ils disent : “Il n’y a rien de vrai Là-dedans.” Voyez? Et ça, c’est l’homme qui est perdu. “L’homme qui confesse son péché recevra son pardon. Si vous cachez votre péché, vous ne prospérerez point.” Non."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>62-0121<\/b><b><sup>E<\/sup><\/b><b> Les noces de l’Agneau VGR<\/b>"], ["p", "54 Tellement de gens disent : “Si le Seigneur ôte de moi ce mauvais esprit de l’alcool, ou des jeux d’argent, ou du mensonge, ou du vol, je Le servirai.”"], ["p", "55 Mais c’est à vous de décider. Voyez, vous aussi, vous devez faire quelque chose. “Ceux qui vaincront hériteront ces choses.” Ceux qui vaincront. Vous avez le pouvoir de le faire, mais vous devez vouloir abandonner ces choses. Voyez ? “Elle S’est préparée.” J’aime cette Parole."], ["p", "56 Voyez-vous, Dieu ne peut pas nous pousser dans un petit tuyau, nous en faire sortir par l’autre bout, et puis dire : “Heureux celui qui vaincra.” Vous n’avez rien eu à vaincre ; c’est Lui qui vous a poussé dedans et vous en a fait sortir. Mais vous devez prendre vous-mêmes les décisions. Je dois prendre moi-même les décisions. Et en le faisant, nous démontrons notre foi et notre respect envers Dieu."], ["p", "57 Abraham avait reçu la promesse d’un enfant, mais il avait dû se tenir à cette promesse pendant vingt-cinq ans ; il a eu des hauts et des bas, et des tentations, pendant ces vingt-cinq ans. Mais il s’est accroché à la parole de la promesse."], ["p", "58 Et Israël avait reçu la promesse d’un pays promis, mais ils avaient dû combattre pour chaque pouce de cela. “Tout lieu que foulera la plante de votre pied, Je vous l’ai donné”, a dit Dieu à Josué. C’était bien là. Le pays était là, et Dieu le leur avait donné, mais ils devaient combattre pour cela."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "NOS CORPS PEUVENT OBÉIR À DIEU", "i": [["ref", "<b>63-0804<\/b><b><sup>E<\/sup><\/b><b> Appeler Jésus Sur La Scène<\/b>"], ["p", "101 Remarquez, rappelons-nous, Il a aussi créé nos corps. Et nos corps ne devraient-ils pas Lui obéir? Amen. Abandonnez-Lui vos pensées, abandonnez-Lui votre vie, abandonnez-Lui votre foi et vous verrez ce corps obéir à ce qu’Il dit. Si vous êtes un ivrogne et que vous n’arriviez–n’arriviez pas à cesser de boire, abandonnez-Lui cette vie, et observez, vous ne boirez plus. Si vous êtes un fumeur invétéré, vous avez essayé d’abandonner cela sans y parvenir, abandonnez-Lui simplement cela et voyez ce qui va arriver. Il amènera ce corps à se soumettre de nouveau à la Parole. Oui, oui. Mais vous devez le Lui abandonner. Vous devez croire en Lui. C’est Lui qui a fait nos corps; ils obéissent aussi à Sa volonté. Le croyez-vous? [L’assemblée dit: «Amen.»–N.D.E.] Si vous êtes un chrétien, vous devez croire."], ["p", "102 Vous direz: «Il amène nos corps à obéir? Oh! je crois que cela est sous notre contrôle.» Alors vous êtes–vous ne vous êtes pas complètement abandonné."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "C’EST DIEU QUI CHANGE", "i": [["ref", "<b>55-0222 Jéhovah-Jiré<\/b>"], ["p", "26 Qu’arrivait-il si un cochon désirait être un agneau? Cela ne lui ferait aucun bien. Il est simplement un cochon; sa nature est celle d’un cochon. Eh bien, c’est juste la même chose, lorsque vous désirez... «Eh bien, je crois que je vais devenir un chrétien.» Vous n’y arriverez pas s’il vous le fallait. C’est Dieu qui doit faire cela. Vous pouvez purifier votre vie. Vous pouvez faire une chose, payer de bonnes dîmes aux églises. Vous pourriez même bâtir une synagogue. Vous pourriez faire toutes ces choses, mais vous n’arriverez jamais à vous purifier du péché. C’est comme un léopard qui essayerait de faire disparaitre ses taches en les léchant, et il ne ferait que les rendre plus éclatantes. Ainsi... La seule manière pour un léopard d’être changé, c’est que quelqu’un le prenne et teigne sa peau, à ce moment-là il sera changé."], ["p", "Et le seul moyen que Dieu puisse faire quoi que ce soit avec vous, ou plutôt pour que vous puissiez être changé d’un pécheur en un chrétien, c’est d’être plongé dans la fontaine remplie de Sang tiré des veines d’Emmanuel,
