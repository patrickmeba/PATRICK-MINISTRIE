<script id="d" type="application/json">{"S": [{"t": "LA RECONNAISSANCE D’UN PEUPLE RACHETÉ", "i": [["bib", "<b>Psaumes 150 :1-6<\/b>"]]}, {"t": "Dieu donne de bonnes choses à ses enfants", "i": [["ref", "<b>62-0531 Le conflit entre Dieu et Satan<\/b>"], ["p", "55 Est-ce que vous, ce soir, pour vos enfants, qui sont de petits êtres sans défense, incapables de se suffire à eux-mêmes, est-ce que vous ne luttez pas, ne travaillez pas et ne faites pas tout ce que vous pouvez pour fournir ce qu’il y a de mieux, tout ce que vous êtes capables de fournir à ces enfants? [L’assemblée dit : “Amen.” — N.D.É.] Parce que vous êtes un père, un parent. Et si c’est ainsi que s’exprime la—la…ce que j’appellerais la—la loyauté et la pensée d’un parent terrestre. Et la paternité a eu son origine en Dieu, puisque c’est Lui qui a été le premier Parent. Alors, ne pensez-vous pas que Dieu, qui a vu ce que Satan serait, ce que Satan ferait, Il a donné à Ses enfants, Il leur a fourni ce qu’il y a de mieux? Comme Il savait quel serait le moyen d’attaque de l’ennemi, Dieu a mis Ses enfants à l’abri, Il les a fortifiés. Voyez?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>58-0610 Le Puissant Conquérant<\/b>"], ["p", "19 Combattez avec ce que vous avez dans vos mains. S’il s’agit de chanter, chantez l’Evangile. Si vous ne pouvez rien faire d’autre que siffler, sifflez aussi fort que possible pour la gloire de Dieu. Si vous ne pouvez rien faire d’autre que de taper les mains, tapez-les. Vainquez avec tout ce que vous avez entre vos mains ; tapez les mains de telle façon que tous les voisins vous aimeront. Sifflez de telle manière que toutes les dénominations sauront que vous appartenez à Christ. Vainquez-les ; jouez le jeu avec fair-play. Jouez-le correctement."], ["p", "Nous vivons dans un jour où cet Evangile social commence à prédominer, un jour où les – les églises s’unissent ensemble et forment une religion sociale, en se liant ensemble ; c’est un jour terrible, ils essaient de retirer toute la divinité et toute la – la – la gloire de Christ, et ils essaient de faire de Lui un simple prophète. Si Christ n’était qu’un simple prophète, nous sommes tous perdus. Il était plus qu’un prophète, et aujourd’hui lorsque…"], ["rev", "Rev. William Marrion Branham"], ["bib", "                         Psaumes 49:8 LSG"], ["v", "« 8. Ils ne peuvent se <b>racheter<\/b> l’un l’autre, Ni donner à Dieu le prix du rachat.  »"]]}, {"t": "JÉSUS EST DIGNE DE TOUT", "i": [["ref", "<b>55-0221 Christ<\/b>"], ["p", "10 Je déteste manger dans un lieu où il y a ce genre de truc qui joue. Je ne... Ma nourriture ne me fait aucun bien. Ainsi quelqu’un y avait introduit un–un morceau, et ils jouaient cela, et je mangeais."], ["p", "Evidemment, Billy n’est qu’un adolescent, vous savez, il a dit: «Papa, n’est-ce pas une belle chanson?»"], ["p", "J’ai dit: «Quelle chanson?» Je–je ne savais pas. Je–je m’étais simplement isolé par rapport à cela. Je ne voulais pas écouter ça."], ["p", "Et il a dit: «Tu sais, papa, a-t-il dit, tu étudies tellement la Bible, et tu pries tellement que la seule chose à laquelle tu penses, c’est Jésus-Christ.»"], ["p", "J’ai dit: «Merci, chéri, j’apprécie certainement cela.»"], ["p", "Il a dit: «C’est tout ce que tu as à l’esprit.»"], ["p", "J’ai dit: «C’est pourtant tout ce que je veux avoir à l’esprit: le Seigneur Jésus.»"], ["p", "11 Quelqu’un m’a dit: «Vous Le vantez trop.» Non, je ne peux pas trop Le vanter. Non. Il est digne de plus de louange et de gloire que ce que n’importe quel être humain peut Lui donner. Les lèvres mortelles ne pourront jamais Lui exprimer la gratitude et la reconnaissance que nous avons pour Lui."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Notre Seigneur Jésus est ici", "i": [["ref", "<b>54-0329 La rédemption par la puissance<\/b>"], ["p", "168 Alors que vous voyez l’Église partir dans ce grand exode, et que vous voyez la Colonne de Feu qui est devant nous, qui nous conduit, qui se tient là, et accomplit des miracles et des prodiges. Il est ici, ce soir, dans toute Sa puissance rédemptrice. Il est ici pour rétablir chaque pécheur, pour recevoir à nouveau chaque rétrograde. Il est ici pour guérir chaque malade."], ["p", "169 Il est le plein Évangile. Et nous prêchons le plein Évangile, nous mangeons l’Agneau en entier. Nous Le faisons rôtir par le Saint-Esprit, et nous savons que C’est de la bonne nourriture, car le Saint-Esprit nous a révélé que C’est vraiment bon. “Goûtez et voyez, l’Éternel est bon. Ça a le goût du miel du rocher.”"], ["p", "170 <b><i>Notre Seigneur Jésus est ici, dans Son amour et Sa puissance, dans Ses grandes bénédictions rédemptrices! Oh, comme Il se tient entre l’église et le péché, ce soir! Comme Il se tient entre vous et le jugement; Il saigne, et prie!<\/i><\/b>"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu pardonne avec son sang", "i": [["ref", "  <b>54-0329 La rédemption par la puissance<\/b>"]]}, {"t": "Parmi les dix lépreux, il y a eu un seul qui est revenu pour demander pardon", "i": [["p", "177 Je me suis assis là, et je me suis mis à pleurer. J’ai eu une vision. J’ai vu, pour ainsi dire, le monde tournoyer dans les airs, et il y avait un arc-en-ciel autour de ce monde. Et quelqu’un qui me parlait a dit : “Ça, c’est le Sang de Jésus-Christ, qui entoure ce monde, et qui L’empêche de le détruire. Si jamais Dieu voit le péché : ‘Le jour où tu en mangeras, ce jour-là tu mourras.’ Chaque homme qui est sous ce Sang que voilà a un…a son libre arbitre, il peut faire son choix. Mais si jamais vous mourez, et que votre âme va au-delà de la miséricorde de ce Sang, vous êtes déjà jugé avant d’arriver là-bas. Il ne reste plus rien pour vous.”"], ["p", "178 Puis je me suis vu. J’ai vu mon Seigneur Jésus qui se tenait là, une couronne d’épines sur Sa tête, et des larmes mêlées de sang couler et dégouliner sur Sa barbe. Et j’ai vu mes péchés qui paraissaient devant Lui, et chaque fois qu’ils paraissaient devant Lui, comme ça, [espace non enregistré sur la bande—N.D.É.] …au point qu’Il tremblait. Les épines s’enfonçaient davantage dans Son front. Il chancelait. Il disait : “Père, pardonne-lui, il ne sait pas ce qu’il fait.” Et je faisais autre chose, et là, Son Sang était comme le pare-chocs de la voiture, qui protège la voiture, et ça me protégeait de la colère de Dieu, alors que j’en étais indigne."], ["p", "179 Et je me suis approché de Lui, lentement, je me suis agenouillé devant Lui. J’ai dit… J’ai baissé le regard, et devant moi, il y avait un vieux registre de péchés, et mon nom était écrit sur le dessus. J’ai dit : “Seigneur, veux-Tu me pardonner?”"], ["p", "180 “Certainement”, a-t-Il dit, les yeux pleins d’amour; Il a mis la main dans Son côté, Il a pris du Sang, et Il a écrit dessus : “Pardonné.” Et Il a jeté cela dans la Mer de l’Oubli. Il a dit : “Maintenant…”"], ["p", "J’ai dit : “Merci, Seigneur.”"], ["p", "181 Il a dit : “Là, Je te pardonne, et toi, tu la condamnes.” Oh, cela a changé le tableau pour moi."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Il n’y a pas de paix pour un cœur troublé", "i": [["ref", "<b>58-1221<\/b><b><sup>E<\/sup><\/b><b> L’unité d’un seul Dieu dans la seule Église<\/b>"], ["p", "118 Mais un homme qui mène une telle vie n'a pas de paix. Il n'y a pas de paix pour un coeur troublé. Il ne peut y avoir de paix pour un coeur pécheur. Si un homme a envie de boire, et qu'il appelle cela «la vie», et pense qu'il passe de moments merveilleux, cela montre qu'il est vide. Prenez un homme, s'il obtient un million de dollars, il voudra en avoir deux. Prenez un homme qui se rend à une fête et prend un verre, ce soir, il en voudra un autre. Prenez un homme qui a été infidèle une fois à sa femme, il le sera une deuxième fois; vice versa. Voyez, c'est quelque chose, et il n'est jamais satisfait. Il peut avoir un million de dollars en main, ou dix millions en main, il se couche la nuit avec sa cuite; il se lève le lendemain opprimé, sous l'effet des cauchemars et avec l'esprit troublé. Vous appelez cela «paix»? Ce n'est pas la paix."], ["p", "119 Mais un homme peut manquer même un oreiller sur lequel reposer sa tête, il peut manquer même une bonne paire de souliers, ou manquer les moyens de s'offrir un bon repas chez lui; mais si Dieu règne dans son coeur, il va au lit heureux et se réveille heureux. C'est une paix durable. C'est quelque chose que Dieu accomplit."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>57-1006 Questions et réponses sur Hébreux, 3<\/b><b><sup>e<\/sup><\/b><b> partie<\/b>"], ["p", "123 Maintenant, maintenant, aujourd’hui, — alors que cet Urim Thummim a été supprimé en même temps que ce sacerdoce-là, — maintenant, c’est cette Bible qui est l’Urim Thummim de Dieu aujourd’hui. Et quand un prédicateur prêche, ce ne doit pas être seulement un petit passage ici, sur lequel il place toutes ses espérances ; il faut que la Bible entière reflète le message que cet homme prêche. C’est ça qu’il faut. Pas seulement un passage, et dire : “Eh bien, la Bible dit ceci.” Oh, bien sûr, elle dit beaucoup de choses. Mais vous devez présenter cela de sorte que tous les éléments forment un ensemble. Et quand l’Esprit de Dieu vient et entre dans la—la Parole, Il place tous ces éléments ensemble et reflète une seule grande Lumière, et cette Lumière, c’est Jésus-Christ. Amen."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "SANS LE SAINT-ESPRIT, TU N’AS PAS DROIT À LA CHAIRE", "i": [["ref", "<b>64-0802 La Demeure future de l’Époux Céleste et de l’Épouse terrestre<\/b>"], ["p", "253 Aucun homme, personne, aucune femme, garçon, fille, peu m’importe qui c’est, n’est apte à aller en chaire, ni même à se dire Chrétien, sans être rempli du Saint-Esprit. Vous n’avez pas droit au souper du Seigneur, ni à la communion, au lavage des pieds, ni rien, tant que vous n’avez pas été purifié par le Saint Feu de Dieu."], ["p", "254 Aucun homme n’a le droit de prêcher tant que, comme Moïse, vous ne L’avez pas rencontré, là, sur ce terrain sacré, cette Colonne de Feu qui se tient là, alors il sait où il en est. Voyez ?"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Pierre était un homme d’affaires avec son entreprise", "i": [["ref", "<b>63-0803B Des investissements<\/b>"], ["p", "165 Pierre, un pêcheur, c’était un homme d’affaires. Il avait une grande entreprise. Il vendait du poisson. Et c’était une activité importante à cette époque-là, les gens vivant là, près du lac — c’était un endroit semblable à Chicago, ici, près du lac. Il était un pêcheur commercial. Mais, et c’était un homme plutôt dur, parce qu’il était pharisien, et que son père était un vieux pharisien. Mais un jour…"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>64-0304 Messieurs, nous voudrions voir Jésus<\/b>"], ["p", "88 «Très bien. Alors, ce Prophète, c’est Jésus de Nazareth. Tu te souviens de ce brave pêcheur, Simon, là-bas ?"], ["p", "Oui."], ["p", "C’est–c’était le fils de Jonas."], ["p", "Oui."], ["p", "Tu lui as acheté du poisson une fois, et il n’a même pas su signer le reçu."], ["p", "Oui."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "L’AUTEL DOIT ÊTRE À L’EST", "i": [["ref", "<b>61-0108 Apocalypse, chapitre quatre, 3<\/b><b><sup>e<\/sup><\/b><b> partie<\/b>"], ["p", "102 N’oubliez pas ces mots : “Vers l’orient” ! D’où viendra Jésus ? De l’est, sur une nuée de Gloire. Où se lève le s-o-l-e-i-l ? À l’est. Où se lèvera le F-i-l-s ? À l’est. Où était placé le propitiatoire ? Vers l’est. Pourquoi ai-je fait en sorte que vous soyez assis comme ceci, vers l’est ? Pourquoi ? L’autel est à l’est. Nous le verrons un peu plus tard, comme c’est beau, je vais dessiner cela. J’ai demandé à tous ceux qui le pouvaient d’apporter du papier et tout, afin de reproduire ces cartes que je vais dessiner dans quelques instants. Très bien :"], ["p", "…il fera l’aspersion…vers l’orient ; il fera avec son doigt sept fois l’aspersion du sang devant le propitiatoire."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Toute la puissance est en Christ.", "i": [["ref", "<b>64-0207 Le patriarche Abraham<\/b>"], ["p", "117 Maintenant, accordez-moi toute votre attention. Que celui qui contrôle ce micro-ci augmente son volume. En effet, si le Saint-Esprit décide de faire ceci… Je ne dis pas qu’Il le fera."], ["p", "<b>118 Bon, si quelqu’un vient ici vous dire qu’il a le pouvoir de guérir les malades, ne le croyez pas. Toute la puissance est en Christ. C’est Lui le Vainqueur, pas vous et moi. Nous acceptons simplement ce qu’Il a fait. Aucun homme n’a le pouvoir de sauver ou de guérir.<\/b>"], ["p", "<b>119 Pour tout homme dans le monde, le prix a déjà été payé. Le prix exigé a été payé. Comment l’a-t-il été ? “Il a été blessé pour nos péchés, c’est par Ses meurtrissures que nous avons été guéris.” Votre—votre guérison a été payée. Votre salut a été payé. Avez-vous la foi pour vous avancer et l’accepter ? C’est tout. Si vous êtes de la Postérité d’Abraham, vous l’avez. Dieu l’a promis. Il y a quelque chose en vous qui dit que vous l’avez, et c’est vrai.<\/b>"], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "DIEU DANS LA CHAIR HUMAINE AVANT LA VENUE D’ISAAC", "i": [["ref", "<b>64-0614M Dieu dévoilé<\/b>"], ["p", "82 Qui est cette grande Personne invisible ? Qui est Celui qu’Abraham a vu dans des visions ? Mais, au dernier moment, Il s’est manifesté en chair, avant la venue du fils. Dieu Lui-même est venu à Abraham sous la forme d’un homme, au temps de la fin. Manifesté ! Une fois, il L’avait vu dans une petite Lumière ; il L’avait vu dans des visions ; Il avait entendu Sa Voix ; de nombreuses révélations. Mais juste avant le fils promis, il L’a vu sous la forme d’un homme, et il Lui a parlé, et Lui a fait manger de la viande et Lui a donné à boire. Voyez ? Remarquez, Dieu Lui-même voilé dans une chair humaine."], ["p", "83 Ça fait partie de Sa manière de faire. C’est de cette manière qu’Il Se manifeste à nous, qu’Il manifeste la Parole Éternelle, Dieu, Jéhovah fait chair. Comme dans Jean 1 : “Au commencement était la Parole, et la Parole était avec Dieu, et la… Au commencement était Elohim, et Elohim était…est devenu la Parole, et la Parole était Elohim. Et la Parole a été faite Elohim.” Voyez ? C’est la même chose, qui se dévoile, tout simplement."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>64-0207 Le patriarche Abraham<\/b>"], ["p", "120 Maintenant, un don, qu’est-ce que c’est ? Un don, est-ce le fait d’aller guérir les gens ? Non. Un don, c’est de vous enlever du chemin, pour que Dieu puisse vous utiliser."], ["p", "121 Maintenant, Il a promis que le dernier signe, selon Jésus-Christ : “Ce qui arriva du temps de Sodome, juste avant qu’elle soit brûlée.” Pas avant que d’autres choses se soient produites, que l’Évangile ait été prêché par Lot, et tout ; pas ça. Mais juste avant qu’elle soit brûlée, Dieu est descendu sous la forme d’un homme, et S’est assis en compagnie de l’Église élue, — Abraham et son groupe, — celle qui avait la promesse."], ["p", "122 Maintenant, souvenez-vous, il n’y a que la Postérité d’Abraham qui reçoit ceci. “Encore un peu de temps, et le monde ne Me verra plus”, a dit Jésus. “Vous Me verrez, car Je serai avec vous, en vous, jusqu’à la fin du monde.”"], ["p", "123 Mais Il a promis que juste avant Son retour : “Ce qui arriva à Sodome”, — regardez ce que Sodome est en train de recevoir ; regardez ce que l’Église élue est en train de recevoir, — a-t-Il dit, “arrivera de même à la venue du Fils de l’homme.” Dieu S’est manifesté sous la forme d’un homme qui, le dos tourné à la tente, a dit ce que Sara avait fait à l’intérieur de la tente. Que tous ceux qui savent que c’est la Vérité lèvent la main. C’est tout à fait vrai. Eh bien, c’est ce qu’Il a promis. Nous sommes au temps de la fin. Maintenant, souvenez-vous, c’est la dernière chose qui s’est produite ; par la suite, le monde des nations a été brûlé, Sodome, et le fils promis est venu sur la scène. Nous attendons un Fils promis, le Fils de Dieu."], ["p", "124 Nous y voilà. Puisse Dieu vous ouvrir les yeux. Je ne sais que dire de plus. Puisse-t-Il vous ouvrir les yeux."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0604 Jésus-Christ Est Le Même Hier, Aujourd’hui Et Éternellement<\/b>"], ["p", "152 Eh bien, les gens des nations ont eu deux mille ans d’enseignement, comme les autres avaient aussi eu deux mille ans d’enseignement. Mais si les gens des nations ne reçoivent pas la même chose qu’eux, c’est qu’Il fait donc acception de personne. Comment donc Le reconnaîtrions-nous aujourd’hui?"], ["p", "Alors qu’Il est parmi nous, et en nous, Il a opéré au travers de nous, Il a prouvé que cet Esprit, que nous appelons le baptême du Saint-Esprit, c’est Jésus-Christ se personnifiant sous la forme de l’Esprit, dans l’être humain, accomplissant la même chose. Il a dit dans Saint Jean, chapitre 14, verset 12 : «Celui qui croit», non pas celui qui fait semblant de croire. Mais : «Celui qui croit en Moi, fera aussi les œuvres que Je fais.» N’est-ce pas vrai ? [L’assemblée dit : «Amen.»–N.D.E.]"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "L’ENFANT RESSUSCITÉ AU MEXIQUE [LA FOI] L’AMOUR D’UNE MÈRE", "i": [["ref", "<b>58-0314 L’Amour<\/b>"], ["p", "26 Il y a quelque temps, j'étais au Mexique l'année dernière; un petit bébé a été amené à la réunion ce matin-là. Et il était mort à neuf heures, ce matin-là."], ["p", "Les gens se tenaient là par dizaines de milliers. Vingt mille vinrent à Christ ce soir-là, vingt mille. J'ai dit: \"Je ne veux pas de catholiques, ou de membres des églises évangéliques, je veux des gens qui n'ont jamais reçu Christ du tout.\" Et on en compta vingt mille."], ["p", "Mais il y avait une petite femme là-bas qui criait en tenant une couverture. Billy était avec l'homme qui avait distribué les cartes de prière, et ils avaient environ deux cents ou trois cents huissiers. Et ces trois cents huissiers n'arrivaient pas à l'écarter de la ligne."], ["p", "Elle leur montait sur le dos. Oh! quel était le problème? Son bébé était mort à neuf heures ce matin-là, et il était presque vingt-deux heures cette nuit-là."], ["p", "27 Après une longue lutte, la petite dame qui n'avait pas plus de vingt-cinq ans, une très belle petite femme, et elle ne cessait de crier, et les huissiers essayaient de la repousser... Elle leur passait entre les jambes, par-dessus les dos, ou n'importe comment. C'était l'amour qu'elle avait pour son bébé."], ["p", "Et je pouvais entendre ces cris: \"Padre.\" \"Padre\" veut dire \"père\". Elle était une catholique."], ["p", "Et comme elle criait, Billy vint vers moi et dit: \"Papa, tu dois faire quelque chose pour cette femme.\" Il dit: \"Elle n'a pas de carte de prière, et nous ne pouvons pas la laisser dans la ligne sans une carte de prière. Les autres se sont tenus ici depuis l'aube ce matin pour obtenir une carte de prière.\""], ["p", "Et je dis: \"Bien, Frère Moore (Frère Jack Moore de Shreveport, en Louisiane), dis-je, allez-y et voyez si vous pouvez prier pour son bébé ou quoi que ce soit qui ne va pas.\" Comme il y allait, je levai les yeux devant moi et vis en vision un petit bébé. Je dis: \"Juste une minute, Frère Moore.\""], ["p", "28 Vous voyez, l'amour souverain projette chaque fois la grâce de Dieu. Je dis: \"Peut-être que je ferais mieux d'aller vers le bébé.\" Je dis: \"Vous les huissiers, je sais que ceci n'est pas correct. Selon nos règles, les gens doivent avoir une carte de prière. Néanmoins, laissez venir la petite dame ici.\""], ["p", "Et quand elle s'approcha, elle tomba par terre. Je dis: \"Lève-toi.\" Je n'arrivais pas à lui faire comprendre. Et j'ai posé ma main sur cette couverture. Je n'avais jamais vu le bébé. Et je dis: \"Seigneur Dieu...\" C'était mouillé au possible. Il avait plu toute la journée. Les gens n'avaient pas d'endroit où s'asseoir; ils étaient debout appuyés les uns contre les autres, jusqu'à perte de vue dans cette grande arène."], ["p", "Et je dis: \"Seigneur Dieu, je ne sais pas de quoi il s'agit, mais je vois un petit bébé espagnol dans une vision juste maintenant.\" Et j'ai posé mes mains sur cette couverture humide. Jéhovah Dieu est mon juge. Et il hurla et poussa un grand cri, et il commença à donner des coups de pied dans la couverture dont il était couvert."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "PHOTO DE L’ANGE", "i": [["ref", "<b>62-0311 La plus grande bataille jamais livrée VGR 137 SHP<\/b>"], ["p", "<b>166 L’Ange du Seigneur, même que Sa photo est accrochée ici sur le mur, alors, partout, la science ne sait plus quoi répondre. Qu’est-ce <\/b>"], ["p", "<b>qu’Il fait ? Il s’en tient strictement à la Parole. Amen ! Elle tranche tous les démons. [Frère Branham tape deux fois dans ses mains. — N.D.É.] Oui, effectivement. Qu’est-ce que C’est ? “Les esprits qui exercent un ministère, envoyés de la Présence de Dieu”, pour oindre ceux qui prêchent la Parole, qui s’en tiennent à la Parole. Et Il confirme la Parole, par les signes qui L’accompagnent, produisant Jésus, le même hier, aujourd’hui et éternellement. Le voilà.<\/b>"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "SALUEZ LE PRÉDICATEUR PENDANT LA PRÉDICATION", "i": [["ref", "<b>(61-1015M Questions Et Réponses)<\/b>"], ["p", "   E-165  J’étais assis juste à l’estrade et j’écoutais un prédicateur prêcher et je l’ai vu aborder un point… Oh ! la la ! J’avais tellement envie de me lever pour l’aider que je ne savais que faire. Et cela vous est déjà arrivé, cela nous arrive à nous tous. Mais qu’est-ce ? C’est irrévérencieux. Asseyez-vous. Soyez respectueux, mon frère."], ["p", "     E-166  J’ai entendu – j’ai entendu frère Neville prêcher, et il m’a entendu prêcher lorsque nous, sans doute, nous… frère J.T. ici ainsi que tous les autres, ou plutôt – et tous les autres, l’un peut entendre l’autre prêcher, on se dit : « Oh ! frère, je crois que je vais me lever pour l’aider. » Voyez-vous ? Vous sentez simplement l’Esprit se déverser sur vous, mais que faire ? Tenez-vous tranquille. Voyez-vous ? Parce que l’esprit des prophètes est soumis au prophètes. Voyez-vous ? C’est vrai, tenez-vous tranquille. Voyez-vous ? Faites cela."]]}, {"t": "PAYEZ VOS DETTES ET SOYEZ HONNÊTES", "i": [["p", "4 Et si j’ai bien compris, Frère Sullivan a dit que tout allait être bien réglé. Nous ne sommes encore jamais repartis d’une ville avec une dette, ne serait-ce que d’un cent, sans que tout ait été réglé ; nous ne croyons tout simplement pas qu’on doive agir autrement. Il ne faut rien devoir à personne, il faut être honnête et franc. Et si vous devez quelque chose à quelqu’un, allez voir ces gens, dites-leur que vous êtes en dette avec eux, mais que, s’ils veulent bien vous accorder un petit délai, vous allez payer votre dette. Voyez ? Toujours, c’est un meilleur… c’est un bon signe qu’on est Chrétien, ça : d’être honnête, droit."], ["p", "5 Il faut vivre les choses dont vous parlez. Si vous ne les vivez pas vous-mêmes, comment voulez-vous que quelqu’un d’autre les vive, voyez-vous. Donc, vous êtes des lettres écrites, lues de tous les hommes ; alors, soyez toujours honnêtes, justes, fidèles. Dites la vérité, peu importe combien fâcheuses peuvent être les conséquences. Dites la vérité quand même, parce qu’ainsi vous pourrez toujours raconter la chose de la même manière, chaque fois. Si vous dites un mensonge, vous serez obligés d’user de détours, de faire un million de milles, et il faudra quand même que vous en reveniez à ce mensonge-là ; et ce que vous aurez fait là, c’est quelque chose de très vilain. Soyez simplement honnêtes, alors vous pourrez toujours raconter la chose de la même manière, puisque c’est la vérité."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "POURQUOI ?", "i": [["p", "16 Maintenant, c’était donc à cause de son entêtement qu’il ne voulait avoir aucune communion avec ce prophète pieux. Cependant, il était un Israélite. Il était dans la ligne pour–pour avoir une bénédiction de Dieu sur lui. Et il était sous la bénédiction de par son droit de naissance, étant un Israélite, mais cependant, il refusa d’accepter la voie de Dieu et s’engagea sur une autre voie."], ["p", "Dieu nous demandera au jour du Jugement: «Pourquoi n’avais-tu pas reçu le Saint-Esprit? Pourquoi n’étais-tu pas né de l’Esprit? Pourquoi n’étais-tu pas comme ceci et comme cela? Etait-ce parce qu’il n’y avait pas d’église qui enseignait cela? Etait-ce parce qu’il n’y avait pas un prédicateur dans le pays qui prêchait le baptême du Saint-Esprit? Pourquoi as-tu fait ces choses?»"], ["p", "Lorsque Dieu a pris des dispositions et que les gens refusent de marcher dans cela, alors Il demande: «Pourquoi?»"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-0108 Apocalypse, chapitre quatre, 3<\/b><b><sup>e<\/sup><\/b><b> partie<\/b>"], ["p", "221 Pour l’âme, il y a l’imagination, la conscience, la mémoire, le raisonnement et l’affection, voilà ses sens ou ses attributs, c’est considéré comme les sens de l’âme. Et l’âme est la nature de l’esprit qui est à l’intérieur, parce que l’âme ne fait que dégager l’atmosphère de ce qui est à l’intérieur de vous. Ça prend la place de la sanctification, l’âme le fait, elle se trouve dans la même catégorie. Très bien, maintenant, tout…tout le monde l’a-t-il pris en note? Très bien."], ["p", "222 Maintenant, cette porte-ci est unique, il n’y a qu’une seule porte, ça s’appelle le “libre arbitre”. Vous êtes maître de ce qui y entre. Et qu’est-ce que cela fait? Ceci, qu’est-ce que c’est? Le corps qui doit être lavé, la cuve — sanctifié, ici, et rempli du Saint-Esprit ici, et ceci redevient le tribunal de Dieu, et là, Dieu règne dans votre cœur, et si vous faites quelque chose de mal, vous dites : “Oh! la la! j’ai mal agi.”"], ["p", "223 Certaines personnes disent : “Avoir des cheveux courts, ça—ça ne me culpabilise pas”, les femmes. “Mettre de la manucure ou du maquillage, ou quoi que ce soit d’autre, ça ne me culpabilise pas. Aller aux soirées dansantes, ça ne me culpabilise pas. Dire un petit mensonge, ça ne me culpabilise pas. Jouer au bridge à une soirée de bridge, ça ne me culpabilise pas.” Vous savez pourquoi? C’est qu’il n’y a rien en vous qui puisse vous culpabiliser. “Ça ne me donne pas mauvaise conscience.” Vous n’avez pas plus de conscience qu’un serpent a des hanches. Alors vous… Vous n’avez pas de conscience, il n’y a rien à l’intérieur pour vous donner mauvaise conscience. Vous êtes du monde!"], ["p", "224 Mais je vous mets au défi de laisser Jésus-Christ venir ici, à l’intérieur, et d’essayer de faire cela une fois! Frère, vous vous sentirez tellement repris dans votre conscience que vous reculerez et détournerez la tête de cette chose, aussi vrai que je suis ici devant vous, parce qu’Il est saint. Écoutez, je cite l’Écriture : “Si vous aimez ces choses qui sont du monde, les choses du monde, c’est parce que l’amour de Dieu n’est même pas en vous.”"], ["p", "225 Comment ça? Le libre arbitre. “Pourquoi appelez-vous cela le ‘libre arbitre’, Frère Branham?” Parce que cela ramène un homme et une femme dans la même position qu’Adam et Ève dans le jardin d’Éden. Par rapport à quoi? Aux deux arbres! Le libre arbitre, celui-ci donne la mort. Celui-ci donne la Vie, le libre arbitre. L’immoral…La loi du libre arbitre! Dieu a mis le premier homme, Adam et Ève, ici même avec le libre arbitre. Il vous met dans la même position. Et le seul moyen pour vous d’arranger tout ça ici, c’est par votre libre arbitre. Alléluia! Votre libre arbitre! Vous devez vouloir, pour faire la Volonté de Dieu. Vous devez vous débarrasser de votre propre volonté et céder la place à la volonté de Dieu, car voici le seul canal qui mène au cœur."], ["p", "226 Oh, vous pouvez adhérer à l’église, vous les baptistes et les presbytériens. Et vous, les méthodistes et les pèlerins de la sainteté, vous pouvez parvenir à la sanctification. Mais pour faire la Volonté de Dieu, vous devez le vouloir, par votre libre arbitre, afin de laisser entrer le Saint-Esprit ici, pour produire des choses. “Voici les signes qui accompagneront ceux qui auront cru. En Mon Nom, ils chasseront les démons. Ils parleront de nouvelles langues. Ils imposeront les mains aux malades ou s’ils boivent des breuvages mortels, et ainsi de suite. Voici les signes qui accompagneront ceux qui ont laissé leur volonté devenir Ma Volonté, et les œuvres que Je fais, ils les feront aussi.” J’espère que vous ne le manquez pas. Il y a une volonté de faire la Volonté de Dieu. Vous voyez ce que je veux dire?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0626 Pourquoi ?<\/b>"], ["p", "120 Une femme m’a dit, il n’y a pas longtemps, je m’en prenais à elle à cause du port de ces petits habits scandaleux. Et elle a dit: «Eh bien, Frère Branham, laissez moi vous le dire, vous n’avez pas le droit de dire cela. Nous avons le droit de porter les habits courts si nous le voulons.»"], ["p", "121 J’ai dit: «Je pense que c’est vrai. Mais si vous étiez une chrétienne, vous n’aimeriez pas les porter.» Elle a dit, elle a dit…"], ["p", "122 Et elle a dit: «Eh bien, attendez donc, Frère Branham.» Elle a dit: «Vous savez, on ne fabrique plus ce genre de tissus; il n’y a que ces habits sexy, et autres comme cela.»"], ["p", "123 J’ai dit: «On produit toujours des rouleaux des tissus et on fabrique des machines à coudre. Il n’y a pas d’excuse.» C’est vrai."], ["p", "124 C’est parce qu’on ne veut pas prendre cette inoculation des remplissages par le Saint-Esprit avec une sainteté à l’ancienne mode des sauvés de Dieu. Amen. C’est vrai."], ["p", "125 Autrefois, c’était mal de faire ces choses. C’est toujours mal! C’est vrai. Mais le problème, c’est que quelque chose est arrivé. Autrefois, les gens qui agissaient comme cela étaient même excommuniés de la société;  aujourd’hui, on ne peut pas les intégrer dans la société à moins qu’ils fassent cela. Et alors, vous voyez, ça dépend de là où est votre coeur, c’est là aussi que se trouvent vos trésors; ou plutôt là où se trouve votre trésor, c’est aussi là que se trouve votre coeur. Vous devez vous souvenir que, si vous aimez le Seigneur de tout votre coeur, vous mènerez une vie pure et nette."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "ERREURS COMMISES DANS LE MESSAGE", "i": [["ref", "<b>62-0129 Le Ministère expliqué<\/b>"], ["p", "12 Et examinons. Si ce n’est pas scripturaire, alors mettez cela de côté. Si jamais j’apporte quelque chose devant vous, comme une doctrine ou un enseignement, qui ne se trouve pas dans la Bible, oubliez cela, car ce n’est pas vrai. Et si le – un ange (peu m’importe combien il paraît réel et combien il est inspiré), s’il parle contrairement à la Parole de Dieu, laissez-le tranquille. Il n’est pas de Dieu."], ["p", "Galates 1.8 dit: «Si un ange du ciel prêche une autre doctrine que celle-ci, ce qui est déjà enseigné, qu’il soit anathème.» Nous ne – nous n’acceptons que ce que Dieu..."], ["p", "Maintenant, nous voyons que, dans la Bible, quand Dieu conduisit les enfants d’Israël à travers le désert..."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0324<\/b><b><sup>E<\/sup><\/b><b> Le Septième Sceau<\/b>"], ["p", "29 Maintenant je veux être très clair là-dessus : chaque fois, chaque fois, les Sceaux, quand Ils ont été situés, tout ce que j’avais déjà cru à leur sujet, et que j’avais lu chez d’autres personnes, était contraire à ce qui m’était donné dans la pièce."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "POLYGAMIE", "i": [["ref", "56-0129 Le Surnaturel (L'atmosphère Spirituelle)"], ["p", "47 L'autre jour, en parlant de la polygamie à quelqu'un, j'ai dit que la nation dans l'ensemble serait meilleure si elle pratiquait la polygamie. Elle le serait. Nous sommes la nation où le taux de divorce est le plus élevé du monde, on se marie et on pratique le mariage mixte, on se marie et on pratique le mariage mixte. Parce que nous cherchons à amener les hommes du monde extérieur à s'accorder avec la doctrine chrétienne, mais vous ne pouvez pas mettre la nature d'un agneau dans un cochon. La polygamie serait meilleure pour lui. Vous pouvez ne pas croire ça, mais Dieu considérerait la polygamie et pardonnerait beaucoup plus rapidement cela qu'Il ne pourrait..."], ["p", "Maintenant, rappelez-vous, n'allez pas dire que je crois à la polygamie. Non. Je...?... ce que Dieu a dit... Moïse a dit que... Le pharisien a dit à Jésus, il a dit: \"Pourquoi Moïse a-t-il permis une lettre de divorce?\""], ["p", "Jésus a dit: \"Il l'a fait à cause de la dureté de votre cœur.\" C'est juste. Mais il n'en était pas ainsi au commencement, il n'en sera jamais ainsi. Dieu l'a fait à cause de la dureté de leur cœur."], ["p", "Mais dans les pays où on pratique la polygamie, les tribunaux de divorce tournent au ralenti. Mais ici où nous essayons de faire et de gouverner ce pays en tant que nation, puisqu'elle est unchrétienne n'en fait pas une nation chrétienne. Et vous ne pouvez pas gouverner le monde avec les lois de Dieu. C'est impossible. Je n'ai rien contre un pécheur qui boit. Je n'ai rien contre un pécheur qui commet l'adultère, rien contre le pécheur qui fait ceci. Mais ce dont je parle c'est de ces gens qui sont censés être des chrétiens et qui font donc cela."], ["p", "Si un cochon veut enfoncer son groin dans un tas de fumier et y manger toute la journée, c'est son travail, au fait c'est un cochon pour commencer. Mais l'agneau ne fait pas cela. Le pécheur, c'est un cochon pour commencer. Mais alors lorsque vous cherchez à faire d'un cochon un agneau, il faut une conversion et il doit entrer dans une atmosphère différente. Et quand il entre dans cette atmosphère, ses désirs changeront et sa nature changera. C'est ce qu'il en est aujourd'hui."], ["rev", "Rev. William Marrion Branham"], ["ref", "61-0211 Abraham"], ["p", "63 Cette nation serait de loin meilleure si elle avait–si elle avait un... Je ferais mieux de ne pas le dire. Très bien. Mais de toute façon, il serait mieux d’avoir trois ou quatre femmes plutôt que... Je préférais me tenir devant Dieu marié avec trois ou cinq femmes à mes côtés, plutôt que de m’y tenir avec une seule femme alors que j’avais couru avec celle d’un autre homme. Oui, oui. J’aurais plus de chance devant Dieu. Vous ne pouvez pas forcer des pécheurs à accomplir des devoirs chrétiens et faire cela; ils ne le peuvent pas sans être nés de nouveau. C’est vrai. Nous sommes loin d’être une nation chrétienne. Comment pouvons-nous ouvrir chaque débit de boisson qu’il y a au coin et faire tourner des choses comme nous les faisons, puis nous dire chrétiens? Ce n’est pas chrétien, pas plus qu’un cochon n’en sait au sujet d’une selle de dame. Eh bien, vous ne pouvez pas appeler cela le christianisme. Nous ne sommes pas une nation chrétienne, absolument pas. Il y a des chrétiens dans cette nation, mais celle-ci n’est pas une nation chrétienne. Je remercie Dieu pour des chrétiens qui sont ici. «Ceux qui me disent: Seigneur, Seigneur, n’entreront pas tous, mais celui-là qui fait la volonté de mon Père qui est dans les cieux.» C’est celui-là qui entrera."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "MINISTRE", "i": [["bib", "Esaie 6 :7"], ["ref", "62-1013 L’influence d’un autre"], ["p", "72 Et je leur ai dit : “Frères, il y a quelque chose qui ne va pas. Vous êtes des hommes d’affaires. Premièrement, vous ne comprenez pas l’approche. Vous ne comprenez pas l’approche du ministère, parce que le ministère est un don dépendant d’un appel de Dieu.” “Dieu a placé dans l’Église premièrement des apôtres, puis des prophètes, des docteurs, des évangélistes, des pasteurs.” Dieu les a placés là, pour le perfectionnement de l’Église. Les hommes d’affaires devraient témoigner. Les femmes, les ménagères, peu importe si vous êtes la bonne chez quelqu’un, témoignez. Faites tout ce que vous pouvez pour le Royaume ; mais n’injectez jamais vos propres idées ; dites simplement ce que dit le Message et allez de l’avant (voyez-vous ?), et alors vous aurez peut-être de l’influence. Maintenant, n’essayez pas de prêcher, avant de savoir que Dieu vous a appelés. Restez avec votre témoignage, parce que, si vous ne le faites pas, vous irez dans la mauvaise catégorie ; et alors, vous gâcherez tout. C’est ainsi. Et cela ne plaît pas du tout à Dieu. Ceci le démontre."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>60-0302 Dès ce moment<\/b>"], ["p", "29 Oh ! j’aimerais voir les prédicateurs à ce sujet juste une minute. Voyez-vous, mes frères ? Mes frères baptistes, méthodistes, presbytériens, pentecôtistes, qui que vous soyez, vous pouvez avoir un appel de Dieu dans votre vie ; il se peut que vous sachiez que vous êtes appelé au ministère, mais vous n’avez aucun droit de prêcher l’Evangile avant que vous ayez eu l’expérience de la nouvelle naissance avec Dieu."], ["p", "Jésus a dit aux disciples : «Attendez dans la ville de Jérusalem jusqu’à ce que vous soyez revêtus de la puissance d’En Haut.»"], ["p", "Moïse ne pouvait pas aller délivrer les enfants d’Israël avant d’avoir premièrement rencontré Dieu face à face et qu’il Lui ait parlé. Pourquoi ? Moïse pouvait dire : «J’ai appris toute la sagesse des Egyptiens, mais un jour,  j’étais en train de paître les brebis de mon beau-père derrière le désert et j’ai vu un buisson ardent.» Et dès ce moment, il devint un homme différent. Il ne se fiait plus à son intellectualisme. Il fuyait l’Egypte où Dieu l’avait appelé. Mais aussitôt qu’il a rencontré Dieu, il a pris un mulet, et sa femme ainsi que son fils, et un vieux petit bâton crochu, et il est descendu en Egypte. Eh bien, il avait rencontré Dieu et, dès ce moment-là, il était changé. Il y avait quelque chose de différent. Il avait perdu son intellectualisme. Il ne pensait pas au danger. Eh bien, il avait rencontré Dieu et il pouvait se référer à ce moment-là."], ["p", "30 Personne n’a le droit de prêcher l’Evangile ; personne n’a le droit de se dire chrétien avant d’être en mesure de se référer à un moment de sa vie où il a pu se tenir sur le sable sacré, là derrière le désert où il sait qu’il a rencontré Dieu. Tous les incroyants du monde, tous ces géants intellectuels qui prennent la Bible et donnent des justifications pour réfuter complètement les jours des miracles : «C’est du passé. La guérison divine n’existe pas, toutes ces histoires comme le parler en langues, l’interprétation des langues, le don de guérison et le baptême du Saint-Esprit.» Ils peuvent s’infiltrer, s’emparer de votre esprit et vous embrouiller au point qu’ils peuvent ôter cela de votre mémoire. Ils peuvent vous en dissuader."], ["p", "Je voudrais que vous saisissiez ceci, et ne laissez jamais cela vous échapper. Mais si jamais un homme s’est tenu sur le sable sacré derrière le désert, quand il rencontre Dieu face à face, il n’y a pas assez de démons dans tout l’enfer qui puissent lui ôter cela. Il sait qu’il a rencontré Dieu. Il sait qu’il a eu une expérience ; il a parlé à Dieu. Peu importe ce qu’est l’opposition, il peut dire : «Dès ce moment-là, quelque chose a changé en moi.»"], ["rev", "Rev. William Marrion Branham"], ["ref", "52-0713A Les premières expériences spirituelles"], ["p", "17 Regardez. Tout au long de la vie, ces choses arrivaient et partaient. Finalement, l’appel de… au ministère. Maintenant, j’aimerais que vous fassiez attention. Avant que je devienne chrétien, que je confesse Jésus-Christ comme mon Sauveur personnel, ce don était là malgré tout. Alors que j’étais un pécheur, un étranger, sans droit de cité auprès de Dieu, ce don était malgré tout là, j’avais des visions malgré tout. Dieu qui est mon Juge, devant Qui je me tiens aujourd’hui, sait que c’est la vérité. Est-ce que j’avais mérité cela ? Absolument pas. La Bible le confirme absolument et soutient que c’est la façon de Dieu de faire les choses : les dons et les appels sont sans repentir."], ["p", "Puis, quand quelqu’un m’a parlé de Jésus et de Son amour pour moi, j’ai alors réalisé que j’étais un pécheur, un étranger à Dieu, je L’ai accepté comme mon Sauveur personnel. Et puis, Dieu m’a conduit auprès des gens qui m’ont enseigné les Ecritures, et j’ai reçu le baptême du Saint-Esprit. Puis, cela a commencé à m’arriver tout le temps."], ["p", "J’ai consulté les membres du clergé. Premièrement, quand j’étais ordonné dans l’Eglise Baptiste Missionnaire, savez-vous ce qu’ils m’ont dit ? Eh bien, il… Tenez, j’aimerais que vous saisissiez ceci. Combien m’aiment ? Levez la main maintenant pour montrer que vous allez me croire. Je souhaite que vous le fassiez tous. Je vais vous dire quelque chose ici que je ne dis pas aux gens en public. Mais j’aimerais que vous sachiez ceci. Ils…"], ["p", "J’ai parlé aux membres du clergé, j’ai dit : «Eh bien, il se passe quelque chose dans ma vie.» J’ai dit : «Depuis que je lis la Bible, pensez-vous que c’est quelque chose de Dieu ?» J’ai dit : «Il y a… J’ai–j’ai des visions, et–et des choses qu’on raconte, différentes choses prédisant cette inondation, alors que je me tenais là sur le mur, depuis que j’étais…»"], ["p", "J’étais alors devenu un chrétien, un prédicateur baptiste. Je me tenais là, j’ai dit : «Eh bien, il va y avoir… J’ai eu une vision, cette rue là-bas serait inondée et le niveau d’eau atteindrait vingt-deux pieds [67 cm] .»"], ["p", "J’ai vu certains des jeunes gens s’avancer, ils ont dit : «Billy est un tout petit peu hors de lui. Il devient trop religieux.» Voyez ?"], ["p", "J’ai parlé aux membres de mon clergé, mes… Les évêques, les pasteurs et autres. Ils ont dit : «Billy, fais attention à ce que tu fais. Le diable est dans cette voie-là.»"], ["p", "J’ai dit : «Oh ! la la !»"], ["p", "«Monsieur, le diable est par là, fais attention. Tu vois, ta mère me dit que tu étais né avec une Lumière au-dessus de toi. Vois-tu, tu es peut-être possédé d’un démon qui se tient près de toi.»"], ["p", "J’ai dit : «Oh ! la la ! Hein !» J’ai dit : «Eh bien, je… Monsieur, voulez-vous prier pour moi ?»"], ["p", "«Oui, nous–nous allons prier pour vous, révérend Branham.»"], ["p", "«Merci, monsieur. Priez pour moi.» Je disais : «Ô Dieu, ô Dieu, un démon près de moi, tiens-le éloigné, Seigneur. Ne le laisse pas s’approcher de moi. Non, je n’aimerais pas avoir des visions ni rien ; je n’aimerais rien voir. J’aimerais simplement étudier la Parole, ici, prier et prêcher la Parole. Je n’aimerais rien de cette histoire. Non !»"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "À QUOI SERT UN DIEU HISTORIQUE", "i": [["p", "18 Bon, remarquez. Et cela a donné à cette petite reine une grande envie de se rendre là-bas pour voir ce qu’il en était. Or, n’oubliez pas, c’était une idolâtre, une païenne. Et pour aller voir ce qu’il en était, car quelque chose dans son cœur commençait à lui dire que ce devait être vrai… Vous voyez, elle était membre d’une église. Et elle avait des prêtres, et – et des évêques et ainsi de suite. Mais dans son église, le tout n’était qu’intellectuel, rien qu’un tas de théologie. Et elle avait appris qu’il y avait un Dieu qui vivait et qui Se manifestait. Ô Dieu, sois miséricordieux."], ["p", "A quoi vous servirait un  »ieu historique, s’Il n’est pas le même aujourd’hui ? Si le feu de la Pentecôte n’est pas aussi bienfaisant aujourd’hui qu’il l’était autrefois, à quoi bon en parler ? Qu’arriverait-il si un homme mourait de froid et que vous lui peigniez un feu et que vous lui disiez que ce feu brûlait autrefois ? Cela ne le réchaufferait pas. Il n’a pas besoin de la peinture d’un feu historique ; puisqu’il gèle, il lui faut un feu qui brûle. Et si… les gens qui lisent la Bible n’ont pas besoin d’une chose telle qu’un Dieu qui a vécu à une époque révolue. Ayons un Dieu actuel, qui est exactement ce qu’Il était autrefois. Nous avons besoin d’un Dieu qui est au temps présent."], ["p", "A quoi bon prêcher la Bible si Dieu est muet et qu’Il ne satisfait pas à Sa promesse ? A quoi bon donner des vitamines B à votre canari, des vitamines A pour que ses ailes soient fortes, et le garder tout le temps dans une cage ? Vous ne le relâchez pas. A quoi servent vos vitamines ? A quoi servent tous nos séminaires, nos écoles de théologie et nos grands prédicateurs qui ont des doctorats en théologie, des doctorats d’Etat et des doctorats en droit ? A quoi ça sert, s’il ne s’agit que d’un Dieu historique qui ne vit pas et n’agit pas de la même manière aujourd’hui, comme ils enseignent ce qui était arrivé ? La Bible dit qu’Il est le même hier, aujourd’hui et éternellement. Il n’est pas mort ; Il est ressuscité des morts et est vivant pour toujours, Il est présent pour toujours, Il est pour toujours omniprésent. C’est de ce Dieu là qu’on veut entendre parler. C’est le Dieu dont tout fils d’Abraham véritablement élu veut entendre parler et au sujet Duquel il veut apprendre quelque chose."], ["p", "19 Quand j’ai débarqué en Inde, l’évêque de l’Eglise méthodiste et beaucoup d’autres nous ont accueillis, quelqu’un a dit : « Frère Branham, ne venez pas ici en tant que missionnaire. Nous connaissons la Bible mieux que vous les Yankees ne la connaîtrez jamais. » Et c’est vrai. C’est un Livre oriental. Nous, nous essayons de La comprendre avec une instruction occidentale. Il a dit : « Mais nous avons appris que Dieu vous a visités, vous les Yankees, avec un don qui rend Dieu réel et qui fait revivre Sa Bible. Voilà ce que nous voulons voir.\" C'est quand des dizaines et des dizaines de milliers de gens sont venues à Christ en une seule fois. Ils veulent une réalité vivante."], ["p", "Si Dieu était si grand dans un autre âge, pourquoi n’est-Il plus le même ce soir ? A quoi sert-Il s’Il est de l’histoire et pas du présent ?"], ["ref", "58-0517<sup>E<\/sup> Le Péché D’Incrédulité"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "RENOUVELLEMENT DES VŒUX DE MARIAGE", "i": [["ref", "<b>64-0415 Christ identifié le même dans toutes les générations<\/b>"], ["p", "74 Une fois, je–je remariais un vieux couple. Ils renouvelaient leurs voeux. L’un avait quatre-vingt-trois ans et l’autre, quatre-vingt-quatre. Et je leur ai fait faire un voeu. Et je–j’avais perdu la tête, comme je n’étais juste qu’un jeune homme, cherchant à... Un vieil homme qui était marié depuis environ soixante ans, sa femme et lui, ils se donnaient des voeux. Et ils s’aimaient tout aussi bien qu’autrefois."], ["p", "75 Et l’homme partait une longue barbe. Et je lui ai dit... J’ai dit à la femme, j’ai dit: «Qu’en pensez-vous?» Eh bien, j’avais d’abord posé la question à l’homme. J’ai dit: «Qu’en pensez-vous? Pourquoi portez-vous une longue barbe?»"], ["p", "76 Il a dit: «Je pense qu’un vieil homme de mon âge devrait porter une longue barbe.»"], ["p", "J’ai demandé à la femme: «Qu’en pensez-vous?»"], ["p", "Elle a dit: «Eh bien, a-t-elle dit, tout ce que John fait est bien.»"], ["p", "77 Alors, et–et j’ai dit: «Eh bien, il y a un grand changement en vous depuis que vous l’avez épousée.»"], ["p", "78 Il a dit: «Vous savez, le Seigneur a été bon.» Il a dit: «Elle est tout aussi jolie qu’autrefois.» Il a dit: «Plus elle prend de l’âge, plus ma vue s’affaiblit.»"], ["p", "79 Je–je me suis donc dit que c’était–que c’était vraiment chouette. J’espère que c’est ce que pense ma femme. Je suis sûr que nous pensons tous de même à ce sujet. Donc... mais ils–ils avaient trouvé la vie. Ils ont découvert comment la vivre, voyez."], ["p", "80 Ce n’est pas ce que nous disons: «Nous aimerions tous rajeunir, nous les plus âgés, revenir à seize ans, ou dix-huit ans, vingt ans, ou quelque chose comme cela.»"], ["p", "81 Mais rappelez-vous que nous avons grandi et nous avons vécu jusqu’à cet âge-là. Et alors, pourquoi, tout en prenant la même nourriture, nous mourons maintenant, alors que tout cela forme les cellules de sang exactement de la même façon? La science ne peut pas le prouver. C’est un rendez-vous avec Dieu. Lorsque vous avez atteint cet âge-là, Dieu a dit: «C’est ce que je veux maintenant.» La mort s’y installe."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu paie pour tout ce qu’on a fait pour lui", "i": [["bib", "<b>Heb 6 :10<\/b>"], ["bib", "<b>Jean 15 :16 <\/b><i>c’est Dieu qui nous a choisit<\/i>"], ["bib", "<b>Marc <\/b>"], ["bib", "<b>Jean 21 : 3 :16<\/b>"]]}, {"t": "C’EST DIEU QUI NOUS A CHERCHÉS", "i": [["bib", "<b>Jean 15 :16-17<\/b>"], ["v", "<b>88 Eh bien, quelle sera donc la chose suivante pour l’église ? S’Il… cela était le dernier signe qu’Il avait donné à Abraham avant que le feu tombât et détruisît la méchanceté, qu’en sera-t-il alors pour sa postérité ? La même chose. C’est la même chose qu’Il a faite. Qu’avait-Il fait ? Il l’a appelé, et lui a donné une alliance.<\/b>"], ["p", "<b>Qui vous a appelé ? Certains disaient : «J’ai vraiment cherché Dieu et cherché Dieu.» Vous ne L’avez jamais cherché. Personne d’autre ne l’a jamais fait. C’est Dieu qui cherche l’homme, ce n’est pas l’homme qui cherche Dieu. Aucun homme ne cherche Dieu. C’est Dieu qui cherche l’homme. Cela a été prouvé dans le jardin d’Eden ; au lieu de confesser, l’homme s’est caché. C’était Dieu qui le cherchait.<\/b>"], ["p", "<b>Et autre chose, l’avez-vous remarqué ? Dieu n’a jamais envoyé un ange chercher Son enfant perdu. Il est venu Lui-même. C’est pourquoi Jésus a été créé, Dieu fait chair parmi nous. Dieu Lui-même est venu racheter Son enfant. C’était un homme créé… C’était le travail pour l’homme, personne ne pouvait le faire à part Lui. Il est donc venu racheter Son propre enfant. C’est pourquoi Jéhovah a été fait chair dans Son propre Fils, pour mourir pour le péché qui a été placé sur Lui afin de racheter le pécheur.<\/b>"], ["ref", "<b>61-0312 Jéhovah-Jiré<\/b>"], ["rev", "<b>Rev. William Marrion BranhamJéhovah-Jiré 22/2/1955 <\/b>"], ["p", "25 Retournons maintenant à notre texte de «Jéhovah-Jiré : L’Eternel se pourvoira d’un sacrifice»."], ["p", "Abraham, j’aime vraiment parler d’Abraham, parce que c’est à Abraham que l’alliance a été faite. La promesse a été faite à Abraham, et pas seulement à Abraham, mais à sa postérité après lui. Pas ses postérités, car il avait plusieurs fils, mais à une seule postérité, celle qui est venue par Isaac. Par Isaac vint Christ. Etant morts en Christ, nous devenons la postérité d’Abraham, et nous sommes héritiers selon la promesse."], ["p", "Et je crois raisonnablement que je peux prouver par la Bible, que la postérité d’Abraham, ce sont ceux qui sont nés de nouveau de l’Esprit de Jésus-Christ, parce que Christ vit dans le croyant. C’est vrai. Vous avez la semence d’Abraham lorsque vous avez le Saint-Esprit. C’est vrai. C’est à travers cette promesse-là."], ["p", "Et maintenant, cette promesse n’a pas été faite ou plutôt ne vous a pas été donnée à cause de votre bonté ; c’est l’élection et l’appel de Dieu qui vous ont conduit à cela, vous n’avez rien fait pour mériter cela.<b><i> Vous n’avez jamais cherché Dieu ; c’est Dieu qui vous a cherché et qui vous l’a donné sur base de la grâce souveraine, il n’y a rien au monde que vous puissiez faire, rien que vous puissiez faire à ce suje<\/i><\/b>t."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>55-1116 L’Appel d’Abraham<\/b>"], ["p", "17 Eh bien, ça c’est la toile de fond, c’est une bonne toile de fond pour ce que nous allons dire pendant un moment sur Abraham. Or, au commencement, au jardin d’Eden, Dieu avait fait une alliance entre Lui et Adam. Et Adam a brisé Son alliance. Eh bien, l’homme brise toujours son alliance avec Dieu, mais Dieu ne brise jamais Son alliance avec l’homme."], ["p", "Alors Dieu ayant vu ce qui allait arriver, Il a donc fait cette alliance. Après que le monde eut commencé à se multiplier, et qu’il fut plein de méchanceté et tout. Et les gens sont allés à Babylone, et–et la première fois qu’on a commencé à parler de l’adoration des idoles, c’était à Babylone. Dieu cherchait dans tous les pays, pour essayer de trouver quelqu’un qui allait–qui était sincère, quelqu’un qu’Il pouvait bénir, parmi tous les hommes qu’il y avait dans le pays, Dieu, par une élection souveraine a choisi Abraham."], ["p", "Combien de chrétiens y a-t-il ici ce soir? Faites voir votre main. Eh bien, je crois que c’est presque cent pour cent. C’est bien. Cent pour cent de chrétiens, alors j’aimerais vous dire quelque chose. Ce n’est pas très facile de le dire devant les pécheurs. Savez-vous pourquoi vous êtes un chrétien? C’est parce que Dieu vous a appelé. Vous n’avez jamais cherché Dieu à quelque moment que ce soit. Non, non. C’est Dieu qui vous a cherché. Nul homme, à aucun moment, n’a cherché Dieu. C’est Dieu qui a cherché l’homme."], ["p", "«Nul ne peut venir à Moi, a dit Jésus, si Mon Père ne l’attire premièrement.» C’est la tendance même depuis le jardin d’Eden, au lieu que le pécheur déchu essaie de trouver Dieu, c’est Dieu qui essaie de trouver le pécheur déchu, et depuis cela a toujours été ainsi."], ["rev", "Rev. William Marrion Branham"], ["p", "<b>LA FOI<\/b>"], ["ref", "54-0320 La Foi Vient De Ce Qu’on Entend"], ["p", "27 Eh bien, l’espérance s’accordera avec la Bible. L’espérance dira : «C’est vrai.» L’espérance dira : «Je crois chaque portion de la Bible. Je crois que c’est la Parole de Dieu. Et je – je – je crois que Dieu tiendra Sa promesse.» L’espérance croit tout cela. Mais ensuite l’espérance dira : «Eh bien, je crois que Dieu guérira, mais regardez mon état.»"], ["p", "Or, la foi ne regarde pas à cela. La foi s’avancera là et dira : «Peu m’importe la maladie. Dieu l’a dit, et la chose m’appartient.» Vous voyez ? La foi est musclée. C’est comme je l’avais dit une fois : «La foi a une poitrine velue. Quand elle se lève et qu’elle gonfle ses grands muscles, toute autre chose disparaît.» Ça prend simplement fuite, ça s’envole. Quand la foi prend vraiment position, rien d’autre ne peut tenir."], ["p", "28 Je vous assure, la foi… Toutefois, vous devez avoir l’espérance et l’amour. Si vous avez une véritable foi musclée sans l’amour qui l’accompagne, vous allez ruiner votre influence auprès des gens (si ce n’est pas mélangé avec l’amour), voyez-vous ? Vous avez vu des gens qui ont une foi très musclée, ce que nous appellerions (pardonnez-moi l’expression) une foi de bouledogue, pour prendre position, mais qui sont rudes avec cela. Alors on voit que quand on agit ainsi, il n’y a pas – il n’y a pas d’affection pour opérer avec cela. Ainsi, ce dont nous avons besoin, c’est de l’espérance, de la foi et de l’amour. N’est-ce pas vrai ? L’espérance, la foi, et l’amour, ensemble. Que Dieu aide notre église afin que les gens puissent avoir ces choses, avoir cette combinaison."], ["p", "29 Mais si vous ne comptez que sur l’espérance, vous entravez la foi. Eh bien, l’espérance regarde à quelque chose qui est loin. Mais la foi la réclame à l’instant même. Voyez-vous ? La foi dit : «Dieu l’a dit et ça m’appartient.» Ça règle la question. Voyez-vous ? «Peu m’importe que je sois encore estropié, que je sois encore aveugle, que je sois encore malade, ça n’a rien à faire avec la chose. Je le crois de toute façon. Ça m’appartient maintenant même. Dieu l’a dit, et ça règle la question.» Voyez-vous ? C’est ça la foi."], ["p", "Mais l’espérance dira : «Dieu l’a dit, et je m’attends à recevoir la chose un jour.» Vous voyez ? «Je m’attends à recevoir cela un jour.» Et tant que le diable peut renvoyer la chose pour un autre jour pour vous, c’est tout ce qu’il veut. C’est vrai. Vous ne l’aurez jamais. Croyez simplement que vous l’avez reçue à l’instant même – c’est votre propriété personnelle.» La foi est une ferme assurance des choses qu’on espère, une démonstration de celles qu’on ne voit pas.» Est-ce vrai ? La foi agit sur-le-champ. Elle est positive. Il n’y a pas … Oh ! la la ! Je vous assure, la maladie et toute autre chose, lorsque la foi entre en action, c’est juste comme une boule de neige sur un fourneau chaud. Elle se dissout simplement. Toute autre chose s’enfuit devant la foi, parce que la foi se tient debout et elle domine. Quand la foi parle, toute autre personne reste tranquille. C’est vrai."], ["p", "30 Ces pauvres petites maladies, qui tournent tout autour comme ceci, ces vieilles petites choses qui se racontent : «Eh bien, les jours des miracles sont passés», ceci ou cela. Mais laissez simplement la foi entrer une fois en scène, qu’elle gonfle ses muscles, et dise : «Je prendrai le contrôle.» Je vous assure, toutes les autres choses se tiennent tranquilles quand la foi entre en scène. C’est l’ami avec qui nous voulons traiter. Est-ce vrai ?"], ["p", "Maintenant, comment obtenons-nous la foi ? La foi vient de ce qu’on entend, de ce qu’on entend quoi ? La Parole de Dieu. Eh bien, c’est vrai. Vous ne pouvez pas la baser sur rien d’autre que la Parole de Dieu. Elle doit avoir … Maintenant, vous ne pouvez pas avoir la foi, et dire : «Oh ! eh bien, si vous allez là-bas et que vous touchiez telle chose, ça vous guérira. Eh bien, ou toucher la radio, ou toucher ceci ou cela.» Je – je ne peux pas suivre cela. Non, non. Je dois avoir, en fait, quelque chose de solide, et qui… La chose la plus solide que je connaisse, c’est la Parole de Dieu."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "EFFORÇONS-NOUS D’Y ENTRER, NOUS N’AVONS PAS ICI-BAS DE CITÉ PERMANENTE", "i": [["ref", "<b>65-0829 L’Éden de Satan<\/b>"], ["p", "104 Là, Dieu sera avec Ses attributs véritables, Ses fils et Ses filles, là Il pourra communier avec eux dans la sainteté, leurs yeux aveugles à tout péché. Dès lors, il n’y aura plus jamais de péché."], ["p", "Faisons tous nos efforts ; ne soyez pas séduits en ce jour-ci, mais efforcez-vous d’entrer par la porte."], ["p", "Car tous ceux qui seront laissés dehors seront impudiques, convoiteurs. « Quiconque regarde une femme pour la convoiter a déjà commis un adultère avec elle. » Tous ceux… dehors seront les femmes de mauvaise vie, les hommes de mauvaise vie, et tout."], ["p", "Et seuls ceux qui sont rachetés et qui se trouvent dans le Livre de Vie de l’Agneau entreront par la porte. Alors, efforcez-vous, mes amis ; ne soyez pas séduits en ce dernier jour."], ["p", "105 C’est un temps merveilleux. Tout le monde a de l’argent. Tout le monde peut faire ceci, et tout le monde peut faire cela. L’argent qui rentre de partout, et les grosses voitures, et tout. Il n’y en aura pas une seule de ces choses dans cette Ville-là. Il n’y aura pas une seule voiture, pas un seul avion. Non. Ce sera une civilisation complètement différente. Ce sera de nouveau une civilisation basée, non pas sur la connaissance, non pas sur la science, mais une civilisation d’innocence et de foi dans le Dieu vivant."], ["p", "106 Efforçons-nous d’Y entrer. En effet, mon seul but, c’est d’entrer un jour dans cette Ville. Et, de me retourner tout simplement, vous voir venir avec moi, chacun de vous marchant au pas, alors que nous chanterons «  Quand les saints entreront. Je veux être du nombre, quand les saints entreront. « "], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LA FÊTE DES TROMPETTES ET LE MILLÉNIUM", "i": [["ref", "<b>65-0829 L’Éden de Satan<\/b>"], ["p", "99 Souvenez-vous, il n’y a pas longtemps, je vous ai apporté un enseignement sur les Sept Trompettes, la fête des trompettes, et tout. Et j’ai dit : «  Il y a une fête du huitième jour. «  Alors le septième jour va être le dernier, ça sera le Millénium. Mais il y a la fête du huitième jour ; et si c’est le huitième jour, comme il n’y a que sept jours, on se retrouverait de nouveau au premier jour, on reviendrait au premier jour. Alors, une fois le Millénium terminé, alors il y aura de nouveau un Eden qui sera établi. Le grand Royaume de Dieu aura été repris. En effet, Jésus a lutté jusqu’au bout contre Satan, dans le jardin de Gethsémané, et Il a récupéré l’Eden ; c’est ce qu’Il est parti préparer dans le Ciel, pour revenir ensuite."], ["p", "100 Là au Ciel… Il a dit : «  Que votre cœur ne se trouble point. »  Quand Il était ici sur terre, Il a dit : «  Vous – vous, les Juifs, vous avez cru en Dieu. Bon, Je sais que J’ai mauvaise réputation, a-t-Il dit. Et ils Me traitent de ceci et de cela. Mais vous avez cru en Dieu ; et comme vous avez cru en Dieu, croyez aussi en Moi. « "], ["p", "101 Il était Dieu manifesté. Voyez ? «  Croyez aussi… Dans la maison de Mon Père, il y a plusieurs… «  Ou «  Dans l’économie de Mon Père, dans le plan de Mon Père, il y a plusieurs palais. Je vais aller préparer une place. » Regardez quelles en sont les dimensions, quinze cents miles carrés [3885 km² - N.D.T.] ! «  Dites donc, où est-elle ? «  Il est parti la préparer. Il est le Créateur. Il crée tout cet or. Les rues sont transparentes. Il est le Créateur. Il prépare un endroit."], ["p", "102 Dans Apocalypse 21, il a dit : «  Et moi, Jean, je vis descendre du Ciel, d’auprès de Dieu, la Ville sainte, la Nouvelle Jérusalem. «  La mer n’était plus ; le premier ciel et la première terre avaient disparu."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LE REND LE PLUS ÉLEVÉ", "i": [["ref", "<b>63-1114 L’influence<\/b>"], ["p", "40 Il n’y a pas de grands parmi nous. Nous sommes–nous sommes tous juste des enfants de Dieu, vous voyez, même si Dieu a fait de certains parmi nous une chose, et des autres une autre. Eh bien, Il m’a créé avec un doigt, un oeil et autres. Eh bien, nous devons nous apprécier les uns les autres et, alors, ne pas essayer de nous sentir grands. En effet, nous sommes tous rattachés à un seul Dieu, voyez, et nous descendons tous d’un seul arbre. Voyez?"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DANIEL CURRY", "i": [["ref", "<b>56-0805 L’Église et sa condition<\/b>"], ["p", "116 Il y a quelque temps, oh! environ cent ans, il y avait un fervent chrétien qui vivait dans le sud-ouest des Etats-Unis. Il s'appelait Daniel Curry, c'était un homme admirable, un homme pieux, sanctifié, un véritable chrétien, un homme que  tout le monde estimait beaucoup, quelqu'un de merveilleux. Et on raconte qu'il mourut ou entra en transe, et il dit... Et quand il arriva à la porte des perles, le gardien vint à la porte et dit: \" Qui es-tu? \""], ["p", "117 Il répondit: \" Je suis l'évangéliste Daniel Curry; j'ai gagné des milliers d'âmes à Christ. Et je suis...  je désire entrer ce matin. Le voyage de ma vie sur terre est terminé. Je n'ai pas d'endroit où aller maintenant. \""], ["p", "118 C'est ainsi que les choses se passeront pour toi l'un de ces matins, pécheur. C'est ainsi que cela t'arrivera, rétrograde. C'est ainsi que cela vous arrivera, à  vous qui avez attristé et éloigné le Saint-Esprit n'étant plus doux ni tendre. Cela fait des années que vous n'avez pas pleuré. Vous n'avez pas rougi depuis je ne  sais combien de temps, et toute modestie vous a quitté. Certainement. Mais  cela va venir à votre porte un de ces matins. Et alors que le doux Saint-Esprit vient frapper, pourquoi ne Le laissez-vous pas simplement entrer?"], ["p", "119 Donc, quand Daniel Curry arriva là à-à-à la porte, le gardien vint et dit: \" Nous allons voir si  votre nom figure ici. \" Il chercha partout et ne put trouver de nom. Il dit: \" Non, il n'y a pas de Daniel Curry ici. \""], ["p", "120 \" Oh! a-t-il dit, si! Je suis un évangéliste! \" Il a dit: \" J'ai gagné des âmes à Christ!  \" Il a dit: \" J'ai essayé de faire ce qui est juste! \""], ["p", "121 Le gardien  dit: \" Monsieur, je suis désolé de  vous le dire, mais il n'y a pas de Daniel Curry ici.\" Il a dit: \" Je vais vous  dire ce que vous pouvez faire. \" Il a dit: \" Nous n'avons pas le droit ici de nous occuper de votre cas. \" Il a dit:  \"Mais voudriez-vous faire appel pour votre cas? Vous pouvez faire  Jugement du Trône blanc, si  vous le désirez, mais, dit-il, nous ne pouvons pas du tout vous faire miséricorde ici, parce que nous n'avons pas votre nom. Il n'y a pas de miséricorde pour vous. \" Il a demandé: \" Voudriez-vous faire appel pour votre cas? \""], ["p", "Il a dit: \" Monsieur, que puis-je faire d'autre  que de f aire  appel pour mon cas? \""], ["p", "122 Le gardien a répondu: \" Eh bien, alors, vous pouvez aller au Jugement du Trône blanc et faire là appel pour votre cas. \""], ["p", "123 Daniel Curry  dit qu'il se sentit voyager à travers l'espace pendant environ une heure. Il dit qu'il arriva à un endroit où cela devenait de plus en plus clair, plus clair, plus clair, plus clair. Il dit que plus il avançait, plus clair ça devenait. C'était cent fois, des milliers de fois plus brillant  que le soleil l'ait jamais été. Il dit qu'il tremblait, tremblait. Puis, il dit qu'une fois arrivé dans cette Lumière, il entendit une Voix demander: \" Etais-tu parfait sur terre? \" (Cela sortait directement de-de la Lumière)."], ["p", "Il répondit: \" Non, je n'étais pas parfait. \" (Il tremblait.)"], ["p", "Il dit: \" As-tu toujours usé d'honnêteté envers tout le monde? \""], ["p", "124 Il répondit: \" Non. ( Il me vint à l'esprit quantité de choses pour lesquelles je n'étais pas tout à fait honnête.) Non, ajouta-t-il, je-je-je pense que je n'étais pas honnête. \""], ["p", "La Voix demanda: \" As-tu dit la vérité dans chaque situation? \""], ["p", "125 Il répondit: \" Non. Je me rappelle que j'ai dit certaines choses qui n'étaient pas douteuses... qui étaient douteuses.  Je-je-je n'ai jamais été tout à fait honnête. \""], ["p", "126 La Voix demanda: \" Alors, as-tu jamais pris quelque chose qui ne t'appartenait pas? Une certaine chose? De l'argent? Ou autre chose qui ne t'appartenait pas? \""], ["p", "127 Il dit qu'il pensait avoir été assez bon sur terre, mais il était condamné. Il repondit: \" Non, non. J'ai pris des choses qui ne m'appartenaient point. \""], ["p", "On lui dit: \" Alors, tu n'étais pas parfait. \""], ["p", "Il répondit: \" Non, je n'étais pas parfait. \""], ["p", "128 Il a dit  qu'il s'attendait à ce que, d'un moment à l'autre, de cette grande Lumière, là où la Colombe se reposait, retentisse comme une explosion le mot \" Condamné! \"  Il a dit qu'en ce moment-là même, il entendit une  Voix derrière lui qui était plus douce que n'importe quelle voix de mère qu'il ait jamais entendue. Il a dit qu'il se retourna  pour voir, et le plus beau visage qu'il eût jamais vu, plus  doux  que n'importe quel visage de mère, se trouvait devant lui. Et Il a dit: \" Père, Daniel Curry a pris position pour Moi sur la terre. Il est vrai qu'il n'était pas parfait, mais il a pris position pour moi. Il a pris position pour Moi sur la terre, et maintenant, Je vais prendre position pour lui au Ciel. Prends tous ses péchés et mets-les sur Mon compte. \""], ["p", "129 Qui prendra position pour vous ce jour-là, frère, si vous L'attristez et L'éloignez de vous aujourd'hui? Je ne peux simplement plus prêcher. Inclinons la tête."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "FANATIQUE DE JÉSUS-CHRIST, FRÈRE BEN BRYANT", "i": [["ref", "<b>61-0101 Apocalypse, chapitre quatre, 2e partie<\/b>"], ["p", "108 Un soir qu'il se tenait là, quelqu'un dit quelque chose au sujet de Jésus, combien Il était grand, quelque chose de ce genre, il cria: «Oh, gloire!», en levant les bras et voilà que ses deux poings passèrent ainsi à travers le mur! Il ne s'en était même pas rendu compte! Il avait les poings enfoncés dans le mur. Il dit: «Frère Bill, je paierai cela!» Je crois que frère Woods est venu réparer cela, il a remplacé cette partie. Nous ne vous en tenons pas rigueur, Frère Ben, nous - nous sommes vraiment bien contents que vous soyez un fanatique. Vous voyez?"], ["p", "109 Quand le Saint-Esprit fait quelque chose en vous, vous ne pouvez simplement pas rester tranquille, il y a quelque chose qui bouillonne. Amen. Fiou! Oui, quelque chose s'ancre, vous êtes un fanatique de Christ! Quand vous aimez le Seigneur, il y a en vous quelque chose qui cherche, qui s'agrippe, qui a faim et soif. Jésus a dit: «Heureux sont-ils, car ils seront rassasiés.»Ils sont heureux du simple fait d'avoir soif, que vous ayez ou non reçu quelque chose. Combien désirent encore plus de Dieu? Très bien! Bon, du fait même que vous désirez encore plus de Dieu, vous êtes béni, rien que pour ça! Même si vous ne l'avez pas, vous êtes toujours béni! «Heureux ceux qui ont faim et soif.» Vous êtes béni rien que d'avoir faim et soif, car si vous le désirez, vous êtes béni. En effet, beaucoup de gens ne le désirent pas!"], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "QUALITÉS D’UN BON CHRÉTIEN", "i": []}, {"t": "UN BON CHRÉTIEN", "i": [["p", "<b>Se ranger du côté de Jésus 01/06/1962<\/b>"], ["p", "130 Et cette vieille combine n’a jamais cessé. Souvent un ministre pourrait faire une erreur. Et s’il arrive dans un quartier, — un précieux frère qui essaie de faire ce qui est bien et de conduire les gens dans le droit chemin, — tout ce que le diable peut montrer à l’incroyant ou au soi-disant Chrétien dans ce quartier, afin de jeter le discrédit sur cet homme, il le fera."], ["p", "Vous savez, le vrai comportement chrétien, c’est de cacher tout ce qu’on peut à propos d’un frère. Ne parlez pas de ses mauvaises actions. Parlez seulement de ses bonnes actions. Parlez seulement des bonnes choses que vous savez sur lui. S’il y a quelque chose de mauvais, laissez ça de côté. Le pauvre homme a déjà suffisamment de problèmes. N’essayez pas de prendre une perche pour enfoncer un homme plus profondément dans le fossé. L’attitude chrétienne, c’est de le relever et de le sortir du fossé. Voyez ? N’essayez jamais de le pousser par terre. Il est déjà à terre. Essayez de l’aider à se relever. Et, mais trop d’entre nous aujourd’hui, trop de gens aujourd’hui, devrais-je dire, essaient de faire ça : pourvu qu’ils arrivent à trouver quelque chose qu’ils pourront dire, quelque chose de vraiment mauvais."], ["rev", "<b>Rev. William Marrion Branham<\/b>"], ["ref", "<b>59-1001 Qu’êtes-vous allés voir ?<\/b>"], ["p", "3 Eh bien, si nous examinons la chose, il est difficile qu’au cours de la journée il ne se passe une heure où nous ne faisons pas quelque chose de faux. Et il n’y a donc pas de petites fautes ou de grandes, toutes sont grandes devant Dieu. Si donc l’apôtre Paul devait mourir chaque jour, combien plus devons-nous mourir chaque jour. Voyez ? Et alors, je pense que si une personne a fait quelque chose de mal et qu’elle est disposée à mettre cela en ordre, la vraie attitude chrétienne, c’est de lui pardonner."], ["p", "Et je pense, Frère Graham, que c’est là que les membres d’église aujourd’hui loupent vraiment la chose. Au lieu d’essayer de relever cette personne, ils continuent à l’enfoncer de plus en plus. Voyez ? C’est un… Voyez, Christ, alors que nous étions les plus vils, Il s’est abaissé et nous a pris. Et ainsi, cela montre combien nous devrions aussi avoir ce genre d’Esprit."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>(65-0418<\/b><b><sup>E<\/sup><\/b><b> Dieu Change-t-Il De Pensée Au Sujet De Sa Parole ?)<\/b>"], ["p", "E-33  Combien ici connaissent frère Ben ? Combien croient qu’il est un serviteur de Dieu, [L’assemblée répond : « Amen ». – N.D.E.] digne de cette bénédiction que nous allons demander à Dieu pour lui ? Vous voyez, ce n’est pas un étranger ; cela fait des années et des années qu’il est avec nous. J<b><i>e le connais comme un homme humble. Il est comme moi, il commet beaucoup de fautes. Nous en commettons tous. Mais ce que j’apprécie chez frère Ben, c’est qu’il est disposé à se traîner à genoux pour réparer cela. <\/i><\/b>L’autre jour, quand il a entendu la prédication sur Le mariage et le divorce… Lui et sa femme étaient prêts à se séparer ; en effet, il l’aime et elle aussi ; mais ils veulent être en accord avec la Parole de Dieu. Ce qu’ils voulaient, c’est tout ce que dit la Parole. Je prie Dieu de bénir Ben et sa femme dans Son service. Imposons les mains à notre frère."]]}, {"t": "UN DIVORCÉ PEUT PRÊCHER", "i": [["ref", "<b>(61-0101 Apocalypse Chapitre Quatre #2 (Les Vingt-Quatre Anciens ))<\/b>"], ["p", " E-107  J'espère que cet homme va me pardonner. Il est assis ici tout près. Cet homme de très grande taille, aux cheveux noirs qui est assis ici, un soir, il se tenait dans le hall d'entrée. Quelqu'un lui a dit quelque chose comme pour l'aider, vous comprenez, comme une parole de bénédiction. Et le pauvre homme passait par des moments difficile. A ce que je sache, sa - sa femme l'avait quitté et lui demandait le divorce parce qu'il aime le Seigneur Jésus! C'est vrai! Et quelqu'un avait dit quelque chose au sujet de Jésus; vous savez, il était pour ainsi dire l'un de ces fanatiques. Cet homme avait été à la guerre et en était revenu avec des blessures de balles un peu partout, il en avait partout; j'éprouvais de la peine pour lui. Il rentra à la maison avec un... sa femme et ses enfants. Puis il - il promit au Seigneur de Le servir, et dès que le Seigneur commença à le bénir et que lui-même se mit en règle avec Dieu, sa femme se détourna de lui, demanda le divorce et le quitta; elle l'abandonna brusquement. Mais il étit toujours fanatique!"], ["ref", "<b>.(65-1128M Le Seul Lieu D’adoration Auquel Dieu A Pourvu)<\/b>"], ["p", " E-243  Ben, oh! Il faut que je - je le fasse pour toi...?... Que Dieu vous bénisse! Merci, Frère Ben! Je vous aime, Frère Ben!(65-1128M Le Seul Lieu D'adoration Auquel Dieu A Pourvu)"], ["p", "E-244  Si vous saviez ce que ce jeune homme a souffert pour nous dans cette guerre! Il a été criblé de balles, blessé à mort, et toutes sortes de choses. Il en a vu de toutes les couleurs dans sa vie, mais Dieu l'a béni. Il est resté fidèle. Sa femme l'a quitté, s'est enfuie, s'est remariée, et a amené ses enfants. Oh! la la! Je n'aime pas y penser"], ["ref", "<b>(65-0418<\/b><b><sup>E<\/sup><\/b><b> Dieu Change-t-Il De Pensée Au Sujet De Sa Parole ?<\/b>"], ["p", "E-30  [Frère Ben Bryant dit: \"Frère Branham, voudriez-vous m'imposer les mains? Peuvent-ils m'imposer les mains? Je voudrais être ordonné. - N.D.E.] As-tu été ordonné? Je ne savais pas que tu n'avais pas été ordonné.Frère Ben que voici s'est joint à nous. Je crois que cela fait quelque temps qu'il prêche. Cependant, il n'a pas encore été officiellement ordonné (je croyais qu'il l'avait été, c'est pour cela que je l'ai fait venir) ou on ne lui a pas encore imposé les mains ici."]]}, {"t": "POURQUOI DIEU ENVOIE LE MESSAGE ?", "i": [["ref", "<b>64-0816 Prouvant Sa Parole<\/b>"], ["p", "93 Et maintenant, rappelez-vous que le Message du temps de Noé n’était que par la foi et non par des preuves scientifiques. Mais aujourd’hui, le Message est conforme à la Parole de Dieu et prouvé par la science. Élie est venu en premier, accomplissant des miracles, sans jamais prêcher ; il n’allait que de lieu en lieu, accomplissant des miracles. La fois suivante, il est venu sous la forme de Jean-Baptiste, il ne faisait pas de miracles, il ne faisait que prêcher. Et la troisième fois qu’il vient, il fait des miracles et il prêche. Voyez ? Vous voyez comment c’est ? Observez la continuité des Écritures. Nous pourrions passer beaucoup de temps là-dessus, mais nous ne le ferons pas, nous allons l’omettre, car je pense que vous avez compris l’idée."], ["p", "94 Il a agi dans cet âge-là comme Il l’a fait dans tous les âges, et comme Il le fera, exactement comme Il l’a promis. Si Dieu promet quelque chose, alors Il descend et prouve que Sa Parole est vraie. Tous ceux qui ont cru, tous ceux qui ont cru le Message de cet âge-là, sont entrés et ont été sauvés. Il en sera de même dans tous les âges. Tous ceux qui n’ont pas cru le Message et le messager ont péri."], ["p", "95 Et tous ceux qui croient vraiment la Parole de Dieu aujourd’hui seront enlevés. Tous ceux qui ne croient pas la Parole de Dieu vont périr avec le monde, car ils sont du monde, et tout ce qui est du monde doit périr avec le monde. Et tous ceux qui sont sauvés en Dieu doivent être en Dieu, et ils ne peuvent pas périr : “Je leur donnerai la Vie Éternelle et Je les ressusciterai au dernier jour.” Maintenant, quelle consolation pour tout croyant de savoir que lorsque vous êtes en Christ, aussi sûr que Dieu tient Sa Parole et fait périr le monde, Il tient Sa Parole et ressuscite Son peuple et le sauve. Il le prouve."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "TRESSES DE FEMME", "i": [["ref", "<b>64-0823M Questions et réponses #1 VGR<\/b>"], ["p", "<b><i>251. Frère Branham, est-ce que le passage de I Timothée 2.9 signifie qu’une femme ne peut pas tresser ses cheveux ? Est-ce que “broided hair” signifie “cheveux tressés” ?<\/i><\/b>"], ["p", "173 Bon, regardez, sœur, bon, ceci… Je suis—je suis content que celle-là ait suivi l’autre. Je ne l’avais pas placée là exprès, mais c’est vraiment bien qu’elle—qu’elle ait suivi l’autre."], ["p", "Remarquez, les cheveux tressés, dans ce temps-là, c’était le signe d’une femme qui faisait le trottoir ; c’est ce qu’elle faisait, elle tressait ses cheveux. Et Paul a dit aux Chrétiennes : “Or, cette parure, qu’elle ne consiste pas dans les cheveux tressés…” (ou, “broided” et “braid” [en anglais], c’est la même chose) — de tresser leurs cheveux, parce que, comme ça, elles ressemblaient au reste du monde."], ["p", "174 Or, vous n’êtes pas censés ressembler au monde ni agir comme le monde ! Voyez ? Les femmes sont censées être différentes, là. Voyez ? Non, maintenant, les cheveux tressés… Aujourd’hui, les cheveux tressés, c’est joli et c’est bien loin de la mode du monde. Bon, vous voyez les femmes et la façon dont elles arrangent leurs cheveux aujourd’hui… Vous, arrangez vos cheveux n’importe comment, mais ne ressemblez pas au monde, c’est tout ! Voyez ? Ne ressemblez pas ou ne vous habillez pas comme le monde ! Si elles portent des shorts, vous, portez une robe. Si elles—si elles arrangent leurs cheveux tout…si elles les tondent, les coupent, les arrangent de quelque… Vous—vous—vous, laissez les vôtres tranquilles. Voyez ?"], ["p", "175 Pour ce qui est des tresses ; mais les cheveux tressés… La question, c’était : Est-ce que “braided” signifie…“broided” signifie “tressés” ? Oui, c’est ça. Or, dans la rue…"], ["p", "176 Or, j’ai fait des recherches sur les cheveux “tressés”, pour savoir ce que ça voulait dire il y a des années. Voyez ? Les femmes, en fait, les femmes d’autrefois, elles ramenaient simplement leurs cheveux vers l’arrière et elles les attachaient, un peu comme la queue de cheval d’aujourd’hui. Et elles allaient… Elles portaient des robes comme ça, mais les femmes qui faisaient le trottoir, elles, leurs cheveux, elles les tressaient sur leur tête, elles les enroulaient comme ça, et elles y mettaient des fleurs et des choses comme ça ; et ça, c’était en quelque sorte la—la “dévergondée”, dans la rue ; tout comme la dévergondée d’aujourd’hui, nous pouvons voir comment elle s’habille. Je dis dévergondée, parce que, vous le savez, je suis un vieil homme ; et, à mon époque, c’est comme ça qu’on les appelait. Comment est-ce qu’on les appelle aujourd’hui ? Je… Oh, je ne sais pas. Des poulettes, ou quelque chose comme ça. Alors… Peu importe. Donnez-leur n’importe quel nom, elles aiment ça."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>54-0103<\/b><b><sup>E<\/sup><\/b><b> Questions et réponses #2<\/b>"], ["p", "127 Je sais que nous, les dames, aujourd’hui, ou, que vous les dames, plutôt, vous portez des chapeaux. Vous dites que c’est votre voile. C’est faux. La Bible dit que le voile de la femme, c’est sa chevelure. Et si elle coupe ses cheveux, il est inconvenant pour elle de prier. Pas vrai? Ça, c’est l’Écriture. Voyez? Et donc, les femmes doivent porter de longs cheveux, peu importe ce que vous, vous voulez en penser; c’est ce qui est l’AINSI DIT LE SEIGNEUR. Indiquez-moi donc un seul endroit…"], ["p", "128 Vous dites : “Eh bien, mes cheveux sont longs. Vous voyez, j’ai les cheveux jusqu’aux épaules.” Ça, c’étaient des cheveux courts. “Christ,” vous dites, “Christ avait les cheveux longs.” Non, pas du tout. Christ avait les cheveux jusqu’aux épaules, à ce qu’on dit. Ils—ils les ramenaient tout simplement devant, comme ceci, et les coupaient — des cheveux jusqu’aux épaules. Regardez le mot grec là-dessus, et vous verrez."], ["p", "129 Des cheveux de femme, l’homme ne devrait pas avoir de longs cheveux, parce que c’est féminin, ça : très longs comme ceci. Mais Il les coupait ici, aux épaules, — c’est comme ça qu’ils les coupaient, — Il les ramenait de derrière
