<!-- ===== OPTION C : DEUX PANNEAUX (à coller tout à la fin du fichier, juste avant </body>) ===== -->
<style>
/* Écran large : liste des sujets à gauche, lecture à droite, plein écran */
body.two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;grid-template-rows:auto minmax(0,1fr);height:100vh;overflow:hidden}
body.two header{grid-column:1;grid-row:1;position:static;background:var(--card);border-right:1px solid var(--ln);border-bottom:0;padding:14px 14px 6px}
body.two .row,body.two #info{max-width:none}
body.two #m{display:contents}
body.two #lst{grid-column:1;grid-row:2;overflow:auto;background:var(--card);border-right:1px solid var(--ln);padding:4px 8px 16px;display:flex;flex-direction:column;gap:2px;min-height:0}
body.two #rd{grid-column:2;grid-row:1/3;overflow:auto;padding:40px 56px 96px;min-height:0;-webkit-overflow-scrolling:touch}
body.two #none{grid-column:1;grid-row:2}
body.two .it{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:10px 12px;border-radius:10px;cursor:pointer;font:700 13px/1.4 system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--bl,#1d4ed8)}
body.two .it:hover{background:var(--hb)}
body.two .it.on{background:var(--hb);box-shadow:inset 0 0 0 1.5px var(--ac)}
body.two .it:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
body.two #rd .s{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:32px 44px;overflow:visible}
body.two #rd .rt{margin:0 0 20px;font:700 28px/1.3 var(--ff,'Source Serif 4',Georgia,serif);color:var(--bl,#1d4ed8)}
body.two #rd .b{display:block;border:0;padding:0}
body.two #rd .b p{text-align:left;hyphens:none;-webkit-hyphens:none;font-size:calc(var(--fs,17px) + 2px);line-height:1.8}
body.two #rd .ed{width:36px;height:36px;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ac);opacity:0;transition:opacity .15s}
body.two #rd .pw:hover .ed,body.two #rd .ed:focus-visible{opacity:1}
@media (hover:none){body.two #rd .ed{opacity:.55}}
</style>
<script>
(()=>{
const mq=matchMedia('(min-width:900px)');
const lst=document.createElement('nav'),rd=document.createElement('section');
lst.id='lst';lst.setAttribute('aria-label','Liste des sujets');
rd.id='rd';rd.setAttribute('aria-live','polite');
const PEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
let SEL=null,prev=null;
const base=render;

function pane(top){
 rd.innerHTML='';
 if(SEL===null)return;
 const s=sub(SEL),d=el('div','s o'),t=el('h2','rt'),b=el('div','b');
 d.dataset.k=SEL;hl(t,s.t);d.append(t,b);fill(b,SEL);
 b.querySelectorAll('.ed').forEach(e=>{e.innerHTML=PEN;e.setAttribute('aria-label','Modifier ce paragraphe')});
 rd.append(d);rd.scrollTop=top;
}
function paintList(){
 lst.querySelectorAll('.it').forEach(x=>{const on=x.dataset.k===SEL;x.classList.toggle('on',on);on?x.setAttribute('aria-current','true'):x.removeAttribute('aria-current')});
}
function focusMark(){const mk=rd.querySelector('mark');if(mk)mk.scrollIntoView({block:'center'})}

function wide(){
 const y0=rd.scrollTop,l0=lst.scrollTop;
 lst.remove();rd.remove();OP.clear();
 base();                                   /* le code d'origine prépare la recherche et la liste */
 const all=allKeys(),added=prev&&all.find(k=>!prev.includes(k));prev=all;
 const cards=[...m.querySelectorAll(':scope>.s')],keys=cards.map(c=>c.dataset.k);
 lst.innerHTML='';
 cards.forEach(c=>{
  const h=c.querySelector(':scope>.h'),b=document.createElement('button');
  b.type='button';b.className='it';b.dataset.k=c.dataset.k;b.append(...h.childNodes);lst.append(b);c.remove();
 });
 if(added&&keys.includes(added))SEL=added;   /* un nouveau sujet s'ouvre tout de suite */
 const same=SEL!==null&&keys.includes(SEL);
 if(!same)SEL=keys.length?keys[0]:null;
 m.append(lst,rd);
 pane(same?y0:0);paintList();lst.scrollTop=l0;
 if(!same&&terms.length)focusMark();
}
render=function(){
 if(mq.matches){document.body.classList.add('two');wide()}
 else{document.body.classList.remove('two');base()}
};

lst.addEventListener('click',e=>{
 const it=e.target.closest('.it');if(!it)return;
 SEL=it.dataset.k;pane(0);paintList();if(terms.length)focusMark();
});
lst.addEventListener('keydown',e=>{
 if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
 const its=[...lst.querySelectorAll('.it')],i=its.indexOf(document.activeElement);if(i<0)return;
 e.preventDefault();const n=its[i+(e.key==='ArrowDown'?1:-1)];if(n){n.focus();n.click()}
});
mq.addEventListener('change',()=>render());
render();
})();
</script>
