ésister : “Oh, frère, je vais te dire une chose, je, la vocation est en moi, mais je… Fiou ! Oh, mon gars, ça me coûte terriblement de me lancer.” Eh bien, voilà, vous voyez. Chercher à fuir, c’est—c’est ça."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>52-0713A Les premières expériences spirituelles<\/b>"], ["p", "17 Regardez. Tout au long de la vie, ces choses arrivaient et partaient. Finalement, l’appel de… au ministère. Maintenant, j’aimerais que vous fassiez attention. Avant que je devienne chrétien, que je confesse Jésus-Christ comme mon Sauveur personnel, ce don était là malgré tout. Alors que j’étais un pécheur, un étranger, sans droit de cité auprès de Dieu, ce don était malgré tout là, j’avais des visions malgré tout. Dieu qui est mon Juge, devant Qui je me tiens aujourd’hui, sait que c’est la vérité. Est-ce que j’avais mérité cela ? Absolument pas. La Bible le confirme absolument et soutient que c’est la façon de Dieu de faire les choses : les dons et les appels sont sans repentir."], ["p", "Puis, quand quelqu’un m’a parlé de Jésus et de Son amour pour moi, j’ai alors réalisé que j’étais un pécheur, un étranger à Dieu, je L’ai accepté comme mon Sauveur personnel. Et puis, Dieu m’a conduit auprès des gens qui m’ont enseigné les Ecritures, et j’ai reçu le baptême du Saint-Esprit. Puis, cela a commencé à m’arriver tout le temps."], ["p", "J’ai consulté les membres du clergé. Premièrement, quand j’étais ordonné dans l’Eglise Baptiste Missionnaire, savez-vous ce qu’ils m’ont dit ? Eh bien, il… Tenez, j’aimerais que vous saisissiez ceci. Combien m’aiment ? Levez la main maintenant pour montrer que vous allez me croire. Je souhaite que vous le fassiez tous. Je vais vous dire quelque chose ici que je ne dis pas aux gens en public. Mais j’aimerais que vous sachiez ceci. Ils…"], ["p", "J’ai parlé aux membres du clergé, j’ai dit : «Eh bien, il se passe quelque chose dans ma vie.» J’ai dit : «Depuis que je lis la Bible, pensez-vous que c’est quelque chose de Dieu ?» J’ai dit : «Il y a… J’ai–j’ai des visions, et–et des choses qu’on raconte, différentes choses prédisant cette inondation, alors que je me tenais là sur le mur, depuis que j’étais…»"], ["p", "J’étais alors devenu un chrétien, un prédicateur baptiste. Je me tenais là, j’ai dit : «Eh bien, il va y avoir… J’ai eu une vision, cette rue là-bas serait inondée et le niveau d’eau atteindrait vingt-deux pieds [67 cm] .»"], ["p", "J’ai vu certains des jeunes gens s’avancer, ils ont dit : «Billy est un tout petit peu hors de lui. Il devient trop religieux.» Voyez ?"], ["p", "J’ai parlé aux membres de mon clergé, mes… Les évêques, les pasteurs et autres. Ils ont dit : «Billy, fais attention à ce que tu fais. Le diable est dans cette voie-là.»"], ["p", "J’ai dit : «Oh ! la la !»"], ["p", "«Monsieur, le diable est par là, fais attention. Tu vois, ta mère me dit que tu étais né avec une Lumière au-dessus de toi. Vois-tu, tu es peut-être possédé d’un démon qui se tient près de toi.»"], ["p", "J’ai dit : «Oh ! la la ! Hein !» J’ai dit : «Eh bien, je… Monsieur, voulez-vous prier pour moi ?»"], ["p", "«Oui, nous–nous allons prier pour vous, révérend Branham.»"], ["p", "«Merci, monsieur. Priez pour moi.» Je disais : «Ô Dieu, ô Dieu, un démon près de moi, tiens-le éloigné, Seigneur. Ne le laisse pas s’approcher de moi. Non, je n’aimerais pas avoir des visions ni rien ; je n’aimerais rien voir. J’aimerais simplement étudier la Parole, ici, prier et prêcher la Parole. Je n’aimerais rien de cette histoire. Non !»"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>58-1005<\/b><b><sup>E<\/sup><\/b><b> Un homme appelé de Dieu<\/b>"], ["p", "30 b…Et alors, nous, ce soir, nous voulons réfléchir là-dessus. Et, souvenez-vous, malgré tous ces cris, Dieu ne peut pas envoyer de réveil tant qu’Il n’aura pas un homme qui soit en état de le porter. Nous ne pouvons pas avoir de réveil tant que nous n’aurons pas des hommes–des hommes appelés de Dieu, des hommes formés par Dieu, qui n’ont pas été formés dans les écoles de théologie et dans les écoles normales, mais des hommes solides, des hommes de foi, que Dieu a instruits à l’école de Sa solide formation, des hommes qui n’ont pas peur de braver les flammes ! Des hommes qui sont entrés dans la Présence de Dieu, qui connaissent Sa puissance, qui connaissent Son omnipotence, et qui connaissent Sa puissance de guérison ! Des hommes qui ont été formés pour connaître le Dieu vivant ! C’est bien de les former par la Parole, mais «la lettre tue ; c’est l’Esprit qui vivifie»."], ["rev", "Rev. William Marrion Branham"], ["p", "<b>1 Corinthiens 4 :1-2 LSG <\/b>"], ["p", "« 1. Ainsi, qu’on nous regarde comme des serviteurs de Christ, et des dispensateurs des mystères de Dieu. 2. Du reste, ce qu’on demande des dispensateurs, c’est que chacun soit trouvé fidèle. »"]]}, {"t": "DIEU A FAIT BEAUCOUP DE MIRACLES DANS LE MINISTÈRE DE FR. BRANHAM", "i": [["ref", "<b>50-0827<\/b><b><sup>E<\/sup><\/b><b> Prends la verge et convoque l’assemblée<\/b>"], ["p", "19 Et Il est toujours, depuis le commencement, à ce que nous sachions, Il a toujours eu une voie pour la guérison. La guérison divine pour Son Eglise. N’est-ce pas vrai ? Lors du pèlerinage dans le désert, remontant jusqu’aux jours d’Abraham, Il a guéri Sara de la stérilité. Il a opéré des œuvres miraculeuses, Dieu tout au cours des âges. Et s’Il l’a été tout au cours des âges, et alors, arrivé ici à la fin de tous les âges, peut-Il se déprécier, en s’affaiblissant et dire qu’il n’y en a plus ? Loin de là. Avant que j’entre maintenant, Ses promesses seront… ?... partout au cours des âges."], ["p", "Jadis dans les jours passés, eh bien, il y avait… il n’y avait pas beaucoup de gens. On n’avait pas besoin des dons comme on en a besoin aujourd’hui."], ["p", "Pensez-y donc, amis, que dans le seul ministère que j’ai eu de la part du Seigneur, j’ai vu plusieurs, plusieurs, plusieurs fois, plus de miracles être accomplis que ce qui est écrit dans la Bible, que Jésus-Christ avait accomplis pendant ces trois ans, en une seule unité, un seul groupe de Son ministère. Un seul groupe, Il a accompli plus de miracles que ce qui est écrit dans cette Bible. Tout ce qui a pu être écrit dans la Bible sauf la lèpre, à ce que je sache, ça a été guéri, même trois cas précis de gens qui étaient déclarés morts, qui sont vivants ce soir, en bonne santé et forts."], ["p", "Qui a fait cela ? Jésus-Christ. Il est le même hier, aujourd’hui et éternellement. Et Il est ici ce soir. Et Lui, Jésus, était le Rocher qui était dans le désert, qui suivait les enfants d’Israël."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "PASTEUR QUI TOMBE", "i": [["p", "‎"], ["p", "‎1)Que devrait faire l’église Hosanna Tabernacle si, selon le message, le pasteur n’était tombé qu’une seule fois ?"], ["ref", "‎<b>(57-0922<\/b><b><sup>E<\/sup><\/b><b> * Hébreux, Chapitre Sept #2)<\/b>"], ["p", "‎"], ["p", "‎ E-283  Si vous voulez renvoyer le pasteur, dites-moi pourquoi. A-t-il fait quelque chose ?"], ["p", "‎"], ["p", "‎E-284   – Oui. Nous l’avons surpris en état d’ivresse. Ou, nous l’avons surpris en train de faire telle chose, ou en train de faire quelque chose de mal."], ["p", "‎"], ["p", "‎E-285   – Avez-vous trois témoins de cela ?"], ["p", "‎"], ["p", "‎E-286   – Oui. Nous les avons."], ["p", "‎"], ["p", "‎E-287   Ces témoins doivent d’abord être mis à l’épreuve. “Ne reçois point d’accusation contre un ancien, si ce n’est sur la déposition de deux ou de trois témoins, et qu’ils soient d’abord éprouvés ; contre un ancien.” Ensuite, vous devez déclarer, sous serment, que vous l’avez vu ; et apporter la preuve que vous l’avez vu."], ["p", "‎"], ["p", "‎E-288   Ensuite, si c’est le cas, alors ce péché est condamné devant tous : “C’est mal.” Ensuite, dites : “Assemblée, voulez-vous changer de pasteur ?"], ["p", "‎"], ["p", "‎E-289   Si l’assemblée vote : “Pardonnez-lui, et qu’il reste en poste”, ça met le point final à la question. Voyez ? N’êtes-vous pas d’accord que c’est là la bonne manière de diriger une église ? C’est ce que la Bible dit. "], ["p", "‎"], ["p", "‎"], ["p", "‎"], ["p", "‎2) Que doit faire l’église Hosanna Tabernacle, selon le message, Si le péché commis était la vie du pasteur ?"], ["ref", "‎<b>58-1012 Le Départ Secret Et Soudain De l’Eglise)<\/b>"], ["p", "‎"], ["p", "‎E-103 Si votre pasteur faillissait et qu’il ne faisait que faillir continuellement, vous devriez chercher un autre pasteur. Vous devriez le faire rapidement."], ["p", "‎"], ["p", "‎"], ["p", "‎"], ["ref", "‎<b>62-0513M -  La voie d’un vrai prophète de Dieu<\/b>"], ["p", "‎"], ["p", "‎70 Or, il est bien connu que je suis un critique, par contre je critique que ce qui est mal. Mais je, nous devrions critiquer ce qui est mal."]]}, {"t": "Thème : MARQUE DE CHRIST", "i": [["bib", "<b>APOC 9 :1-5<\/b>"], ["bib", "<b>EZECHIEL 9 :1-6<\/b>"]]}, {"t": "Aujourd’hui même les ministres…", "i": []}, {"t": "Le diable est un membre de l’église", "i": []}, {"t": "On pose le sceau sur un travail fini", "i": [["ref", "<b>55-0312 La Marque De Christ<\/b>"], ["p", "11 Hier soir, pendant que je parlais de la marque de la bête, ou plutôt du sceau de la bête, nous l’appelons ainsi, car il est parlé du Sceau de Dieu… Et nous avons vu que le sceau de la bête, c’est… Le sceau représente un travail fini. Car tout ce qui est fini est un – scellé."], ["p", "Un wagon, quand il est chargé, bien chargé, l’inspecteur doit d’abord venir. Après qu’on a chargé du bois, ou quoi que ce soit sur un – un wagon, l’inspecteur vient ensuite en faire un examen complet. Et si on a amené le wagon là sur la voie secondaire pour être chargé, l’inspecteur secoue le tout pour s’assurer que c’est bien et que c’est compact. Et alors, s’il voit que tout est compact, il tire la porte et la scelle ; et ça reste scellé jusqu’à ce que ça arrive à destination."], ["p", "C’est ainsi que le Saint-Esprit fait avec nous, Il vient et secoue certaines choses qui sont branlantes dans l’église, les choses qui sont branlantes dans l’individu. Une petite vie d’insouciance, les choses que nous ne devrions pas faire, et les petites choses qui ne marchent pas en nous, Dieu vient et les secoue, d’abord pour voir si vous êtes ferme dans la Parole, pour voir si vous remplissez les conditions requises en tant qu’enfant ou serviteur de Dieu pour continuer ainsi. Si en fin de compte Il voit que tout est stable, alors on ferme les portes et vous êtes scellé."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu ne reconnaît pas votre foi tant qu’Il ne vous le prouve pas.", "i": [["ref", "<b>54-1024 Le péché impardonnable<\/b>"], ["p", "56 Eh bien, vous êtes un croyant, mais Dieu ne reconnaît pas votre foi tant qu’Il ne vous le prouve pas. Amen. Oh, frère, permettez-moi de vous dire quelque chose. Lorsque votre foi… Il se peut que ce soit reconnu d’après vos pensées à vous, mais quand cela arrive dans les pensées de Dieu, Dieu scelle cette foi par le baptême du Saint-Esprit. Abraham a cru Dieu, et cela lui a été imputé à justice ; Dieu lui a donné le sceau de la circoncision comme signe qu’Il l’avait accepté. Alléluia ! Et le Sceau du Dieu vivant, aujourd’hui (sondez les Écritures), c’est le baptême du Saint-Esprit dans le cœur humain. Amen. Éphésiens 4.30 dit : “N’attristez pas le Saint-Esprit de Dieu, par lequel vous avez été scellés jusqu’au jour de votre rédemption.” Le Sceau de Dieu — Dieu qui vous reconnaît comme étant un croyant — vous scelle dans le Corps par le baptême du Saint-Esprit."], ["p", "57 Alors, si vous n’avez pas été séduit, pour croire une théorie, une émotion, ou quelque chose de ce genre…ce qui est très bien ; je n’ai rien contre ça. Peu importe de quelle manière Dieu vous L’a donné, ça ne concerne que Dieu et vous, voyez-vous. Mais une fois qu’un homme est né de l’Esprit de Dieu, vous le verrez s’avancer avec autant d’assurance et d’humilité possible jusqu’au Trône de la grâce, il saura qu’il a le droit de manger de l’Arbre de Vie. En effet, il s’est passé quelque chose en cet individu, une expérience qu’il n’a jamais trouvée nulle part ailleurs dans le monde. Et chaque homme ou femme qui est né de l’Esprit de Dieu a vécu une expérience personnelle, et il sait exactement quand c’est arrivé, comment c’est arrivé, et quel effet cela a eu sur lui. Chez tous les hommes et toutes les femmes qui sont nés de l’Esprit de Dieu, il s’est passé quelque chose, il y a quelque chose qui change. C’est… Qu’est-ce que c’est ? C’est une conversion."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Le sceau de Dieu, c’est le Saint-Esprit", "i": [["ref", "<b>55-0312 La Marque De Christ<\/b>"], ["p", "50 Remarquez. Vous dites : «Frère Branham, qu’est-ce qu’il fait, ce Sceau ?» Hier soir, quelqu’un… Bon, pour vous, frère, qui avez dit à la radio que ce Sceau ce sera un tatouage à la tête, que le Sceau de Dieu ce sera un tatouage à la tête. Pour commencer, qu’est-ce que le Sceau de Dieu ? Le Sceau de Dieu, c’est le baptême du Saint-Esprit, ce n’est pas une marque à la tête, mais plutôt une marque au cour. Amen. Ce n’est pas une certaine marque, l’apostasie elle-même vous scelle. Vos propres œuvres montrent ce que vous êtes. «C’est à leurs fruits que vous les reconnaîtrez.» S’ils renient Christ, s’ils rejettent Christ, ils sont scellés de l’apostasie par le diable. S’ils sont des chrétiens nés de nouveau qui craignent et aiment Dieu, ils sont scellés du Saint-Esprit pour une destination éternelle. Amen. Frère, j’aime vraiment cela ; ceci est vraiment pour moi. Amen. Cela m’a soutenu toutes ces années, j’aime cela, ce soir ; seulement, j’aurais aimé être deux fois plus grand que je le suis maintenant, ainsi j’en aurais reçu le double. Amen. Pour moi, c’est la vie…"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>54-0509 L’invasion des États-Unis<\/b>"], ["p", "81 Et je pense aujourd’hui que si nous n’avons pas la Parole de Dieu qui est plus tranchante qu’une épée à deux tranchants, pour entourer cette beauté de la puissance de la sainteté de Dieu, nous allons permettre à toutes les vaches du pays de La lécher et de L’arracher. Elles vont La salir. Ça discréditera l’Eglise. C’est juste."], ["p", "82 Je pense que <b>ce qu’il nous faut aujourd’hui, c’est plus des ministres rudes, à l’ancienne mode, appelés de Dieu, peut-être pas très instruits, mais qui feront venir les gens à un autel où ils seront profondément affligés ; non pas en se réjouissant, ni en rigolant, ni en faisant éclater le chewing-gum, ou en inscrivant leurs noms sur un papier ; mais, frère, à la manière ancienne, en poussant des cris et en agonisant, au point que les hommes et les femmes se repentiront entièrement de leurs péchés et s’approcheront de Dieu. Amen.<\/b>"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "LES BROCHURES DU VIVANT DE WMB", "i": [["ref", "<b>65-0815 – Et tu ne le sais pas<\/b>"], ["p", "60 Et je sais qu’après que j’aurai quitté cette terre, ces bandes et ces brochures resteront vivantes, et beaucoup d’entre vous les jeunes enfants, vous verrez, dans les jours à venir, que c’est exactement la Vérité, parce que je le dis au Nom du Seigneur."], ["rev", "        Rév. William Marrion Branham"]]}, {"t": "LE SAINT-ESPRIT", "i": [["ref", "<b>59-1216 Qu'est-ce que le Saint-Esprit?<\/b>"], ["p", "22 Sur ce, nous voulons aborder le sujet qui, je pense, est le sujet marquant d’aujourd’hui, de… Qu’est-ce que le Saint-Esprit? Qu’est-ce que C’est? Et, maintenant, la raison pour laquelle j’ai pris un sujet à la suite de l’autre comme ça, c’est parce que vous ne pouvez pas venir recevoir le Saint-Esprit, à moins de savoir ce que C’est. Et vous ne pouvez pas Le recevoir, si vous savez ce que C’est, à moins de croire qu’Il vous est donné, et qu’Il est pour vous. Et puis, vous ne pouvez pas savoir si vous L’avez ou pas, à moins de savoir quels résultats Il produit. Donc, si vous savez ce que C’est, et à qui Il est destiné, et quelle action Il produit quand Il vient, alors vous saurez ce que vous avez, quand vous Le recevrez. Voyez? Comme ça, ce sera vraiment réglé."], ["p", "26 Combien ici n’ont pas reçu le Saint-Esprit, n’ont pas été baptisés du Saint-Esprit? Levez la main; vous savez que vous ne l’avez pas été. Regardez donc les mains."], ["p", "Maintenant je veux En parler, parler du Saint-Esprit en tant que signe, parce qu’Il est un signe. Nous comprenons bien que, que toutes les promesses nous sont données par… Abraham était le père de la promesse, parce que Dieu a donné la promesse à Abraham et à sa Postérité après lui. La promesse a été faite “à Abraham et à sa Postérité”. Et ce signe, il est destiné à un peuple de l’alliance."], ["p", "27 Or, il y a une énorme différence entre un Chrétien tout court et un Chrétien rempli du Saint-Esprit. Et là, on va voir ça dans l’Écriture, et le situer très précisément par rapport à l’Écriture. Pour commencer, il y a le Chrétien qui fait profession d’être Chrétien. Mais si ce Chrétien n’a pas encore été rempli du Saint-Esprit, il est seulement en voie de devenir un Chrétien. Voyez? Il fait profession de Le croire; il s’efforce d’Y parvenir, mais Dieu ne lui a pas encore donné cet Esprit, du Saint-Esprit. Il n’en est pas encore arrivé à ce but avec Dieu, que Dieu l’ait reconnu."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>61-1105 Le Témoignage D’un Vrai Témoin<\/b>"], ["p", "185 Quoi? Eglise, c'est la raison pour laquelle je ne peux pas accepter que le baptême du Saint-Esprit c'est crier, trembler, parler en langues, ou avoir une quelconque sensation. Ces choses sont donc très bien, voyez. Ces - ces choses sont très bien, mais le diable peut imiter cela si parfaitement."], ["p", "186 Mais le Saint-Esprit, c'est la Divinité, Dieu \"habitant\" dans l'homme. C'est plus qu'une sensation. C'est plus que parler en langues. C'est plus que crier dans l'Esprit. C'est plus que  pleurer. C'est plus qu'adhérer à une église. C'est Dieu vivant dans l'homme. La Divinité, Dieu Lui-même \"habitant\" dans cette personne, lorsque celle-ci parle et c'est exactement comme  Dieu parlait, c'est cela l'Eglise de Jésus-Christ. C'est ainsi que la première Eglise apostolique a commencé."], ["rev", "Rev. William Marrion Branham"], ["p", "‎"], ["p", "‎   "], ["p", "‎"]]}, {"t": "DIEU EST DIFFÉRENT DE NOUS, IL DIT LA CHOSE ET ELLE ARRIVE", "i": [["ref", "<b>57-0420 La mise au tombeau<\/b>"], ["p", "11 Premièrement, nous aimerions regard-… attirer votre attention sur l'infaillibilité de la Parole de Dieu. Dieu tient Sa Parole à la lettre. Et ce soir nous voulons fixer nos pensées là-dessus, sur le fait que Dieu tient Sa Parole. Nous pouvons tenir pour certain que tout ce que Dieu a dit dans Sa Parole est la vérité. Et la foi ne repose pas sur le sable mouvant des conceptions humaines ou de la théologie de l'homme, mais elle trouve son lieu de repos définitif sur le rocher immuable de  la Parole éternelle de Dieu, la Parole."], ["p", "12 Quand Dieu a dit une chose, cela demeure éternellement la vérité. Il ne peut jamais retirer cela et dire: \"Je ne voulais pas dire cela.\" Moi, je peux déclarer des choses, et vous, vous pouvez aussi déclarer des choses, et ensuite nous sommes enclins à devoir retirer cela, parce que nous l'avons dit au mieux de notre connaissance et au mieux de nos capacités. Mais Dieu est donc si différent de nous, Il est infini; par conséquent, Il ne dit pas une chose à moins que ça soit absolument parfait. Il ne doit jamais retirer cela, Il ne doit jamais s'excuser pour ce qu'Il a dit. Cela demeure toujours la vérité."], ["rev", "Rev. William Marrion Branham"], ["p", "9 Maintenant, rappelez-vous, voici ce que nous croyons: La Parole de Dieu doit s’accomplir; car c’est... Dieu Lui-même est infini, Il est infaillible; Il est omniprésent, omniscient, omnipotent, et infini. S’Il ne l’est pas, alors Il n’est pas Dieu. Et s’Il l’est, alors Il connaissait la fin depuis le commencement. Avant que le monde existât, Il savait que nous serions assemblés ici cet après-midi s’Il est infini. Il savait ce à quoi vous pensez dans votre coeur avant que le monde ait jamais commencé. Il savait ce à quoi vous penseriez en ce moment-ci. Il connaissait chaque moucheron qui existerait sur la terre, chaque fois qu’il battrait les yeux. C’est ce que représente être infini."], ["p", "Et s’Il n’est pas infini, alors Il n’est pas Dieu. Vous voyez? Nous devons donc nous rappeler que nous ne traitons pas avec quelque chose qui est dans–dans le temps et dans l’espace comme nous, quelque chose de limité. Nous traitons avec Quelque Chose d’infini. Si Ceci est la Parole de Dieu, alors c’est tout aussi infini que Dieu. Voyez? Vous y êtes. Vous devez avoir la foi dans la Parole. C’est l’unique moyen par lequel Elle opérera."], ["ref", "61-0516A Jésus-Christ Est Le Même Hier, Aujourd’hui Et Eternellement"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU N’A-T-IL PARLÉ QU’À MOÏSE ?", "i": [["bib", "<b>Nbres12 :1-11<\/b>"], ["ref", "<b>53-1130 L’Eternel n’a-t-il parlé qu’à Moise ?<\/b>"]]}, {"t": "LE RESPECT ENVERS LE SERVITEUR DE DIEU", "i": [["p", "2 Maintenant, nous aimerions, pendant un moment, porter notre attention sur l’attitude de Miriam et d’Aaron. Ils se sont dit que Moïse avait commis une erreur. Ils voulaient le corriger. Dieu leur a vraiment parlé, disant : « Lorsqu’il y aura parmi vous un prophète, c’est par des miracles ou des visions que Je le visiterai, et Je lui apparaîtrai dans des songes et autres. Mais Moïse, Je lui ai parlé de bouche à bouche.» Et immédiatement, Miriam était frappée de lèpre. Et Aaron est entré en courant, en effet, Miriam était la sœur propre à Moïse. Donc, on n’a pas intérêt à parler [en mal] d’un serviteur de Dieu, n’est-ce pas ?"], ["p", "Ainsi donc, ici, Dieu a parlé à Aaron, Il s’est adressé à lui, disant… considérant ce qu’Il avait accompli par Moïse, Dieu a dit : « Pourquoi n’avez-vous pas craint de parler contre lui ?»"], ["p", "Et alors, Aaron courut vers Moïse et lui annonça que sa sœur était frappée au … blanche, à cause de la lèpre, naturellement, et il a dit : « La laisseras-tu mourir ?» Ainsi, Moïse s’est jeté au devant de Dieu et a plaidé pour elle, et Miriam était frappée de lèpre malgré cela. Elle devait rester, et Israël avait interrompu son voyage pendant sept jours, conformément à la loi, jusqu’à ce qu’on l’a sortie de nouveau du camp."], ["p", "3 Dieu ne change jamais. Sa puissance est tout à fait la même qu’elle était au… avant la création du temps. Dieu a créé en prononçant la Parole ; et au commencement était la Parole, et la Parole était avec Dieu, et la Parole était Dieu. C’est ce qui était au commencement, La Parole. La Parole a été faite chair et a habité parmi nous. La Parole est retournée de nouveau à la forme de l’Esprit et Elle vit parmi les hommes ce soir, juste le même Dieu vivant au travers des âges."], ["p", "Et ce soir, Sa Parole est aussi efficace dans le cœur du croyant qu’Elle était quand Elle était prononcée au commencement. Elle ne dévie jamais de Sa voie. Elle ira de l’avant. C’est un relais constant, une chaîne qui va toujours… Et dans chaque âge, Dieu a toujours eu quelqu’un en qui Il peut avoir confiance et par qui Il peut travailler. Dieu a toujours eu un canal sur la terre, toujours. Parfois on en arrive à un très petit nombre, mais jamais Il n’a manqué un témoin, quelqu’un qui peut lui servir de témoin."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU TRAITE AVEC UN INDIVIDU", "i": [["ref", "<b>63-1214 Pourquoi la petite Bethléhem<\/b>"], ["p", "45 Mais, voyez-vous, Dieu a d’autres façons de faire les choses. Il sait faire les choses comme il faut. Et maintenant, avec la pensée et l’aide de Dieu, nous allons essayer de dire pourquoi ceci est arrivé, car tout marche parfaitement dans le grand programme de Dieu. Et je désire que vous qui êtes ici à Phoenix, et dans les parages, vous essayiez de saisir ceci. Que vous vous souveniez que Dieu sait ce qu’Il fait. Voyez-vous ? Et Il utilise des moyens simples pour faire cela. En effet, s’Il fait une chose en utilisant quelque chose de très remarquable, alors… Dieu ne fait jamais les choses comme cela. Il ne l’a jamais fait dans toute l’histoire de la Bible. Dieu n’a jamais traité, en aucun moment Il n’a pris un groupe de gens pour faire quelque chose. Dieu utilise un individu. Il s’agit de vous, vous, une seule personne. Et Dieu ne change jamais Son programme. En effet, Son premier programme reste toujours le programme auquel Il doit S’en tenir."], ["p", "46 Au temps de Noé, Il avait un homme: Noé. Au temps où Il a fait sortir Israël, Il avait un homme; c’était Moïse. Nous savons que Dathan et plusieurs autres ont essayé de penser, eh bien, qu’ils avaient la même autorité et ainsi de suite. Vous savez ce qui leur est arrivé. Lors de la Venue du Seigneur, au temps de – de Jean-Baptiste et de différents autres, Il avait un seul individu avec lequel Il travaillait. Et Il traite avec nous aujourd’hui comme un individu, pas comme un groupe, une personne. Cela va dépendre de vous et de moi, de la façon dont nous nous tenons devant Dieu. Car Il traite avec vous et moi en tant que des individus, pas en tant qu’un groupe dans lequel nous sommes, pas en tant qu’une église dénominationnelle dont nous sommes membres, mais avec vous et moi comme des individus."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "DIEU TRAITE AVEC UN SEUL HOMME", "i": [["ref", "<b>63-0116 Le messager du soir<\/b>"], ["p", "90 Mais Dieu travaille toujours avec un individu. Il ne vous sauve pas parce que vous êtes méthodiste ; Il ne vous sauve pas parce que vous êtes baptiste ; Il ne vous sauve pas parce que vous êtes pentecôtiste. Il vous sauve parce qu’Il a traité personnellement avec vous ! Et vous êtes sauvé sur cette base-là : vous avez accepté cela. Et donc, pour que Dieu traite avec vous, Il ne traite pas avec vous en tant que Son église, Il traite avec vous comme un individu."], ["p", "91 C’est pourquoi, quand Dieu envoyait Ses prophètes, Ses messagers du Testament, Il parlait à un seul homme, c’est cet homme qui devait apporter le Message. À partir de lui, d’autres allaient partout, pour apporter le même Message. Mais il fallait qu’il y ait un seul quartier général. Dieu l’a toujours eu. Je suis reconnaissant qu’Il l’ait ce soir ; c’est le Saint-Esprit, bien sûr, nous le savons tous. Donc, non pas un groupe, mais c’est le Saint-Esprit qui est le Quartier général de Dieu. Voilà le Messager de Dieu pour cette heure."], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>63-0112 L’Influence           <\/b>Nbres 16 :1-"], ["p", "29 Vous souvenez-vous dans la Bible lorsque Moïse a fait sortir Israël hors d’Egypte pour l’amener à la terre promise ? Vous souvenez-vous de cet homme là-bas, Dathan, et de ceux qui s’étaient enflés d’orgueil et qui avaient dit : « Eh bien, attendez un instant. Moïse, tu cherches à te faire le seul galet sur la plage. Il y a d’autres hommes saints parmi nous ici. »"], ["p", "Et Dieu a dit : « Sépare-toi d’eux, car je vais les détruire. »"], ["p", "Dieu avait ordonné qu’une certaine chose soit faite, et elle devait se faire de cette manière. Nous ne devons pas y injecter nos propres idées. Nous devons respecter Son idée et Son commandement."], ["p", "Je ne fais pas allusion à nos sœurs, mais au… Peu importe ce que fait l’autre femme, Dieu a un modèle établi ici. Peu importe ce qu’un autre laïc a fait dans la Bible, Dieu a pour vous un modèle ici sur ce que vous devez faire. Nous y arriverons peut-être après quelques instants, à ce que le laïc et le prédicateur doivent faire. Tous, nous avons notre place et nous devons demeurer dans notre appel."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "THÈME : LES DÉSESPOIRS DE RACHEL", "i": [["bib", "GGenèse30 :1-2"], ["ref", "<b>50-0820<\/b><b><sup>E<\/sup><\/b><b> Croyez-vous que je puisse faire cela ?<\/b>"], ["p", "6 Eh bien, écoutez ça. C’est comme j’ai expliqué l’autre soir. Si quelque chose bloquait la circulation au niveau de ma main... Eh bien, il n’y a qu’un seul moyen de débloquer cela, c’est de libérer cela. Et alors, la nature prendra soin de ça tant que ce lien est défait."], ["p", "Eh bien, c’est pareil quand une force invisible lie les oreilles, ou la langue, ou un membre de quelqu’un. Maintenant, prenez la personne liée. Eh bien, c’est difficile de distinguer pareille personne. C’est peut-être un chrétien de renom, plein de l’Esprit de Dieu, mais cependant lié. Maintenant, le..."], ["rev", "Rev. William Marrion Branham  "], ["bib", "LUC 19 :31-34-38"], ["ref", "<b>54-0228A L’Expectative<\/b>"], ["p", "39 Eh bien, maintenant, la même chose… Il y a beaucoup de choses dont nous avons hérités de… par des liens familiaux comme ça, les uns aux autres. Et aussi, par les liens familiaux de Dieu, si nous sommes nés de l’Esprit de Dieu, nous revêtons la nature de Dieu. En effet, nous sommes alors des fils de Dieu."], ["p", "Et c’est là que j’ai découvert que les gens du Plein Evangile sont devenus des fils et des filles de Dieu. Ils croient au surnaturel. Eh bien, les autres ne sont jamais montés là-haut, ils ne peuvent donc pas croire au surnaturel. Il n’y a rien avec quoi croire. Voyez ?"], ["rev", "Rev. William Marrion Branham"], ["bib", "<b>MARC 11 :4<\/b>"], ["v", "16 Maintenant, juste brièvement maintenant, quand Jésus-Christ... Il est venu ôter le péché. Vous le croyez, n’est-ce pas? Très bien. Or, la maladie est un attribut du péché. Nous ne connaissions pas de maladie avant d’avoir commis le péché. La maladie est venue après le péché comme un attribut du péché. Nous le savons tous. Toute maladie est..."], ["p", "Ce ne sont peut-être pas vos péchés à vous. C’est soit direct, soit indirect. Il se peut que vous ayez hérité ça quelque part, la faiblesse d’un membre de votre famille qui avait péché, et cela s’est transmis. Comme il est dit: «Chaque génération devient plus faible et plus sage.» Mais cela est causé soit directement, soit indirectement par le péché."], ["p", "Eh bien, quand Jésus... C’est comme par exemple ceci. Si un gros serpent était ici, ou que quelque chose d’immense me saisissait par le flanc avec sa patte et me faisait mal avec sa patte, eh bien, ce n’est pas nécessaire pour moi de couper la patte de cet animal-là. Mais si quelque chose le frappe à la tête et tue la tête, cela le tuera entièrement."], ["p", "Et quand Jésus a fait l’expiation pour le péché, Il a tué le péché et chacun de ses attributs. Il a tué le serpent à partir de la tête. Croyez-vous cela? Eh bien, c’est vrai."], ["p", "Alors, s’Il a fait l’expiation pour le péché, Il a fait l’expiation pour la maladie parce que la maladie est secondaire, un attribut du péché. Nos inquiétudes, nos ennuis, nos peurs, et toutes ces choses sont des attributs du péché."], ["ref", "51-0717 La manifestation de l’Esprit"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "RÉVEIL DE LA GUÉRISON DE L’ÂME", "i": [["ref", "<b>60-1127<\/b><b><sup>E<\/sup><\/b><b> La Reine Du Midi<\/b>"], ["p", "71 Les gens sont allés l’aider. Ils ont demandé : «Qu’y a-t-il ?»"], ["p", "Elle a dit : «Mon petit garçon ici, il n’y a pas longtemps, a-t-elle dit, il a juste commencé à avoir le regard fixe, dans le vide.» Et elle a dit : «Je l’ai amené chez le médecin il y a quelque temps, et ce dernier a dit qu’il allait mieux, mais il ne va pas mieux.» Elle a dit : «Rien n’arrive à l’attirer.» Elle a dit : «Les choses qui devraient attirer l’attention d’un petit garçon de son âge, ça ne l’attire pas ; il reste simplement assis, le regard dans le vide.»"], ["p", "Combien cela est vrai de l’église aujourd’hui. Dieu a secoué devant l’église chaque sorte de don qu’Il peut, et ils restent tranquillement assis, le regard dans le vide, attendant autre chose. Alléluia ! C’est vrai. Dieu va se fatiguer de secouer des dons devant vous d’ici peu. Nous restons assis, paralysés."], ["p", "On voit Oral Roberts, et les autres, guérir les malades, et de grands signes et de grands prodiges du Messie ressuscité, et les gens restent assis et disent : «Eh bien, je ne sais pas.» Voyez ?"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>59-1216 Qu’est-ce que le Saint-Esprit ?<\/b>"], ["p", "1 …difficilement pour une réunion. Cette réunion sera une réunion un peu différente de ce que nous avons l’habitude d’avoir ici. Presque chaque fois que nous nous rassemblons ici, c’est une réunion de… pour la guérison des malades et pour les… des besoins physiques. C’est… C’est là-dessus que l’accent est mis. Mais, ce soir, nous avons commencé ce réveil pour la guérison de l’âme, le–l’esprit de l’homme."], ["p", "Toutefois, le Seigneur voulant, dimanche matin, à l’école du dimanche, dimanche matin, nous allons prier pour les malades et tenir une ligne de guérison comme d’habitude, pour dimanche matin, le Seigneur voulant. Et pendant ces soirées, au cours de la semaine, nous sentons un grand empressement de parler des choses éternelles pour la–l’âme."], ["p", "2 Or, nous savons que quand un–un corps est guéri, ça nous rend tous heureux, car nous savons que ça montre, de façon certaine, que notre Dieu guérit les malades. Mais ces personnes malades, s’elles vivent assez longtemps, il se peut qu’elles tombent encore malades, peut-être de cette même maladie dont elles ont été guéries. Et ça, ça n’enlève pas la guérison. Le médecin peut donner un médicament contre la pneumonie, et il se peut que, deux jours plus tard, on meure d’une pneumonie, après qu’il les a déclarés guéris. Elle revient de nouveau. Mais quand cette âme est guérie, alors vous avez en vous la Vie Eternelle."], ["rev", "Rev. William Marrion Branham"], ["p", "DEMONOLOGIE DOMAINE PHYSIQUE PARAGRAPHE 34"], ["ref", "<b>60-0515<\/b><b><sup>E<\/sup><\/b><b> L’adoption #1<\/b>"], ["p", "53 Et maintenant, après que vous êtes entrés, ça ne veut pas dire que vous êtes épargnés des guerres. Vous devez encore vous battre pour chaque pouce de terrain que vous occupez. Alors, vous voyez, Canaan ne représentait pas le glorieux Ciel, parce qu’il y a là des guerres, des problèmes, des massacres, des batailles, et tout. Mais voici ce qu’il représentait : il faut que ce soit une marche parfaite."], ["ref", "<b>60-0515<\/b><b><sup>E<\/sup><\/b><b> L’adoption #1<\/b>"], ["p", "54 C’est là que l’église échoue aujourd’hui, pendant cette marche. Savez-vous que même votre propre conduite peut empêcher quelqu’un d’autre d’être guéri ? Votre mauvaise conduite c’est-à-dire vos péchés non confessés à vous, les croyants  peut être la cause d’un échec amer pour cette église. Et, au jour du Jugement, vous serez responsable de tout cela. Oh ! vous direz : « Bon, un instant, Frère Branham. » Eh bien, c’est la vérité. Pensez-y !"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu n’enverra pas la bénédiction sur un péché", "i": [["ref", "<b>53-0329 Israël Et l’Eglise #5 (Israël dans sa patrie)<\/b>"], ["p", "30 Eh bien, voyez-vous, malgré toutes ces prières, tous ces faits de taper du pied, tous ces faits de chasser les mauvais esprits, elle cachait un péché tout au fond de son cœur ; elle ne voulait dire à personne qu’elle l’avait commis, mais le Saint-Esprit a révélé le secret de son cœur. Elle est allée arranger cela, c’est alors qu’elle a été purifiée. Dieu n’enverra pas la bénédiction sur le péché. Vous devez arranger la chose en premier lieu. C’est juste"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "La racine qui tue les gens aujourd’hui", "i": [["ref", "<b>63-0626 Pourquoi ?<\/b>"], ["p", "131 Notre maladie numéro un, la maladie du cœur, ce n’est pas la cause principale de la mort des gens aujourd’hui. C’est le numéro un, la maladie du péché. Et le péché, c’est l’incrédulité. L’incrédulité à quoi ? A la Bible. C’est vrai. Oui, c’est la maladie du péché qui est le numéro un, qui tue les gens aujourd’hui, tant spirituellement que… Et cela les tuera évidemment  physiquement, parce que c’est déjà prouvé que l’homme qui garde rancune, et la femme qui s’agite et se met dans tous ses états, qui se querelle et se dispute, ils en meurent. Cela cause le cancer, une infection fongus et tout le reste qui s’établit, les ulcères."], ["p", "132 Voyez, vous avez été créés pour être heureux et libres. Vous avez été créés pour vivre comme des enfants devant votre Père, sachant que chaque jour, Il fait bien marcher tout pour vous chaque jour. Oui, oui."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "UNE VIE SANCTIFIÉE EST UN TONNERRE", "i": [["p", "<b>APOCALYPSE CHAP 4 3 EME PARTIE PARAGRAPHE 120<\/b>"], ["p", "<b>Que faut-il faire pour mener une vie chrétienne ? Du 13/1/1957 Paragraphe 37<\/b>"], ["p", "<b>Q/R SUR LA GENESE PARAGRAPHE  63  les 7 esprits que jésus a chassé  chez Marie de magdala  Luc 8 :1-<\/b>"], ["p", "<b>Vivant, mourant, enseveli,ressuscitent, revenant  du 3avril 1959 paragraphe  <\/b>"], ["ref", "<b>50-0815 L’Attitude et qui est Dieu ?<\/b>"], ["p", "10 Les soirées sont appréciées. Je me fatigue, naturellement, et je me fatigue de plus en plus. C'est une vérité que je crois, pendant que l'homme physique dépérit, l'homme spirituel trouve une issue. C'est à cela que servent les jeûnes et autres. Il peut avoir la possibilité d'agir sur nos cinq sens, pour nous amener à croire et à avoir foi en Lui."], ["p", "J'aime l'attitude de ce centenier ce soir, ce que nous venons de lire. Il - il était un homme qui se sentait indigne. Tant que vous vous sentez indigne de la bénédiction que vous demandez, vous êtes bien sur le point de la recevoir. Mais lorsque vous en arrivez à penser que Dieu vous doit tout simplement cela, c'est là que vous - vous faites erreur. C'est nous qui sommes redevables à Dieu, ce n'est pas Dieu qui nous doit. C'est nous qui Lui devons."], ["rev", "<b>Rev. William Marrion Branham<\/b>"]]}, {"t": "Servir Dieu avec légèreté", "i": [["ref", "<b>56-1215 Ecoutez-Le<\/b>"], ["p", "16 Maintenant, dans cet état beaucoup de fois... Jésus ne viens jamais là où les gens sont rassemblés juste pour le plaisir de le faire. Christ n'a jamais fait quelque chose avec légèreté. Et je pense que c'est cela le problème de l'église aujourd'hui. Nous prenons les choses de Dieu trop à la légère. Et maintenant, je perçois que c'est un rassemblement des pentecôtistes. Et écoutez, vous êtes mes frères et mes soeurs. Mais les pentecôtistes y vont trop légèrement avec les dons qui sont dans l'église, et c'est la raison pour laquelle Dieu ne peut pas les honorer. Voyez? Vous avez simplement laissé les gens aller de n'importe quelle manière. Ils devraient être dirigés et mis être mis en ordre."], ["p", "Et nous trouvons des gens qui interrompent la réunion en parlant en langues et tout, alors que \" les esprits des prophètes sont soumis au prophète. \" Je ne dis pas qu'ils n'ont pas de dons, mais ils utilisent mal cela, et cela gâche les choses . Si le Saint-Esprit parle à un endroit, Il parlera là jusqu'à ce qu'Il ait terminé. Voyez?"], ["p", "Et nous utilisons donc mal ces choses, en les laissant juste aller avec négligence. C'est pratiquement ce que le diable voudrait aussi faire. C'est vrai. Si ces...?... les dons étaient mis en ordre, et à leur place, il y aurait aujourd'hui un réveil jamais égalé qui balayerait cette contrée. Nous ne manquons pas de puissance; nous manquons de connaissance. Nous manquons de foi. Vous avez la puissance. Tout homme qui est né de nouveau a - le ciel entier lui est ouvert."], ["rev", "Rev. William Marrion Branham"], ["p", "¹¹p"], ["ref", "59-0408 L’Aveugle Bartimée"], ["p", "17 Elie ceignit alors ses reins et partit avec la femme. Et comme il arrivait à la maison, il n’avait pas un grand soutien spirituel, car les gens marchaient dans la maison en pleurant et en faisant beaucoup de bruit. Et Elie est entré, les a tous fait sortir et a refermé la porte derrière lui."], ["p", "Eh bien, il n’a pas prié. Il a fait les cent pas dans la pièce, attendant que l’onction vienne sur lui, observant de travers ce petit corps froid de l’enfant étendu là, mais il a attendu que le Saint-Esprit le touche. Il marchait de long en large dans la pièce, et quand il a senti l’Esprit du Dieu vivant venir sur lui, il s’est étendu sur le petit enfant, a mis ses lèvres sur les siennes, son nez sur le sien, ses mains sur les siennes, et l’enfant éternua sept fois et revint à la vie. Il le remit à sa mère."], ["p", "Quand le Saint-Esprit vient, le passage de la mort à la vie se produit. C’est ce qu’Il fait. Il fait passer de la mort à la vie, physiquement et spirituellement. Quand le Saint-Esprit vient, Il prend le cancer, le condamne et le chasse. Pour Sa gloire, Il prend la mort qui œuvre dans votre corps et la condamne pour épargner votre vie. Quand le Saint-Esprit descend, Il prend le pécheur qui était loin de Dieu, loin de Christ, et sujet de l’enfer, Il le nettoie de toute injustice et fait de lui un fils du Dieu vivant."], ["rev", "Rev. William Marrion Branham"], ["p", "10 Et là, elle avait un cancer du coeur, du côlon et du foie. Et on lui avait donné quelques heures à vivre. Et lorsqu’elle est entrée dans la ligne de prière, elle était à deux pâtées de maisons, et sa vie la quittait. Elle a dit: «Amenez-moi, même si je meurs, ma requête, c’est d’arriver devant ce frère.»"], ["p", "Et on m’a dit, après qu’elle était arrivée à la porte, on lui a couvert le visage, on a dit qu’il y avait un cadavre dans la salle."], ["p", "Eh bien, ils sont passés, son mari pleurait. Et j’ai vu cette femme, je l’ai tenue par la main, j’ai palpé son pool. Elle... Apparemment, elle était froide. Je ne sais quel était son état. Et je me suis mis à prier pour elle, et j’ai demandé à Dieu de lui redonner la vie à cause de sa grande foi. Et peu après, elle s’est relevée de la civière et est rentrée chez elle."], ["ref", "50-0816 Regarder à l’invisible"], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Sois à ta place, là où Dieu t’a placé", "i": [["ref", "<b>55-1004 Venez Et Plaidons (Les Dons Et Les Appels Sont Sans Repentance)<\/b>"], ["p", "18 Eh bien, il y a aussi des images , des images  en direct qui traversent cette salle. Savez-vous cela ? Allumez la télévision. Maintenant, qu’arriverait-il si tout le mobilier dans la maison, s’il y avait la télévision, la radio, le réfrigérateur, et le – le canapé et d’autres, le – le – le, oh, tout le mobilier qu’il y a dans la maison… Eh bien, alors l’un, la radio, peut capter une voix, mais elle ne peut pas capter l’image. La télévision peut capter l’image, mais elle ne peut pas être le réfrigérateur. Voyez ?"], ["p", "Nous avons tous différents rôles. Dieu a placé le mobilier dans la maison. Eh bien, et si vous voyez la télévision dire : «Je ne serai plus la télévision, si je ne peux pas être un réfrigérateur.» Voyez ? La télévision ferait une erreur. Mais si nous tous, nous découvrons notre appel en Dieu et que nous restons là ! Voyez ? Dieu sait quand nous utiliser, et comment nous utiliser. Et – et il ne faut pas que nous sautions ici et là. Soyez là où Dieu vous a placé. Soyez original. Soyez juste ce que Dieu veut que vous soyez."], ["rev", "Rev. William Marrion Branham"]]}, {"t": "Dieu nous a placés ici dans un but ; ne méprisez pas l’endroit où Dieu vous a placés", "i": [["ref", "<b>63-0421 Jour de Victoire<\/b>"], ["p", "79 Et chacun de nous est né pour quelque chose. Nous n'avons pas été placés ici pour rien."], ["p", "Cette montagne ne s'est tout simplement pas trouvée là pour rien. Cet arbre a été placé là dans un but. Tout a un but. Tout doit servir. Et nous sommes ici dans un but. Il se pourrait que ce soit pour témoigner à quelqu'un pour qu'il soit sauvé. Et de là peut provenir un prédicateur qui enverrait un million d'âmes à Christ."], ["p", "0 Considérez la conversion de Dwight Moody, et de beaucoup d'autres. Vous voyez? C'était juste une petite vieille femme avec un… Une petite vieille lavandière qui avait un message dans le coeur, faire quelque chose pour Dieu. Elle loua une vieille écurie, elle fit venir un prédicateur pour que celui-ci prêche. Et il n'y a eu là qu'un pauvre petit garçon avec les cSupporter Dieu avec tout ce que vous avais eveux qui lui tombait jusqu'au cou, il portait les bretelles de son père. Il s'avança là et s'agenouilla à l'autel ce soir-là. Et c'est Dwight Moody qui a envoyé un demi-millions d'âmes à Jésus-Christ. Voyez-vous? Cette femme avait quelque chose à faire. Elle… C'était dans un but. Elle fut faite une lavandière dans un but."], ["p", "Ne méprisez pas l'endroit où Dieu vous a placés, mais accomplissez votre but. Il y aura un grand jour de victoire l'un de ces jours, lorsque la bataille sera terminée."], ["ref", "63-0421 Jour de Victoire"], ["rev", "Rev. William Marrion Branham"], ["ref", "<b>58-0620 La Reine Du Midi<\/b>"], ["p", "39 Vous y êtes! Si seulement le peuple des Etats-Unis pouvait être autant sincère pour voir si Dieu a promis qu’Il déverserait le Saint-Esprit dans les derniers jours sur Son peuple, sur Son Eglise, avec des signes, des prodiges et des miracles, et qu’Il appellerait un peuple du milieu des Gentils pour porter Son Nom. Par contre, ils prennent à la place un vieux credo mort (c’est juste), quelque chose d’historique. Alors l’histoire... S’Il n’est pas le même Dieu aujourd’hui, alors Il n’est pas Dieu, Il est mort. Mais grâces soient rendues à Dieu, Il est toujours le même Dieu."], ["p", "Ainsi elle était déterminée à aller voir. Eh bien, elle devait faire face à bien des choses, pour pouvoir y aller. Et alors, elle s’est décidée; elle a dit: «Maintenant, je suis excommuniée de toute façon, à cause de ça. Ainsi donc, si j’y vais... Je supporte cette histoire jusque là; je vais amener avec moi de l’or; et si c’est la vérité, je vais soutenir cela. Si ce n’est pas la vérité, je vais laisser tomber cela.»"], ["p", "Si seulement les gens avaient des pensées aussi élevées aujourd’hui, au lieu de placer tout leur argent dans une sorte de rituel ou de credo mort (la construction des églises équivalant à des millions de dollars au lieu de soutenir des missionnaires pour faire parvenir l’Evangile aux gens, un Dieu vivant, un Christ ressuscité), vous seriez un peuple plus avisé, les amis. Ne mettez pas votre argent dans quelque chose qui n’est rien qu’un tas de fanatisme; ne soutenez pas quelque chose qui est mort et qui sent mauvais. Soutenez Christ, le Dieu vivant. Placez votre... pas seulement votre argent, mais votre temps, vos prières, vos efforts, votre talent, tout ce que vous avez, donnez-le-Lui."], ["p", "Elle a dit: «Je vais charger ces chameaux de myrrhe et d’encens, je vais charger ces chameaux d’or et d’argent. Et si la chose est la vérité, à savoir que ce Dieu vivant a un témoignage vivant, alors je vais soutenir cela. Mais si ce n’est pas le cas, je vais ramener mon or.» C’est une bonne chose à faire; c’est une bonne pensée."], ["rev", "Rev. William Marrion Branham"]]}], "T": []}</script>

 th.forEach(x=>x.subs.sort((a,b)=>col.compare(sub(a).t,sub(b).t)));th.sort((a,b)=>col.compare(a.t,b.t));return th}

 const b=el('div','b');d.append(h,b);if(OP.has(k)){d.classList.add('o');fill(b,k)}return d}

<script>
/* ===== SYNCHRONISATION FIREBASE (optionnelle, quand internet est disponible) ===== */
(()=>{
const $=id=>document.getElementById(id);
const st=$('fbst'),bt=$('fbbtn');
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const w=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const setSt=t=>{st.textContent=t};
const cfg=window.FIREBASE_CONFIG;
if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey==='VOTRE_API_KEY'){
 setSt('Hors ligne · notes sur cet appareil');
 bt.onclick=()=>alert('Une connexion internet est nécessaire pour synchroniser.');return}
firebase.initializeApp(cfg);
const auth=firebase.auth(),fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const provider=new firebase.auth.GoogleAuthProvider();
window.PM_FB={reauth:async()=>(await auth.signInWithPopup(provider)).user.uid};
let user=null;
const EMPTY={th:[],tn:{},c:[],e:{},p:{},a:{},mv:{},n:1};
async function sync(){
 if(!user||!DB)return;
 if(!navigator.onLine){setSt(user.email+' · hors ligne, synchro plus tard');return}
 setSt(user.email+' · synchronisation…');
 try{
  const snap=await DB.get({source:'server'});
  const ct=snap.exists?(snap.data().t||0):0,lt=+(g('notes_t')||0),has=JSON.stringify(U).length>120;
  if(snap.exists&&(ct>lt||(ct===lt&&!has))){
   U=Object.assign({},EMPTY,JSON.parse(snap.data().v));
   w('notes',JSON.stringify(U));w('notes_t',String(ct));BN={};render();
  }else if((snap.exists&&lt>ct)||(!snap.exists&&has)){
   const t=lt||Date.now();await DB.set({v:JSON.stringify(U),t});w('notes_t',String(t));
  }
  setSt(user.email+' · synchronisé ✓');
 }catch(e){setSt(user.email+' · synchro en attente')}
}
bt.onclick=async()=>{
 if(auth.currentUser){await auth.signOut();return}
 try{await auth.signInWithPopup(provider)}
 catch(e){
  if(e.code==='auth/popup-blocked'){auth.signInWithRedirect(provider)}
  else if(e.code==='auth/network-request-failed'){alert('Une connexion internet est nécessaire pour se connecter à Google.')}
  else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){alert('Connexion impossible : '+e.code)}
 }};
auth.onAuthStateChanged(u=>{
 user=u;
 if(!u){DB=null;setSt('Notes sur cet appareil');bt.textContent='Synchroniser avec Google';return}
 const ow=g('owner_uid');
 if(ow&&ow!==u.uid){alert('Ce bloc-note est lié à un autre compte Google.');auth.signOut();return}
 if(!ow)w('owner_uid',u.uid);
 bt.textContent='Déconnecter Google';
 DB=fs.collection('users').doc(u.uid).collection('notes').doc('main');
 sync();
});
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
})();
</script>
